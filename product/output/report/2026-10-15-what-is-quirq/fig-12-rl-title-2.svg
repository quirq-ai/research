<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 196" role="img" aria-label="The same benchmark at ten submissions from a hundred samples. Llama 3.1 8B rises from 24.8 to 28.7 per cent and Llama 3.1 70B from 50.3 to 54.5 — a much smaller gain than at the small sample budget."><style>line { opacity: 0.3; }
.rl-axis { stroke: #b8b8b1; stroke-width: 1; }
.rl-line { fill: none; stroke: #2f6ea4; stroke-width: 2; stroke-linecap: round; }
.rl-dot { stroke: #ffffff; stroke-width: 2; }
.rl-dot.is-before { fill: #777772; }
.rl-dot.is-after { fill: #2f6ea4; }
.rl-name { fill: #4f4f4b; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9.5px; }
.rl-val { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; }
.rl-val.is-after { fill: #252525; font-size: 11.5px; font-weight: 700; }
.rl-x { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9.5px; }</style><rect x="0.0" y="0.0" width="340.0" height="196.0" fill="#ffffff"/>
                    <line class="rl-axis" x1="96" x2="330" y1="160" y2="160"></line>
                    <path class="rl-line" d="M 100.0 107.9 L 250.0 99.7"></path><circle class="rl-dot is-before" cx="100.0" cy="107.9" r="4"></circle><circle class="rl-dot is-after" cx="250.0" cy="99.7" r="4.5"></circle><text class="rl-name" text-anchor="end" x="92" y="111.4">Llama 3.1 8B</text><text class="rl-val" text-anchor="start" x="104" y="98.9">24.8</text><text class="rl-val is-after" x="258" y="103.2">28.7</text>
                    <path class="rl-line" d="M 100.0 54.4 L 250.0 45.5"></path><circle class="rl-dot is-before" cx="100.0" cy="54.4" r="4"></circle><circle class="rl-dot is-after" cx="250.0" cy="45.5" r="4.5"></circle><text class="rl-name" text-anchor="end" x="92" y="57.9">Llama 3.1 70B</text><text class="rl-val" text-anchor="start" x="104" y="45.4">50.3</text><text class="rl-val is-after" x="258" y="49.0">54.5</text>
                    <text class="rl-x" text-anchor="middle" x="100" y="180">base model</text>
                    <text class="rl-x" text-anchor="middle" x="250" y="180">after RL</text>
                  </svg>
