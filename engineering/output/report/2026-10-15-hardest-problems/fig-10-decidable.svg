<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 68 1000 240" role="img" aria-label="A spectrum from decidable to undecidable, placing the complex numbers, reals and p-adics on the decidable side, the rationals as open, and rings of integers, the integers and function fields as undecidable"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }
.svg-big { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }</style><rect x="0.0" y="68.0" width="1000.0" height="240.0" fill="#ffffff"/>
                <line stroke="#252525" stroke-width="1.6" x1="40" x2="960" y1="200" y2="200"></line>
                <polyline fill="none" points="950,194 962,200 950,206" stroke="#252525" stroke-width="1.6"></polyline>
                <text class="svg-lane" x="40" y="228">DECIDABLE — AN ALGORITHM ANSWERS EVERY INSTANCE</text>
                <text class="svg-lane" text-anchor="end" x="960" y="228">UNDECIDABLE — NO ALGORITHM CAN</text>

                <rect fill="#dfede5" height="56" rx="8" stroke="#367f59" stroke-width="1.4" width="96" x="60" y="96"></rect>
                <text class="svg-big" text-anchor="middle" x="108" y="122">C</text>
                <text class="svg-sub" text-anchor="middle" x="108" y="142">DECIDABLE</text>
                <line stroke="#b8b8b1" stroke-width="1" x1="108" x2="108" y1="152" y2="196"></line>
                <circle cx="108" cy="200" fill="#367f59" r="4"></circle>

                <rect fill="#dfede5" height="56" rx="8" stroke="#367f59" stroke-width="1.4" width="96" x="192" y="96"></rect>
                <text class="svg-big" text-anchor="middle" x="240" y="122">R</text>
                <text class="svg-sub" text-anchor="middle" x="240" y="142">DECIDABLE</text>
                <line stroke="#b8b8b1" stroke-width="1" x1="240" x2="240" y1="152" y2="196"></line>
                <circle cx="240" cy="200" fill="#367f59" r="4"></circle>

                <rect fill="#dfede5" height="56" rx="8" stroke="#367f59" stroke-width="1.4" width="104" x="318" y="96"></rect>
                <text class="svg-big" text-anchor="middle" x="370" y="122">Q</text>
                <text class="svg-sub" dx="10" dy="4" x="370" y="122">p</text>
                <text class="svg-sub" text-anchor="middle" x="370" y="142">DECIDABLE</text>
                <line stroke="#b8b8b1" stroke-width="1" x1="370" x2="370" y1="152" y2="196"></line>
                <circle cx="370" cy="200" fill="#367f59" r="4"></circle>

                <rect fill="#f7e3c8" height="66" rx="8" stroke="#d98226" stroke-width="2" width="120" x="488" y="86"></rect>
                <text class="svg-big" text-anchor="middle" x="548" y="116">Q</text>
                <text class="svg-sub" text-anchor="middle" x="548" y="138">OPEN SINCE 1970</text>
                <line stroke="#d98226" stroke-width="1.2" x1="548" x2="548" y1="152" y2="196"></line>
                <circle cx="548" cy="200" fill="#d98226" r="5"></circle>

                <rect fill="#f3dfdc" height="56" rx="8" stroke="#ad4b43" stroke-width="1.4" width="136" x="632" y="96"></rect>
                <text class="svg-big" text-anchor="middle" x="700" y="122">O</text>
                <text class="svg-sub" dx="10" dy="4" x="700" y="122">K</text>
                <text class="svg-sub" text-anchor="middle" x="700" y="142">UNDECIDABLE 2024</text>
                <line stroke="#b8b8b1" stroke-width="1" x1="700" x2="700" y1="152" y2="196"></line>
                <circle cx="700" cy="200" fill="#ad4b43" r="4"></circle>

                <rect fill="#f3dfdc" height="56" rx="8" stroke="#ad4b43" stroke-width="1.4" width="96" x="782" y="96"></rect>
                <text class="svg-big" text-anchor="middle" x="830" y="122">Z</text>
                <text class="svg-sub" text-anchor="middle" x="830" y="142">UNDECIDABLE</text>
                <line stroke="#b8b8b1" stroke-width="1" x1="830" x2="830" y1="152" y2="196"></line>
                <circle cx="830" cy="200" fill="#ad4b43" r="4"></circle>

                <rect fill="#f3dfdc" height="56" rx="8" stroke="#ad4b43" stroke-width="1.4" width="96" x="890" y="96"></rect>
                <text class="svg-big" text-anchor="middle" x="928" y="122">F</text>
                <text class="svg-sub" x="936" y="126">q(t)</text>
                <text class="svg-sub" text-anchor="middle" x="938" y="142">UNDECIDABLE</text>
                <line stroke="#b8b8b1" stroke-width="1" x1="938" x2="938" y1="152" y2="196"></line>
                <circle cx="938" cy="200" fill="#ad4b43" r="4"></circle>

                <text class="svg-note" x="40" y="256">C and R by quantifier elimination (Tarski, 1948) · the p-adics by Ax–Kochen–Ershov, 1965 · Z by Matiyasevich, 1970, completing Davis–Putnam–Robinson.</text>
                <text class="svg-note" x="40" y="276">Rings of integers of number fields fell to two independent 2024 proofs — Koymans–Pagano, and Alpöge–Bhargava–Ho–Shnidman.</text>
                <text class="svg-note" x="40" y="296">The rationals sit in the gap: every completion of Q is decidable, both neighbours in the arithmetic hierarchy are undecidable, and the case has been open for fifty-six years.</text>
              </svg>
