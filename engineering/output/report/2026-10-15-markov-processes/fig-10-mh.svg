<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 452" role="img" aria-label="On the left, the Metropolis-Hastings loop: propose a candidate, compute the acceptance ratio, accept or stay, record the state, repeat. On the right, measured results for four proposal step sizes on a standard normal target: step size 0.1 accepts 96.9 percent of proposals but yields only 9.7 effective samples per thousand; step 0.5 accepts 84.5 percent and yields 45.7; step 2.4 accepts 44.3 percent and yields 222.3; step 10 accepts 12.5 percent and yields 85.4. Bars visualise the effective sample sizes."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="452.0" fill="#ffffff"/>
                <defs>
                  <marker id="mh-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">THE LOOP</text>
                <rect fill="#f7f7f5" height="46" rx="8" stroke="#b8b8b1" width="230" x="10" y="36"></rect>
                <text class="svg-step" x="26" y="64">current state x</text>
                <line marker-end="url(#mh-arr)" stroke="#252525" stroke-width="2" x1="125" x2="125" y1="82" y2="104"></line>
                <rect fill="#e0ebf2" height="46" rx="8" stroke="#3c6f97" width="230" x="10" y="108"></rect>
                <text class="svg-sub" x="26" y="136">propose y ~ q(· | x)</text>
                <line marker-end="url(#mh-arr)" stroke="#252525" stroke-width="2" x1="125" x2="125" y1="154" y2="176"></line>
                <rect fill="#f7e3c8" height="64" rx="8" stroke="#d98226" width="230" x="10" y="180"></rect>
                <text class="svg-sub" x="26" y="204">α = min(1, f(y)q(x|y)</text>
                <text class="svg-sub" x="26" y="228">            ÷ f(x)q(y|x))</text>
                <line marker-end="url(#mh-arr)" stroke="#252525" stroke-width="2" x1="125" x2="125" y1="244" y2="266"></line>
                <rect fill="#dfede5" height="46" rx="8" stroke="#367f59" width="110" x="10" y="270"></rect>
                <text class="svg-sub" x="22" y="298">accept: x ← y</text>
                <rect fill="#f3dfdc" height="46" rx="8" stroke="#ad4b43" width="110" x="130" y="270"></rect>
                <text class="svg-sub" x="142" y="298">reject: keep x</text>
                <line marker-end="url(#mh-arr)" stroke="#252525" stroke-width="2" x1="125" x2="125" y1="316" y2="340"></line>
                <rect fill="#f7f7f5" height="46" rx="8" stroke="#b8b8b1" width="230" x="10" y="344"></rect>
                <text class="svg-step" x="26" y="372">record x, repeat</text>
                <path d="M240 367 C 300 367 300 59 246 59" fill="none" marker-end="url(#mh-arr)" stroke="#252525" stroke-dasharray="5 4" stroke-width="1.6"></path>
                <text class="svg-note" x="0" y="412">A rejection still emits a sample. The</text>
                <text class="svg-note" x="0" y="434">normalising constant of f never appears.</text>

                <line stroke="#deded9" x1="330" x2="330" y1="10" y2="452"></line>

                <text class="svg-lane" x="360" y="18">MEASURED · TARGET N(0,1), GAUSSIAN PROPOSAL, 200,000 DRAWS</text>
                <text class="svg-sub" x="360" y="52">step σ   accept    τ_int    effective samples / 1000</text>
                <line stroke="#deded9" x1="360" x2="1110" y1="62" y2="62"></line>

                <text class="svg-sub" x="360" y="90">0.1      0.969    103.2</text>
                <rect fill="#ad4b43" height="18" width="8" x="760" y="76"></rect><text class="svg-sub" x="784" y="90">9.7</text>
                <text class="svg-sub" x="360" y="128">0.5      0.845     21.9</text>
                <rect fill="#d98226" height="18" width="37" x="760" y="114"></rect><text class="svg-sub" x="810" y="128">45.7</text>
                <text class="svg-sub" x="360" y="166">2.4      0.443      4.5</text>
                <rect fill="#367f59" height="18" width="178" x="760" y="152"></rect><text class="svg-sub" x="950" y="166">222.3  ← best</text>
                <text class="svg-sub" x="360" y="204">10.0     0.125     11.7</text>
                <rect fill="#3c6f97" height="18" width="68" x="760" y="190"></rect><text class="svg-sub" x="842" y="204">85.4</text>

                <rect fill="#f7f7f5" height="92" rx="8" stroke="#deded9" width="754" x="356" y="228"></rect>
                <text class="svg-sub" x="372" y="254">Too small a step: almost everything is accepted and nothing moves —</text>
                <text class="svg-sub" x="372" y="276">a 96.9% acceptance rate is a warning sign, not a success.</text>
                <text class="svg-sub" x="372" y="302">Too large: the chain proposes into the tails and stands still 87.5% of the time.</text>

                <rect fill="#dfede5" height="80" rx="8" stroke="#367f59" width="754" x="356" y="332"></rect>
                <text class="svg-sub" x="372" y="358">Theory (Roberts–Gelman–Gilks, 1997): the optimal random-walk scale for a</text>
                <text class="svg-sub" x="372" y="380">one-dimensional Gaussian target is ≈ 2.38σ, at an acceptance rate ≈ 0.44,</text>
                <text class="svg-sub" x="372" y="402">falling to 0.234 in high dimension. Measured here: 0.443 at σ = 2.4.</text>
              </svg>
