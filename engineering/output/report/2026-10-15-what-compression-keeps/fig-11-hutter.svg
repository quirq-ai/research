<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-label="Step chart of compressed enwik9 size in bytes, 90 to 118 million, against submission date from 2019 to 2026. Hutter Prize score (compressor plus self-extracting archive): phda9v1.8, 4 July 2019, 116,673,681 (pre-prize baseline); starlit, 31 May 2021, 115,352,938; fast cmix, 16 July 2023, 114,156,155; fx-cmix, 2 February 2024, 112,578,322; fx2-cmix, 3 September 2024, 110,793,128; then three records in 2026: cmix-lex, 26 June, 109,671,639; cmix-obias, 19 July, 108,521,870; fx2-cmix-T, 24 July, 100,424,672, a 6M-parameter transformer, 7.46% below cmix-obias, awarded 30 September 2026. Large Text Compression Benchmark counts, which omit the compressor of a self-extracting archive: fx2-cmix-T 96,996,198; cmix-neif 1.0, 5 October 2026, 91,913,343, which is 95,914,051 by the Hutter formula and pending; nncp v3.2, October 2023, 107,261,318. Left axis labels give each size in bytes, as the Hutter factor original divided by compressed, and as the LTCB fraction compressed divided by original."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
