<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 1020 476" role="img" aria-label="A lane diagram. The upper lane runs left to right: the Starlark targets package, lucicfg, the four generated pyl files, and the per-builder targets JSON. The lower lane runs waterfalls.pyl and test_suite_exceptions.pyl through generate_buildbot_json.py into one JSON per waterfall, reading the generated pyl files from the upper lane. Between the lanes, autoshard_exceptions.json pushes a shard count of seventy upward into the per-builder JSON, fed by the autosharder builder below it. Both lanes end at the recipe on the right edge, with mb reading gn_args_locations.json beneath it."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
