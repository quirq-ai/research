<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 616" role="img" aria-label="Scatter chart of compression ratio (original ÷ compressed) on the full 211,938,580-byte Silesia corpus, from 2.0× to 4.5×, against speed in MB/s on a log axis from 0.1 to 2,000, for 20 settings of seven codecs. Each setting has a filled marker at its compression speed and a hollow marker at its decompression speed, joined by a line at its ratio; speeds are medians on a 12 MiB sample, read in tiers: below 1, 1 to 10, 10 to 100, 100 to 500, and 500 MB/s or more. Ratio, then compression and decompression MB/s: zlib -1 2.7432×, 50.3 and 185; zlib -6 3.1063×, 17.3 and 186; zlib -9 3.1332×, 8.53 and 197; zstd -5 2.0571×, 320 and 746; zstd 1 2.8948×, 229 and 596; zstd 3 3.2053×, 98.4 and 446; zstd 9 3.5877×, 26 and 481; zstd 19 4.0104×, 1.71 and 438; zstd 22 4.0535×, 1.41 and 404; brotli 1 2.8835×, 133 and 197; brotli 5 3.5582×, 22.4 and 214; brotli 9 3.7375×, 2.47 and 213; brotli 11 4.2031×, 0.309 and 183; xz -0 3.3863×, 8.52 and 50.3; xz -6 4.3067×, 1.69 and 55.2; xz -9 4.347×, 1.61 and 54.3; bzip2 -9 3.8822×, 7.95 and 14.2; lz4 2.1003×, 339 and 1,310; lz4 -9 HC 2.7201×, 17 and 1,310; snappy 2.075×, 357 and 893. A dashed staircase marks the best ratio at each compression tier or faster: 2.8948× (zstd 1) at 100 MB/s and above, 3.5877× (zstd 9) from 10 MB/s, 4.347× (xz -9) from 1 MB/s, and nothing better below 1 MB/s. zstd 3 compresses at about 100 MB/s, on the top tier's edge."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
