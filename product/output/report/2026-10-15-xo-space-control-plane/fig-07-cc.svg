<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-label="Timeline of a claude_code streaming turn"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="430.0" fill="#ffffff"/>
              <text class="svg-lane" x="18" y="26">BEFORE SPAWN</text>
              <line stroke="#deded9" x1="0" x2="1120" y1="38" y2="38"></line>

              <rect fill="#f7e3c8" height="84" rx="7" stroke="#d98226" width="250" x="30" y="52"></rect>
              <text class="svg-num" x="44" y="72">1</text>
              <text class="svg-step" x="62" y="72">Pre-allocate the native id</text>
              <text class="svg-sub" x="44" y="92">a fresh uuid4 is written to the index</text>
              <text class="svg-sub" x="44" y="107">and passed as --session-id, so the</text>
              <text class="svg-sub" x="44" y="122">JSONL filename is known at t=0</text>

              <rect fill="#f7f7f5" height="84" rx="7" stroke="#deded9" width="250" x="300" y="52"></rect>
              <text class="svg-num" x="314" y="72">2</text>
              <text class="svg-step" x="332" y="72">Resolve the working dir</text>
              <text class="svg-sub" x="314" y="92">new session ⇒ ~/xo-projects/&lt;agent_id&gt;/</text>
              <text class="svg-sub" x="314" y="107">existing ⇒ the directory stored on the</text>
              <text class="svg-sub" x="314" y="122">entry, so a user's pick is preserved</text>

              <rect fill="#e0ebf2" height="84" rx="7" stroke="#3c6f97" width="250" x="570" y="52"></rect>
              <text class="svg-num" x="584" y="72">3</text>
              <text class="svg-step" x="602" y="72">Sanitize the env</text>
              <text class="svg-sub" x="584" y="92">drop empty/"sk-ant-none" auth vars;</text>
              <text class="svg-sub" x="584" y="107">drop any sk-ant-oat… masquerading as</text>
              <text class="svg-sub" x="584" y="122">an API key; see the note below</text>

              <rect fill="#f7f7f5" height="84" rx="7" stroke="#deded9" width="250" x="840" y="52"></rect>
              <text class="svg-num" x="854" y="72">4</text>
              <text class="svg-step" x="872" y="72">Build argv</text>
              <text class="svg-sub" x="854" y="92">--dangerously-skip-permissions</text>
              <text class="svg-sub" x="854" y="107">--add-dir &lt;ws&gt; --print --verbose</text>
              <text class="svg-sub" x="854" y="122">--output-format stream-json  -p …</text>

              <text class="svg-lane" x="18" y="176">DURING THE STREAM</text>
              <line stroke="#deded9" x1="0" x2="1120" y1="188" y2="188"></line>

              <rect fill="#ece6f3" height="84" rx="7" stroke="#765b98" width="250" x="30" y="202"></rect>
              <text class="svg-num" x="44" y="222">5</text>
              <text class="svg-step" x="62" y="222">system / init</text>
              <text class="svg-sub" x="44" y="242">the very first stdout line carries the</text>
              <text class="svg-sub" x="44" y="257">native session id — persisted inside</text>
              <text class="svg-sub" x="44" y="272">the loop, not after it</text>

              <rect fill="#f7f7f5" height="84" rx="7" stroke="#deded9" width="250" x="300" y="202"></rect>
              <text class="svg-num" x="314" y="222">6</text>
              <text class="svg-step" x="332" y="222">content_block_delta</text>
              <text class="svg-sub" x="314" y="242">text_delta → {"type":"token"} and</text>
              <text class="svg-sub" x="314" y="257">straight out as an SSE text-delta.</text>
              <text class="svg-sub" x="314" y="272">Anything unparseable is skipped.</text>

              <rect fill="#f7f7f5" height="84" rx="7" stroke="#deded9" width="250" x="570" y="202"></rect>
              <text class="svg-num" x="584" y="222">7</text>
              <text class="svg-step" x="602" y="222">result</text>
              <text class="svg-sub" x="584" y="242">carries usage, model id, and the full</text>
              <text class="svg-sub" x="584" y="257">text — used as a fallback when no</text>
              <text class="svg-sub" x="584" y="272">token events were seen at all</text>

              <rect fill="#dfede5" height="84" rx="7" stroke="#367f59" width="250" x="840" y="202"></rect>
              <text class="svg-num" x="854" y="222">8</text>
              <text class="svg-step" x="872" y="222">finally:</text>
              <text class="svg-sub" x="854" y="242">even under cancellation, roll input,</text>
              <text class="svg-sub" x="854" y="257">output, cache-read and cache-write</text>
              <text class="svg-sub" x="854" y="272">tokens onto the index entry</text>

              <line stroke="#deded9" x1="0" x2="1120" y1="316" y2="316"></line>
              <text class="svg-note" x="30" y="342">Why steps 1 and 5 both exist: an SSE disconnect cancels the generator, and the post-loop persistence code then never runs —</text>
              <text class="svg-note" x="30" y="362">orphaning a real transcript on disk with nothing pointing at it. The repo has an investigation document named after the day it</text>
              <text class="svg-note" x="30" y="382">was found. The fix is belt-and-braces: pre-allocate the id before spawning, and patch it again the instant it is observed.</text>
              <text class="svg-note" x="30" y="410">_patch_native_session_id is idempotent and refuses to clobber a different existing id — a resumed session keeps its own.</text>
            </svg>
