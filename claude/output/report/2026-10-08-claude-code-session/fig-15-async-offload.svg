<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 376" role="img" aria-label="A sequence diagram with three lifelines: the session, your app's MCP server, and the job runner. The session calls submit_job and immediately receives a job ID, then ends its turn. The runner works for twenty minutes. On completion the MCP server emits a channel notification, or a child process posts to the inbox socket. The session starts a new turn, calls get_result, and continues."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1080.0" height="376.0" fill="#ffffff"/>
                <defs>
                  <marker id="fao-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#252525"/></marker>
                  <marker id="fao-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f97"/></marker>
                  <marker id="fao-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#765b98"/></marker>
                </defs>
                <text x="160" y="22" text-anchor="middle" class="svg-lane">SESSION</text>
                <text x="540" y="22" text-anchor="middle" class="svg-lane">YOUR MCP SERVER</text>
                <text x="920" y="22" text-anchor="middle" class="svg-lane">JOB RUNNER</text>
                <line x1="160" y1="32" x2="160" y2="366" stroke="#b8b8b1" stroke-width="1"/>
                <line x1="540" y1="32" x2="540" y2="366" stroke="#b8b8b1" stroke-width="1"/>
                <line x1="920" y1="32" x2="920" y2="366" stroke="#b8b8b1" stroke-width="1"/>

                <rect x="146" y="44" width="28" height="100" fill="#f7e3c8" stroke="#d98226"/>
                <text x="20" y="62" class="svg-sub">turn 1</text>
                <line x1="176" y1="64" x2="534" y2="64" stroke="#252525" stroke-width="2" marker-end="url(#fao-k)"/>
                <text x="190" y="58" class="svg-sub">tools/call mcp__ci__submit_job {branch}</text>
                <line x1="546" y1="80" x2="914" y2="80" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#fao-b)"/>
                <text x="560" y="74" class="svg-sub">enqueue</text>
                <line x1="534" y1="100" x2="176" y2="100" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#fao-b)"/>
                <text x="190" y="94" class="svg-sub">{job_id: "j-412", eta: "20m"}, in 80 ms</text>
                <text x="190" y="124" class="svg-note">Claude tells the user it is running and ends the turn</text>

                <rect x="906" y="96" width="28" height="150" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="946" y="176" class="svg-sub">20 minutes</text>
                <text x="190" y="190" class="svg-note">session idle: no tokens spent while waiting</text>

                <line x1="914" y1="244" x2="546" y2="244" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#fao-b)"/>
                <text x="560" y="238" class="svg-sub">done: 2 failures</text>
                <path d="M 534 262 L 176 262" fill="none" stroke="#765b98" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fao-p)"/>
                <text x="190" y="256" class="svg-sub">notifications/claude/channel {content, meta: {job_id}}</text>

                <rect x="146" y="270" width="28" height="86" fill="#f7e3c8" stroke="#d98226"/>
                <text x="20" y="290" class="svg-sub">turn 2</text>
                <line x1="176" y1="306" x2="534" y2="306" stroke="#252525" stroke-width="2" marker-end="url(#fao-k)"/>
                <text x="190" y="300" class="svg-sub">tools/call mcp__ci__get_result {job_id}</text>
                <line x1="534" y1="330" x2="176" y2="330" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#fao-b)"/>
                <text x="190" y="324" class="svg-sub">structured result</text>
                <text x="190" y="350" class="svg-note">without --channels: a child posts to $CLAUDE_CODE_MESSAGING_SOCKET instead</text>
              </svg>
