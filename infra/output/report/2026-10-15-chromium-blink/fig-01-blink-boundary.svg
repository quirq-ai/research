<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 382" role="img" aria-label="Three horizontal lanes. The renderer main thread carries stages one to seven: Animate, Style, Layout, Pre-paint, Scroll, Paint, Commit. A heavy vertical rule after Commit is labelled Blink's boundary. The renderer compositor thread carries Layerize, Raster and Activate, with dashed ghost boxes showing that Animate and Scroll may run there instead. The Viz process carries Aggregate and Draw. A panel under the main-thread lane lists the DocumentLifecycle state names."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="382.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-blink-boundary-arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="fig-blink-boundary-arr-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>

                <text class="svg-lane" x="8" y="18">BLINK · THIRD_PARTY/BLINK</text>
                <text class="svg-lane" style="fill:#252525" text-anchor="middle" x="648" y="18">BLINK'S BOUNDARY · COMPOSITOR COMMIT</text>
                <text class="svg-lane" x="880" y="18">cc + VIZ · AFTER COMMIT</text>
                <line stroke="#252525" stroke-width="3" x1="648" x2="648" y1="30" y2="344"></line>

                <text class="svg-lane" x="8" y="46">RENDERER PROCESS · MAIN THREAD</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" width="78" x="8" y="56"></rect>
                <text class="svg-num" x="17" y="74">01</text><text class="svg-step" x="17" y="94">Animate</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" width="78" x="100" y="56"></rect>
                <text class="svg-num" x="109" y="74">02</text><text class="svg-step" x="109" y="94">Style</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" width="78" x="192" y="56"></rect>
                <text class="svg-num" x="201" y="74">03</text><text class="svg-step" x="201" y="94">Layout</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" width="78" x="284" y="56"></rect>
                <text class="svg-num" x="293" y="74">04</text><text class="svg-step" x="293" y="94">Pre-paint</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" width="78" x="376" y="56"></rect>
                <text class="svg-num" x="385" y="74">05</text><text class="svg-step" x="385" y="94">Scroll</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" width="78" x="468" y="56"></rect>
                <text class="svg-num" x="477" y="74">06</text><text class="svg-step" x="477" y="94">Paint</text>
                <rect fill="#e0ebf2" height="46" rx="6" stroke="#3c6f97" stroke-width="2" width="78" x="560" y="56"></rect>
                <text class="svg-num" x="569" y="74">07</text><text class="svg-step" x="569" y="94">Commit</text>
                <path d="M86 75l8 4l-8 4z" fill="#3c6f97"></path><path d="M178 75l8 4l-8 4z" fill="#3c6f97"></path>
                <path d="M270 75l8 4l-8 4z" fill="#3c6f97"></path><path d="M362 75l8 4l-8 4z" fill="#3c6f97"></path>
                <path d="M454 75l8 4l-8 4z" fill="#3c6f97"></path><path d="M546 75l8 4l-8 4z" fill="#3c6f97"></path>

                <rect fill="#f7f7f5" height="58" rx="6" stroke="#deded9" width="636" x="8" y="116"></rect>
                <text class="svg-sub" x="20" y="134">DocumentLifecycle::LifecycleState — the active-document path</text>
                <text class="svg-sub" style="font-size:8.8px" x="20" y="151">kVisualUpdatePending → kInStyleRecalc → kStyleClean → kInPerformLayout → kAfterPerformLayout → kLayoutClean</text>
                <text class="svg-sub" style="font-size:8.8px" x="20" y="166">→ kInCompositingInputsUpdate → kCompositingInputsClean → kInPrePaint → kPrePaintClean → kInPaint → kPaintClean</text>

                <text class="svg-lane" x="8" y="196">RENDERER PROCESS · COMPOSITOR THREAD</text>
                <rect fill="none" height="46" rx="6" stroke="#b8b8b1" stroke-dasharray="5 4" width="78" x="8" y="206"></rect>
                <text class="svg-sub" x="17" y="228">Animate</text><text class="svg-sub" style="font-size:8.8px" x="17" y="243">may run here</text>
                <rect fill="none" height="46" rx="6" stroke="#b8b8b1" stroke-dasharray="5 4" width="78" x="376" y="206"></rect>
                <text class="svg-sub" x="385" y="228">Scroll</text><text class="svg-sub" style="font-size:8.8px" x="385" y="243">may run here</text>
                <rect fill="#dfede5" height="46" rx="6" stroke="#367f59" width="78" x="652" y="206"></rect>
                <text class="svg-num" x="661" y="224">08</text><text class="svg-step" x="661" y="244">Layerize</text>
                <rect fill="#dfede5" height="46" rx="6" stroke="#367f59" width="78" x="744" y="206"></rect>
                <text class="svg-num" x="753" y="224">09</text><text class="svg-step" x="753" y="244">Raster</text>
                <rect fill="#dfede5" height="46" rx="6" stroke="#367f59" width="78" x="836" y="206"></rect>
                <text class="svg-num" x="845" y="224">10</text><text class="svg-step" x="845" y="244">Activate</text>
                <path d="M730 225l8 4l-8 4z" fill="#3c6f97"></path><path d="M822 225l8 4l-8 4z" fill="#3c6f97"></path>

                <text class="svg-lane" x="8" y="280">VIZ PROCESS · ONE FOR ALL OF CHROMIUM</text>
                <rect fill="#ece6f3" height="46" rx="6" stroke="#765b98" width="78" x="928" y="290"></rect>
                <text class="svg-num" x="937" y="308">11</text><text class="svg-step" x="937" y="328">Aggregate</text>
                <rect fill="#ece6f3" height="46" rx="6" stroke="#765b98" width="78" x="1020" y="290"></rect>
                <text class="svg-num" x="1029" y="308">12</text><text class="svg-step" x="1029" y="328">Draw</text>
                <path d="M1006 309l8 4l-8 4z" fill="#3c6f97"></path>

                <path d="M638 79C672 79 691 120 691 206" fill="none" marker-end="url(#fig-blink-boundary-arr-ink)" stroke="#252525" stroke-width="2.5"></path>
                <text class="svg-note" x="702" y="150">property trees + display list — the one edge that crosses</text>
                <path d="M914 229C948 229 967 250 967 290" fill="none" marker-end="url(#fig-blink-boundary-arr-blue)" stroke="#3c6f97" stroke-width="1.5"></path>

                <text class="svg-note" x="8" y="366">thin blue = stage order · thick black = the handoff across the boundary · dashed outline = may run on either thread</text>
              </svg>
