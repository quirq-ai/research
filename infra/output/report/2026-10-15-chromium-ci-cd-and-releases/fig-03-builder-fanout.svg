<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 1020 572" role="img" aria-label="Left: the fifty-one line ci.builder call for Linux Builder, with two boxes below it holding the values inherited from the file's ci.defaults and from ci.star's bucket-wide defaults. Middle: lucicfg. Right: the ten artefacts lucicfg emits, with their paths and line counts. A bottom band shows the run-time resolution chain from bbagent through the bootstrapper at cipd latest, to the recipe bundle at refs slash heads slash main, to the properties file read at the input commit."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-24.0" width="1020.0" height="572.0" fill="#ffffff"/>
      <defs>
        <marker id="fig-builder-fanout-arr-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
        <marker id="fig-builder-fanout-arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
        <marker id="fig-builder-fanout-arr-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
      </defs>

      <text class="svg-lane" x="20" y="28">AUTHORED · 51 LINES</text>
      <text class="svg-lane" x="350" y="28">LUCICFG</text>
      <text class="svg-lane" x="600" y="28">EMITTED · 3,112 LINES</text>

      <rect fill="#e0ebf2" height="112" rx="8" stroke="#3c6f97" width="280" x="20" y="48"></rect>
      <text class="svg-step" x="36" y="72">ci.builder(name = "Linux Builder")</text>
      <text class="svg-sub" x="36" y="92">chromium.linux.star:328-378</text>
      <text class="svg-sub" x="36" y="110">builder_spec · gclient chromium</text>
      <text class="svg-sub" x="36" y="128">gn_args: 6 configs · targets.bundle</text>
      <text class="svg-sub" x="36" y="146">console release/bld · contact e-mail</text>

      <rect fill="#ece6f3" height="148" rx="8" stroke="#765b98" width="280" x="20" y="176"></rect>
      <text class="svg-step" x="36" y="200">inherited · ci.defaults, :20-44</text>
      <text class="svg-sub" x="36" y="220">builder_group chromium.linux</text>
      <text class="svg-sub" x="36" y="238">pool luci.chromium.ci</text>
      <text class="svg-sub" x="36" y="256">cores 8 · os LINUX_DEFAULT</text>
      <text class="svg-sub" x="36" y="274">gardener_rotations CHROMIUM</text>
      <text class="svg-sub" x="36" y="292">tree_closing True · timeout 3 h</text>
      <text class="svg-sub" x="36" y="310">health_spec.default()</text>

