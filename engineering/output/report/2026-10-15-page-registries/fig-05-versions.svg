<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-label="A timeline with two tracks. The upper track is code deploys, the lower is content publishes. Four labelled regions show the four states: code knows a tag no document uses yet, both agree, a document uses a tag the code has deprecated, and a document uses a tag the code no longer has. Arrows mark the safe ordering: ship the renderer first, migrate content second, remove the old renderer third."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="340.0" fill="#ffffff"/>
                <defs>
                  <marker id="ver-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>

                <text class="svg-lane" x="24" y="52">CODE</text>
                <line marker-end="url(#ver-arr)" stroke="#252525" stroke-width="2.4" x1="150" x2="1080" y1="72" y2="72"></line>
                <circle cx="260" cy="72" fill="#367f59" r="7"></circle>
                <text class="svg-sub" x="238" y="52">ship v2</text>
                <circle cx="800" cy="72" fill="#ad4b43" r="7"></circle>
                <text class="svg-sub" x="762" y="52">remove v1</text>

                <text class="svg-lane" x="24" y="292">CONTENT</text>
                <line marker-end="url(#ver-arr)" stroke="#3c6f97" stroke-width="2.4" x1="150" x2="1080" y1="268" y2="268"></line>
                <circle cx="520" cy="268" fill="#3c6f97" r="7"></circle>
                <text class="svg-sub" x="470" y="300">migrate rows</text>

                <rect fill="#dfede5" height="124" rx="8" stroke="#367f59" stroke-width="1.8" width="180" x="160" y="108"></rect>
                <text class="svg-step" x="176" y="134">A · Code ahead</text>
                <text class="svg-sub" x="176" y="158">v2 registered,</text>
                <text class="svg-sub" x="176" y="178">no document uses it</text>
                <text class="svg-sub" x="176" y="206">safe — dead entry</text>

                <rect fill="#e0ebf2" height="124" rx="8" stroke="#3c6f97" stroke-width="1.8" width="180" x="356" y="108"></rect>
                <text class="svg-step" x="372" y="134">B · Both live</text>
                <text class="svg-sub" x="372" y="158">v1 and v2 both</text>
                <text class="svg-sub" x="372" y="178">registered and in use</text>
                <text class="svg-sub" x="372" y="206">safe — plan to exit</text>

                <rect fill="#f7e3c8" height="124" rx="8" stroke="#d98226" stroke-width="1.8" width="180" x="552" y="108"></rect>
                <text class="svg-step" x="568" y="134">C · Deprecated</text>
                <text class="svg-sub" x="568" y="158">v1 renders, warns,</text>
                <text class="svg-sub" x="568" y="178">count is falling</text>
                <text class="svg-sub" x="568" y="206">the gate: count = 0?</text>

                <rect fill="#f3dfdc" height="124" rx="8" stroke="#ad4b43" stroke-width="2" width="180" x="748" y="108"></rect>
                <text class="svg-step" x="764" y="134">D · Orphaned</text>
                <text class="svg-sub" x="764" y="158">documents use a tag</text>
                <text class="svg-sub" x="764" y="178">the registry dropped</text>
                <text class="svg-sub" x="764" y="206">must-ignore saves you</text>

                <path d="M260 84 L260 104" stroke="#367f59" stroke-width="1.6"></path>
                <path d="M520 256 L520 236" stroke="#3c6f97" stroke-width="1.6"></path>
                <path d="M800 84 L800 104" stroke="#ad4b43" stroke-width="1.6"></path>

                <text class="svg-note" x="160" y="330">The only safe order is left to right: register the new renderer, migrate the rows, then delete the old renderer — gated on a query, not on a calendar.</text>
              </svg>
