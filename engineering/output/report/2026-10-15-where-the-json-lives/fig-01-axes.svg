<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-label="Five vertical columns, one per decision axis: data shape, access pattern, consistency need, operational burden, and licence and governance. Each column lists the question it asks and two example poles. A bracket under the first column only, data shape, is labelled 'relational versus NoSQL lives here', showing that the familiar question is a proxy for one axis out of five."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="360.0" fill="#ffffff"/>
                <text class="svg-lane" x="0" y="18">FIVE DECISIONS · ASK THEM IN THIS ORDER</text>

                <rect fill="#e0ebf2" height="220" rx="8" stroke="#3c6f97" stroke-width="2" width="208" x="0" y="36"></rect>
                <text class="svg-num" x="16" y="64">1</text>
                <text class="svg-step" x="36" y="64">Data shape</text>
                <text class="svg-sub" x="16" y="94">rows, documents,</text>
                <text class="svg-sub" x="16" y="114">graphs, series,</text>
                <text class="svg-sub" x="16" y="134">vectors, blobs?</text>
                <text class="svg-note" x="16" y="176">shared keys or</text>
                <text class="svg-note" x="16" y="196">nested, sparse</text>
                <text class="svg-note" x="16" y="216">fields?</text>

                <rect fill="#f7f7f5" height="220" rx="8" stroke="#b8b8b1" width="208" x="228" y="36"></rect>
                <text class="svg-num" x="244" y="64">2</text>
                <text class="svg-step" x="264" y="64">Access pattern</text>
                <text class="svg-sub" x="244" y="94">point reads by key,</text>
                <text class="svg-sub" x="244" y="114">ad-hoc filters,</text>
                <text class="svg-sub" x="244" y="134">scans, appends?</text>
                <text class="svg-note" x="244" y="176">which reads must</text>
                <text class="svg-note" x="244" y="196">be fast, and how</text>
                <text class="svg-note" x="244" y="216">often do writes land?</text>

                <rect fill="#f7f7f5" height="220" rx="8" stroke="#b8b8b1" width="208" x="456" y="36"></rect>
                <text class="svg-num" x="472" y="64">3</text>
                <text class="svg-step" x="492" y="64">Consistency</text>
                <text class="svg-sub" x="472" y="94">what does a lost</text>
                <text class="svg-sub" x="472" y="114">or stale write</text>
                <text class="svg-sub" x="472" y="134">cost you?</text>
                <text class="svg-note" x="472" y="176">a counter off by one,</text>
                <text class="svg-note" x="472" y="196">or money moved</text>
                <text class="svg-note" x="472" y="216">twice?</text>

                <rect fill="#f7f7f5" height="220" rx="8" stroke="#b8b8b1" width="208" x="684" y="36"></rect>
                <text class="svg-num" x="700" y="64">4</text>
                <text class="svg-step" x="720" y="64">Operations</text>
                <text class="svg-sub" x="700" y="94">backups, upgrades,</text>
                <text class="svg-sub" x="700" y="114">failover, on-call:</text>
                <text class="svg-sub" x="700" y="134">who runs it?</text>
                <text class="svg-note" x="700" y="176">one process, or</text>
                <text class="svg-note" x="700" y="196">a cluster that</text>
                <text class="svg-note" x="700" y="216">pages someone?</text>

                <rect fill="#f7e3c8" height="220" rx="8" stroke="#d98226" width="208" x="912" y="36"></rect>
                <text class="svg-num" x="928" y="64">5</text>
                <text class="svg-step" x="948" y="64">Licence</text>
                <text class="svg-sub" x="928" y="94">OSI licence, who</text>
                <text class="svg-sub" x="928" y="114">governs it, can</text>
                <text class="svg-sub" x="928" y="134">it change?</text>
                <text class="svg-note" x="928" y="176">Redis, Elastic,</text>
                <text class="svg-note" x="928" y="196">CockroachDB, Scylla</text>
                <text class="svg-note" x="928" y="216">all moved since 2024</text>

                <path d="M0 276 L0 290 L208 290 L208 276" fill="none" stroke="#3c6f97" stroke-width="2"></path>
                <text class="svg-sub" x="0" y="314">"relational vs NoSQL" lives here</text>
                <text class="svg-note" x="0" y="336">a proxy for axis 1 only — silent on the other four</text>
              </svg>
