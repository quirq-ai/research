<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="A store value threaded from START through a STORE node to a LOAD node"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="330.0" fill="#ffffff"/>
              <text class="svg-lane" x="30" y="34">THE SOURCE</text>
              <line stroke="#deded9" x1="30" x2="330" y1="44" y2="44"></line>
              <text class="svg-sub" x="30" y="72">x := … ;</text>
              <text class="svg-sub" x="30" y="94">*ptr1 := x;</text>
              <text class="svg-sub" x="30" y="116">…</text>
              <text class="svg-sub" x="30" y="138">y := *ptr2;</text>
              <text class="svg-sub" x="30" y="160">… y …</text>

              <line stroke="#deded9" x1="380" x2="380" y1="24" y2="306"></line>
              <text class="svg-lane" x="420" y="34">THE GRAPH</text>
              <line stroke="#deded9" x1="420" x2="960" y1="44" y2="44"></line>

              <rect fill="#ffffff" height="30" rx="6" stroke="#252525" stroke-width="1.4" width="110" x="430" y="64"></rect>
              <text class="svg-step" text-anchor="middle" x="485" y="84">START</text>
              <rect fill="#e0ebf2" height="30" rx="6" stroke="#3c6f97" width="90" x="580" y="64"></rect>
              <text class="svg-step" text-anchor="middle" x="625" y="84">x</text>
              <rect fill="#e0ebf2" height="30" rx="6" stroke="#3c6f97" width="90" x="700" y="64"></rect>
              <text class="svg-step" text-anchor="middle" x="745" y="84">ptr1</text>
              <rect fill="#e0ebf2" height="30" rx="6" stroke="#3c6f97" width="90" x="820" y="64"></rect>
              <text class="svg-step" text-anchor="middle" x="865" y="84">ptr2</text>

              <g fill="none" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.9">
                <line x1="485" x2="530" y1="94" y2="160"></line>
                <line x1="590" x2="590" y1="190" y2="242"></line>
              </g>
              <g fill="none" stroke="#3c6f97" stroke-width="1.3">
                <line x1="625" x2="610" y1="94" y2="160"></line>
                <line x1="745" x2="660" y1="94" y2="160"></line>
                <polyline points="865,94 865,226 700,226 700,242"></polyline>
              </g>

              <text class="svg-sub" x="440" y="140">STORE₀</text>
              <rect fill="#ece6f3" height="30" rx="6" stroke="#765b98" stroke-width="1.8" width="180" x="510" y="160"></rect>
              <text class="svg-step" text-anchor="middle" x="600" y="180">STORE</text>
              <text class="svg-sub" x="440" y="222">STORE₁</text>

              <rect fill="#ece6f3" height="30" rx="6" stroke="#765b98" stroke-width="1.8" width="180" x="510" y="242"></rect>
              <text class="svg-step" text-anchor="middle" x="600" y="262">LOAD</text>
              <text class="svg-sub" x="710" y="262">→ y</text>

              <text class="svg-note" x="430" y="304">A LOAD reads a STORE but does not produce one — so two loads of the same memory may be reordered.</text>
            </svg>
