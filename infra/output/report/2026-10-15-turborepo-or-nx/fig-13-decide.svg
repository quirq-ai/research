<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-label="Decision chain of four questions, each with a yes branch to Nx. One: do Gradle, Maven or .NET projects need to share the graph? Two: is CI wall-clock or compute the bottleneck even with a warm remote cache? Three: do you need enforced import boundaries or codemod upgrades across many teams? Four: do you want an agent wired to CI history through MCP? If all four are no, choose Turborepo."><style>.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="330.0" fill="#ffffff"/>
                <defs><marker id="d-ctl" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#252525"></path></marker></defs>
                <g>
                  <rect fill="#f7f7f5" height="96" rx="6" stroke="#b8b8b1" width="250" x="0" y="20"></rect>
                  <text class="svg-num" x="14" y="44">1</text>
                  <text class="svg-step" x="34" y="44">JVM or .NET projects</text>
                  <text class="svg-sub" x="34" y="66">must share the graph</text>
                  <text class="svg-sub" x="34" y="86">with JS/TS?</text>
                  <rect fill="#f7f7f5" height="96" rx="6" stroke="#b8b8b1" width="250" x="280" y="20"></rect>
                  <text class="svg-num" x="294" y="44">2</text>
                  <text class="svg-step" x="314" y="44">CI still slow with a</text>
                  <text class="svg-sub" x="314" y="66">warm remote cache —</text>
                  <text class="svg-sub" x="314" y="86">changed work is the cost?</text>
                  <rect fill="#f7f7f5" height="96" rx="6" stroke="#b8b8b1" width="250" x="560" y="20"></rect>
                  <text class="svg-num" x="574" y="44">3</text>
                  <text class="svg-step" x="594" y="44">Many teams need</text>
                  <text class="svg-sub" x="594" y="66">enforced boundaries or</text>
                  <text class="svg-sub" x="594" y="86">codemod upgrades?</text>
                  <rect fill="#f7f7f5" height="96" rx="6" stroke="#b8b8b1" width="250" x="840" y="20"></rect>
                  <text class="svg-num" x="854" y="44">4</text>
                  <text class="svg-step" x="874" y="44">Agents should read</text>
                  <text class="svg-sub" x="874" y="66">CI history and propose</text>
                  <text class="svg-sub" x="874" y="86">fixes via MCP?</text>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="250" x2="276" y1="68" y2="68"></line>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="530" x2="556" y1="68" y2="68"></line>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="810" x2="836" y1="68" y2="68"></line>
                  <text class="svg-sub" x="254" y="60">no</text><text class="svg-sub" x="534" y="60">no</text><text class="svg-sub" x="814" y="60">no</text>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="125" x2="125" y1="116" y2="180"></line>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="405" x2="405" y1="116" y2="180"></line>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="685" x2="685" y1="116" y2="180"></line>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="965" x2="965" y1="116" y2="180"></line>
                  <text class="svg-sub" x="133" y="152">yes</text><text class="svg-sub" x="413" y="152">yes</text><text class="svg-sub" x="693" y="152">yes</text><text class="svg-sub" x="973" y="152">yes</text>
                  <rect fill="#ece6f3" height="50" rx="6" stroke="#765b98" width="1090" x="0" y="184"></rect>
                  <text class="svg-step" x="20" y="214">Nx — and budget for Nx Cloud if the "yes" was question 2 or 4</text>
                  <line stroke="#252525" stroke-width="2" x1="1090" x2="1110" y1="68" y2="68"></line>
                  <line stroke="#252525" stroke-width="2" x1="1110" x2="1110" y1="68" y2="270"></line>
                  <line marker-end="url(#d-ctl)" stroke="#252525" stroke-width="2" x1="1110" x2="1094" y1="270" y2="270"></line>
                  <text class="svg-sub" x="1062" y="60">no</text>
                  <rect fill="#e0ebf2" height="50" rx="6" stroke="#3c6f97" width="1090" x="0" y="248"></rect>
                  <text class="svg-step" x="20" y="278">Turborepo — and the free Vercel Remote Cache or a self-hosted one</text>
                </g>
                <text class="svg-note" x="0" y="324">thick black = order of evaluation · the first "yes" decides</text>
              </svg>
