                  <marker id="vit-arr-l" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#c9c9c2"></path></marker>
                </defs>
