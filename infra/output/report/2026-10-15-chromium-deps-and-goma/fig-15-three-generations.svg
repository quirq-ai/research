<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 686" role="img" aria-label="A table of three columns — Goma, Reclient, Siso — against five rows: wrapper, daemon, input discovery, transport, cache. Goma uses gomacc, compiler_proxy, a full C preprocessor, HTTP/1.1 with protobuf bodies, and its own backend cache. Reclient uses rewrapper, reproxy, the same include scanner under the name scandeps_server, gRPC REAPI, and the RBE action cache. Siso has no wrapper and no daemon, a forged scanner called scandeps, a built-in gRPC REAPI client, and the RBE action cache plus a local digest cache. Underneath, three timeline tracks on one axis from 2012 to 2026 mark goma described 2012-06, open-sourced 2018-01, backend moved to RBE 2020-11, deprecation PSA 2023-09, GN args deleted 2024-05; reclient landing 2020-12 and deprecated in GN 2025-11; Siso dogfood 2023-04, all CQ 2024-03, default on gLinux 2024-11, default for everyone 2025-06, fast-deps deleted 2026-04."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1100.0" height="686.0" fill="#ffffff"/>
                <text class="svg-lane" x="16" y="20">FIVE LAYERS, THREE IMPLEMENTATIONS</text>

                <rect fill="#f3dfdc" height="28" rx="6" stroke="#ad4b43" width="300" x="156" y="30"></rect>
                <text class="svg-step" x="170" y="49">GOMA — deleted 2024-05</text>
                <rect fill="#f7e3c8" height="28" rx="6" stroke="#d98226" width="300" x="470" y="30"></rect>
                <text class="svg-step" x="484" y="49">RECLIENT — deprecated</text>
                <rect fill="#dfede5" height="28" rx="6" stroke="#367f59" width="300" x="784" y="30"></rect>
                <text class="svg-step" x="798" y="49">SISO — the default</text>

                <text class="svg-lane" x="16" y="94">WRAPPER</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#ad4b43" width="300" x="156" y="68"></rect>
                <text class="svg-sub" x="170" y="92">gomacc</text>
                <text class="svg-note" x="170" y="112">argv → ExecReq · masquerade mode</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#d98226" width="300" x="470" y="68"></rect>
                <text class="svg-sub" x="484" y="92">rewrapper</text>
                <text class="svg-note" x="484" y="112">-cfg=… -exec_root=… per compile</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#367f59" width="300" x="784" y="68"></rect>
                <text class="svg-sub" x="798" y="92">none</text>
                <text class="svg-note" x="798" y="112">siso is the build tool itself</text>

                <text class="svg-lane" x="16" y="162">DAEMON</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#ad4b43" width="300" x="156" y="136"></rect>
                <text class="svg-sub" x="170" y="160">compiler_proxy</text>
                <text class="svg-note" x="170" y="180">CompileTask state machine</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#d98226" width="300" x="470" y="136"></rect>
                <text class="svg-sub" x="484" y="160">reproxy</text>
                <text class="svg-note" x="484" y="180">bootstrap starts it and shuts it down</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#367f59" width="300" x="784" y="136"></rect>
                <text class="svg-sub" x="798" y="160">none</text>
                <text class="svg-note" x="798" y="180">REAPI client inside the process</text>

                <text class="svg-lane" x="16" y="224">INPUT</text>
                <text class="svg-lane" x="16" y="240">DISCOVERY</text>
                <rect fill="#f3dfdc" height="60" rx="8" stroke="#ad4b43" width="300" x="156" y="204"></rect>
                <text class="svg-sub" x="170" y="228">full C preprocessor</text>
                <text class="svg-note" x="170" y="248">#if evaluated · exact input set</text>
                <rect fill="#f7e3c8" height="60" rx="8" stroke="#d98226" width="300" x="470" y="204"></rect>
                <text class="svg-sub" x="484" y="228">scandeps_server</text>
                <text class="svg-note" x="484" y="248">same engine — the -gomaip suffix</text>
                <rect fill="#dfede5" height="60" rx="8" stroke="#367f59" width="300" x="784" y="204"></rect>
                <text class="svg-sub" x="798" y="228">scandeps — "forged"</text>
                <text class="svg-note" x="798" y="248">no #if · superset + precomputed subtrees</text>

                <text class="svg-lane" x="16" y="292">TRANSPORT</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#ad4b43" width="300" x="156" y="272"></rect>
                <text class="svg-sub" x="170" y="296">HTTP/1.1 + protobuf</text>
                <text class="svg-note" x="170" y="316">goma.chromium.org/cxx-compiler-service</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#d98226" width="300" x="470" y="272"></rect>
                <text class="svg-sub" x="484" y="296">gRPC · REAPI</text>
                <text class="svg-note" x="484" y="316">remotebuildexecution.googleapis.com:443</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#367f59" width="300" x="784" y="272"></rect>
                <text class="svg-sub" x="798" y="296">gRPC · REAPI, built in</text>
                <text class="svg-note" x="798" y="316">same backend, no middleman</text>

                <text class="svg-lane" x="16" y="360">CACHE</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#ad4b43" width="300" x="156" y="340"></rect>
                <text class="svg-sub" x="170" y="364">goma backend cache</text>
                <text class="svg-note" x="170" y="384">keyed by goma's own request</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#d98226" width="300" x="470" y="340"></rect>
                <text class="svg-sub" x="484" y="364">RBE action cache + CAS</text>
                <text class="svg-note" x="484" y="384">keyed by the action digest</text>
                <rect fill="#ffffff" height="60" rx="8" stroke="#367f59" width="300" x="784" y="340"></rect>
                <text class="svg-sub" x="798" y="364">RBE action cache + CAS</text>
                <text class="svg-note" x="798" y="384">plus hashfs · .siso_fs_state</text>

                <text class="svg-lane" x="16" y="432">TIMELINE — ONE AXIS, THREE TRACKS</text>
                <line stroke="#deded9" stroke-width="1" x1="90" x2="90" y1="440" y2="644"></line>
                <line stroke="#deded9" stroke-width="1" x1="223" x2="223" y1="440" y2="644"></line>
                <line stroke="#deded9" stroke-width="1" x1="356" x2="356" y1="440" y2="644"></line>
