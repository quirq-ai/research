      <text class="svg-note" x="528" y="202">commit-queue.cfg:15–31</text>
      <line marker-end="url(#fig-commit-path-arr-ink)" stroke="#252525" stroke-width="2.5" x1="624" x2="656" y1="243" y2="243"></line>
      <text class="svg-note" x="684" y="196">gate = cq-usage/default.cfg</text>
