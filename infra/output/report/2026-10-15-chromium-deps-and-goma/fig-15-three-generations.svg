                <line stroke="#deded9" stroke-width="1" x1="622" x2="622" y1="440" y2="644"></line>
                <line stroke="#deded9" stroke-width="1" x1="755" x2="755" y1="440" y2="644"></line>
                <line stroke="#deded9" stroke-width="1" x1="888" x2="888" y1="440" y2="644"></line>
                <line stroke="#deded9" stroke-width="1" x1="1021" x2="1021" y1="440" y2="644"></line>
