      <text class="svg-step" x="616" y="518">recipe bundle @ refs/heads/main</text>
      <text class="svg-sub" x="616" y="536">+ properties.json read at the input commit</text>

      <text class="svg-note" text-anchor="middle" x="310" y="470">thin blue = the authored call · dashed purple = inherited defaults</text>
      <text class="svg-note" text-anchor="middle" x="310" y="494">thick black = generation · the run-time chain resolves top to bottom</text>
    </svg>
