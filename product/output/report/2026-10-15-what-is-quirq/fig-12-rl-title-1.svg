<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 196" role="img" aria-label="CodeContests test-set solve rate at one submission from three samples, before and after reinforcement learning on execution feedback. Llama 3.0 8B rises from 3.2 to 12.1 per cent, Llama 3.1 8B from 10.5 to 16.0, and Llama 3.1 70B from 27.5 to 40.1."><style>line { opacity: 0.3; }
.rl-axis { stroke: #b8b8b1; stroke-width: 1; }
.rl-line { fill: none; stroke: #2f6ea4; stroke-width: 2; stroke-linecap: round; }
.rl-dot { stroke: #ffffff; stroke-width: 2; }
.rl-dot.is-before { fill: #777772; }
.rl-dot.is-after { fill: #2f6ea4; }
.rl-name { fill: #4f4f4b; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9.5px; }
.rl-val { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; }
.rl-val.is-after { fill: #252525; font-size: 11.5px; font-weight: 700; }
.rl-x { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9.5px; }</style><rect x="0.0" y="0.0" width="340.0" height="196.0" fill="#ffffff"/>
                    <line class="rl-axis" x1="96" x2="330" y1="160" y2="160"></line>
                    <path class="rl-line" d="M 100.0 151.0 L 250.0 126.1"></path><circle class="rl-dot is-before" cx="100.0" cy="151.0" r="4"></circle><circle class="rl-dot is-after" cx="250.0" cy="126.1" r="4.5"></circle><text class="rl-name" text-anchor="end" x="92" y="154.5">Llama 3.0 8B</text><text class="rl-val" text-anchor="start" x="104" y="142.0">3.2</text><text class="rl-val is-after" x="258" y="129.6">12.1</text>
                    <path class="rl-line" d="M 100.0 130.6 L 250.0 115.2"></path><circle class="rl-dot is-before" cx="100.0" cy="130.6" r="4"></circle><circle class="rl-dot is-after" cx="250.0" cy="115.2" r="4.5"></circle><text class="rl-name" text-anchor="end" x="92" y="134.1">Llama 3.1 8B</text><text class="rl-val" text-anchor="start" x="104" y="121.6">10.5</text><text class="rl-val is-after" x="258" y="118.7">16.0</text>
                    <path class="rl-line" d="M 100.0 83.0 L 250.0 47.7"></path><circle class="rl-dot is-before" cx="100.0" cy="83.0" r="4"></circle><circle class="rl-dot is-after" cx="250.0" cy="47.7" r="4.5"></circle><text class="rl-name" text-anchor="end" x="92" y="86.5">Llama 3.1 70B</text><text class="rl-val" text-anchor="start" x="104" y="74.0">27.5</text><text class="rl-val is-after" x="258" y="51.2">40.1</text>
                    <text class="rl-x" text-anchor="middle" x="100" y="180">base model</text>
                    <text class="rl-x" text-anchor="middle" x="250" y="180">after RL</text>
                  </svg>
