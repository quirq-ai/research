<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="At the top, a birth-death chain with states zero, one, two, three and so on, arrivals at rate lambda moving right and completions at rate mu moving left. Below left, a curve of mean response time divided by service time against utilisation, flat until about 0.7 and then rising steeply, reaching 20 at utilisation 0.95. Below right, a table: at utilisation 0.5 response time is 2 times service time; 0.8 gives 5 times; 0.9 gives 10 times; 0.95 gives 20 times; 0.99 gives 100 times."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="400.0" fill="#ffffff"/>
                <defs>
                  <marker id="q-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#367f59"></path></marker>
                  <marker id="q-arr-b" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="16">M/M/1 AS A BIRTH–DEATH CHAIN · STATE n = REQUESTS IN THE SYSTEM</text>
                <circle cx="80" cy="66" fill="#f7f7f5" r="24" stroke="#b8b8b1"></circle><text class="svg-step" text-anchor="middle" x="80" y="72">0</text>
                <circle cx="240" cy="66" fill="#f7f7f5" r="24" stroke="#b8b8b1"></circle><text class="svg-step" text-anchor="middle" x="240" y="72">1</text>
                <circle cx="400" cy="66" fill="#f7f7f5" r="24" stroke="#b8b8b1"></circle><text class="svg-step" text-anchor="middle" x="400" y="72">2</text>
                <circle cx="560" cy="66" fill="#f7f7f5" r="24" stroke="#b8b8b1"></circle><text class="svg-step" text-anchor="middle" x="560" y="72">3</text>
                <text class="svg-step" x="700" y="72">· · ·</text>
                <path d="M104 54 L 212 54" marker-end="url(#q-arr)" stroke="#367f59" stroke-width="2"></path><text class="svg-sub" x="146" y="42">λ</text>
                <path d="M264 54 L 372 54" marker-end="url(#q-arr)" stroke="#367f59" stroke-width="2"></path><text class="svg-sub" x="306" y="42">λ</text>
                <path d="M424 54 L 532 54" marker-end="url(#q-arr)" stroke="#367f59" stroke-width="2"></path><text class="svg-sub" x="466" y="42">λ</text>
                <path d="M584 54 L 676 54" marker-end="url(#q-arr)" stroke="#367f59" stroke-width="2"></path><text class="svg-sub" x="620" y="42">λ</text>
                <path d="M212 82 L 108 82" marker-end="url(#q-arr-b)" stroke="#3c6f97" stroke-width="2"></path><text class="svg-sub" x="146" y="102">μ</text>
                <path d="M372 82 L 268 82" marker-end="url(#q-arr-b)" stroke="#3c6f97" stroke-width="2"></path><text class="svg-sub" x="306" y="102">μ</text>
                <path d="M532 82 L 428 82" marker-end="url(#q-arr-b)" stroke="#3c6f97" stroke-width="2"></path><text class="svg-sub" x="466" y="102">μ</text>
                <path d="M676 82 L 588 82" marker-end="url(#q-arr-b)" stroke="#3c6f97" stroke-width="2"></path><text class="svg-sub" x="620" y="102">μ</text>
                <text class="svg-sub" x="790" y="58">π(n) = (1 − ρ)ρⁿ,  ρ = λ/μ</text>
                <text class="svg-sub" x="790" y="82">L = ρ/(1 − ρ)   ·   W = L/λ  (Little)</text>
                <text class="svg-note" x="790" y="106">Detailed balance gives the geometric form.</text>

                <line stroke="#deded9" x1="0" x2="1120" y1="126" y2="126"></line>

                <text class="svg-lane" x="0" y="152">RESPONSE TIME ÷ SERVICE TIME = 1/(1 − ρ)</text>
                <line stroke="#b8b8b1" transform="translate(0,20)" x1="80" x2="80" y1="50" y2="300"></line>
                <line stroke="#b8b8b1" x1="80" x2="600" y1="320" y2="320"></line>
                <g transform="translate(0,20)">
                  <polyline fill="none" points="80.0,300.0 130.5,298.5 181.1,296.7 231.6,294.4 282.1,291.2 332.6,286.8 383.2,280.3 433.7,269.3 458.9,262.6 484.2,247.4 509.5,225.4 524.6,203.5 534.7,181.6 544.8,148.7 549.9,125.2 554.9,93.9 560.0,50.0" stroke="#ad4b43" stroke-width="2.4"></polyline>
                  <line stroke="#deded9" stroke-dasharray="4 3" x1="80" x2="560" y1="181.6" y2="181.6"></line>
                  <line stroke="#deded9" stroke-dasharray="4 3" x1="80" x2="560" y1="247.4" y2="247.4"></line>
                  <text class="svg-sub" x="34" y="304">1×</text>
                  <text class="svg-sub" x="34" y="251">5×</text>
                  <text class="svg-sub" x="30" y="185">10×</text>
                  <text class="svg-sub" x="30" y="54">20×</text>
                  <circle cx="484.2" cy="247.4" fill="#ad4b43" r="4"></circle>
                  <circle cx="534.7" cy="181.6" fill="#ad4b43" r="4"></circle>
                </g>
                <text class="svg-sub" x="74" y="342">0</text>
                <text class="svg-sub" x="196" y="342">0.25</text>
                <text class="svg-sub" x="322" y="342">0.50</text>
                <text class="svg-sub" x="450" y="342">0.75</text>
                <text class="svg-sub" x="548" y="342">0.95</text>
                <text class="svg-lane" x="280" y="368">UTILISATION ρ</text>
                <text class="svg-note" x="80" y="392">Flat until ≈ 0.7, then vertical. Nothing warns you; the second derivative does all the damage.</text>

                <line stroke="#deded9" x1="640" x2="640" y1="126" y2="400"></line>
                <text class="svg-lane" x="670" y="152">COMPUTED</text>
                <text class="svg-sub" x="670" y="180">ρ       in system L    W ÷ S     P(&gt;10 waiting)</text>
                <line stroke="#deded9" x1="670" x2="1110" y1="190" y2="190"></line>
                <text class="svg-sub" x="670" y="212">0.50        1.00       2.0×       0.0005</text>
                <text class="svg-sub" x="670" y="234">0.70        2.33       3.3×       0.0198</text>
                <text class="svg-sub" x="670" y="256">0.80        4.00       5.0×       0.0859</text>
                <text class="svg-sub" x="670" y="278">0.90        9.00      10.0×       0.3138</text>
                <text class="svg-sub" x="670" y="300">0.95       19.00      20.0×       0.5688</text>
                <text class="svg-sub" x="670" y="322">0.99       99.00     100.0×       0.8953</text>
                <rect fill="#f7e3c8" height="58" rx="6" stroke="#d98226" width="450" x="664" y="336"></rect>
                <text class="svg-note" x="678" y="360">Going from 80% to 90% utilisation buys 12.5% more</text>
                <text class="svg-note" x="678" y="380">throughput and doubles latency. That is the trade.</text>
              </svg>
