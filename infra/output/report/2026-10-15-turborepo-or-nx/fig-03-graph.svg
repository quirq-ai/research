<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Two pipelines. Top: Turborepo reads the package manager's workspace list and each package.json, plus turbo.json, and produces a package graph whose tasks are package.json scripts. Bottom: Nx reads package.json and project.json files, runs registered plugins over tool configs such as vite.config.ts and jest.config.ts and over source imports, plus nx.json, and produces a project graph whose targets are partly inferred."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="410.0" fill="#ffffff"/>
                <defs>
                  <marker id="g-data" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#3c6f97"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="22">TURBOREPO</text>
                <rect fill="#f7f7f5" height="52" rx="4" stroke="#b8b8b1" width="250" x="0" y="40"></rect>
                <text class="svg-step" x="14" y="62">workspaces list</text>
                <text class="svg-sub" x="14" y="82">pnpm / npm / yarn / bun</text>
                <rect fill="#f7f7f5" height="52" rx="4" stroke="#b8b8b1" width="250" x="0" y="104"></rect>
                <text class="svg-step" x="14" y="126">package.json × N</text>
                <text class="svg-sub" x="14" y="146">deps → edges · scripts → tasks</text>
                <rect fill="#f7f7f5" height="40" rx="4" stroke="#b8b8b1" width="200" x="330" y="146"></rect>
                <text class="svg-step" x="344" y="162">turbo.json</text>
                <text class="svg-sub" x="344" y="178">dependsOn · inputs · outputs</text>
                <rect fill="#e0ebf2" height="76" rx="4" stroke="#3c6f97" width="480" x="620" y="60"></rect>
                <text class="svg-step" x="636" y="88">Package graph → task graph</text>
                <text class="svg-sub" x="636" y="110">node = package · task = script that exists</text>
                <line marker-end="url(#g-data)" stroke="#3c6f97" stroke-width="1.5" x1="250" x2="616" y1="66" y2="86"></line>
                <line marker-end="url(#g-data)" stroke="#3c6f97" stroke-width="1.5" x1="250" x2="616" y1="130" y2="112"></line>
                <line marker-end="url(#g-data)" stroke="#3c6f97" stroke-width="1.5" x1="530" x2="700" y1="166" y2="140"></line>

                <text class="svg-lane" x="0" y="196">NX</text>
                <rect fill="#f7f7f5" height="52" rx="4" stroke="#b8b8b1" width="250" x="0" y="212"></rect>
                <text class="svg-step" x="14" y="234">package.json · project.json</text>
                <text class="svg-sub" x="14" y="254">explicit targets</text>
                <rect fill="#dfede5" height="52" rx="4" stroke="#367f59" width="250" x="0" y="276"></rect>
                <text class="svg-step" x="14" y="298">plugins over tool configs</text>
                <text class="svg-sub" x="14" y="318">vite · jest · gradle · .csproj</text>
                <rect fill="#f7f7f5" height="40" rx="4" stroke="#b8b8b1" width="200" x="330" y="344"></rect>
                <text class="svg-step" x="344" y="360">nx.json</text>
                <text class="svg-sub" x="344" y="376">targetDefaults · namedInputs</text>
                <rect fill="#e0ebf2" height="76" rx="4" stroke="#3c6f97" width="480" x="620" y="232"></rect>
                <text class="svg-step" x="636" y="260">Project graph → task graph</text>
                <text class="svg-sub" x="636" y="282">node = project · target may be inferred</text>
                <line marker-end="url(#g-data)" stroke="#3c6f97" stroke-width="1.5" x1="250" x2="616" y1="238" y2="258"></line>
                <line marker-end="url(#g-data)" stroke="#3c6f97" stroke-width="1.5" x1="250" x2="616" y1="302" y2="284"></line>
                <line marker-end="url(#g-data)" stroke="#3c6f97" stroke-width="1.5" x1="530" x2="700" y1="364" y2="312"></line>
                <text class="svg-note" x="0" y="404">thin blue = data read at graph-construction time</text>
              </svg>
