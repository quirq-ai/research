<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-label="A central box, the session process, surrounded by seven doors. On the left, the stream-json pipe held by the spawning host, and the inbox socket used by child processes and other local sessions. On top, Remote Control through Anthropic's servers and the background supervisor. On the right, MCP channels and outbound hooks. At the bottom, the transcript file, which can only be read."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1080.0" height="430.0" fill="#ffffff"/>
                <defs>
                  <marker id="fdo-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#252525"/></marker>
                  <marker id="fdo-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f97"/></marker>
                  <marker id="fdo-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#765b98"/></marker>
                </defs>

                <rect x="400" y="150" width="280" height="118" rx="10" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>
                <text x="418" y="178" class="svg-lane">ONE SESSION PROCESS</text>
                <text x="418" y="202" class="svg-step">claude, pid 19680</text>
                <text x="418" y="222" class="svg-sub">sessionId 07ed001e-…</text>
                <text x="418" y="240" class="svg-sub">cwd …/writings</text>
                <text x="418" y="258" class="svg-sub">kind interactive, busy</text>

                <rect x="20" y="130" width="250" height="70" rx="8" fill="#ffffff" stroke="#252525"/>
                <text x="32" y="152" class="svg-step">1 · stream-json pipe</text>
                <text x="32" y="170" class="svg-sub">the spawning host only:</text>
                <text x="32" y="186" class="svg-sub">SDK app, desktop, xo-space</text>
                <line x1="272" y1="165" x2="396" y2="185" stroke="#252525" stroke-width="2.2" marker-start="url(#fdo-k)" marker-end="url(#fdo-k)"/>

                <rect x="20" y="226" width="250" height="70" rx="8" fill="#ffffff" stroke="#3c6f97"/>
                <text x="32" y="248" class="svg-step">2 · inbox socket</text>
                <text x="32" y="266" class="svg-sub">child processes, other local</text>
                <text x="32" y="282" class="svg-sub">sessions; JSON lines over uds</text>
                <line x1="272" y1="258" x2="396" y2="238" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#fdo-b)"/>

                <rect x="250" y="18" width="250" height="70" rx="8" fill="#ffffff" stroke="#252525"/>
                <text x="262" y="40" class="svg-step">3 · Remote Control</text>
                <text x="262" y="58" class="svg-sub">phone, browser, other machines</text>
                <text x="262" y="74" class="svg-sub">outbound HTTPS, via Anthropic</text>
                <line x1="400" y1="90" x2="480" y2="146" stroke="#252525" stroke-width="2.2" marker-start="url(#fdo-k)" marker-end="url(#fdo-k)"/>

                <rect x="580" y="18" width="250" height="70" rx="8" fill="#ffffff" stroke="#252525"/>
                <text x="592" y="40" class="svg-step">4 · background supervisor</text>
                <text x="592" y="58" class="svg-sub">claude agents, attach, logs,</text>
                <text x="592" y="74" class="svg-sub">stop, respawn, rm</text>
                <line x1="680" y1="90" x2="600" y2="146" stroke="#252525" stroke-width="2.2" marker-end="url(#fdo-k)"/>

                <rect x="810" y="130" width="250" height="70" rx="8" fill="#ffffff" stroke="#3c6f97"/>
                <text x="822" y="152" class="svg-step">5 · MCP channel</text>
                <text x="822" y="170" class="svg-sub">webhooks, chat bridges;</text>
                <text x="822" y="186" class="svg-sub">may relay permission prompts</text>
                <line x1="808" y1="165" x2="684" y2="185" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#fdo-b)"/>

                <rect x="810" y="226" width="250" height="70" rx="8" fill="#ffffff" stroke="#252525"/>
                <text x="822" y="248" class="svg-step">6 · hooks, calling out</text>
                <text x="822" y="266" class="svg-sub">command, http, mcp_tool;</text>
                <text x="822" y="282" class="svg-sub">33 events, decisions return</text>
                <line x1="684" y1="238" x2="806" y2="258" stroke="#252525" stroke-width="2.2" marker-end="url(#fdo-k)"/>

                <rect x="415" y="330" width="250" height="70" rx="8" fill="#ffffff" stroke="#765b98" stroke-dasharray="5 4"/>
                <text x="427" y="352" class="svg-step">7 · transcript .jsonl</text>
                <text x="427" y="370" class="svg-sub">append-only, lags the turn;</text>
                <text x="427" y="386" class="svg-sub">read it, never write it</text>
                <line x1="540" y1="270" x2="540" y2="326" stroke="#765b98" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fdo-p)"/>

                <text x="20" y="330" class="svg-note">thick black: control, can steer the loop</text>
                <text x="20" y="348" class="svg-note">thin blue: data, becomes a user turn</text>
                <text x="20" y="366" class="svg-note">dashed purple: state written as a side effect</text>
                <text x="700" y="330" class="svg-note">cloud sessions (--cloud, --teleport) are</text>
                <text x="700" y="348" class="svg-note">the same shape on Anthropic's machines,</text>
                <text x="700" y="366" class="svg-note">reached through door 3</text>
              </svg>
