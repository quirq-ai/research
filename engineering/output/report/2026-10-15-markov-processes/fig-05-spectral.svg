                <text class="svg-note" x="90" y="344">All three chains have the same stationary distribution, (0.5, 0.5). For a two-state chain λ₂ = 1 − p − q exactly, and TV distance from a corner is exactly 0.5·|λ₂|ⁿ.</text>
