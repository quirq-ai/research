<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-label="Three panels. Panel A: a single page node labelled type product pointing to one registry entry. Panel B: a page node containing an ordered list of four tagged blocks, each pointing to its own registry entry. Panel C: a page node containing a grid block whose two slots contain further blocks, drawn as a tree three levels deep, with slot edges dashed."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="360.0" fill="#ffffff"/>
                <defs>
                  <marker id="sh-arr" markerHeight="5.5" markerWidth="5.5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                  <marker id="sh-arr-p" markerHeight="5.5" markerWidth="5.5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
                </defs>

                <line stroke="#deded9" stroke-width="1.2" x1="373" x2="373" y1="24" y2="336"></line>
                <line stroke="#deded9" stroke-width="1.2" x1="747" x2="747" y1="24" y2="336"></line>

                <text class="svg-lane" x="26" y="40">A · PAGE TYPE</text>
                <rect fill="#f7e3c8" height="54" rx="8" stroke="#d98226" stroke-width="2" width="200" x="20" y="60"></rect>
                <text class="svg-step" x="36" y="84">page</text>
                <text class="svg-sub" x="36" y="104">type: "product"</text>
                <line marker-end="url(#sh-arr)" stroke="#3c6f97" stroke-width="1.5" x1="120" x2="120" y1="118" y2="150"></line>
