<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="Three timelines of the same nine tasks of mixed length. Top: one machine runs them with a remote cache, finishing last. Middle: a hand-written CI matrix splits them into three fixed shards; one shard finishes much later than the others, so the run waits for the slowest. Bottom: Nx Agents assigns tasks dynamically to three machines, which finish close together, earliest of the three."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="300.0" fill="#ffffff"/>
                <text class="svg-lane" x="0" y="20">SAME 9 TASKS · SAME CACHE · TIME →</text>
                <text class="svg-step" x="0" y="62">1 machine</text><text class="svg-sub" x="0" y="80">turbo or nx</text>
                <g>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="120" x="200" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="60" x="320" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="180" x="380" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="60" x="560" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="90" x="620" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="120" x="710" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="60" x="830" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="90" x="890" y="50"></rect>
                  <rect fill="#e0ebf2" height="30" stroke="#3c6f97" width="60" x="980" y="50"></rect>
                </g>
                <text class="svg-step" x="0" y="132">static matrix</text><text class="svg-sub" x="0" y="150">--filter shards</text>
                <g>
                  <rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="120" x="200" y="112"></rect><rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="180" x="320" y="112"></rect><rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="120" x="500" y="112"></rect>
                  <rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="60" x="200" y="138"></rect><rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="60" x="260" y="138"></rect><rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="60" x="320" y="138"></rect>
                  <rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="90" x="200" y="164"></rect><rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="90" x="290" y="164"></rect><rect fill="#e0ebf2" height="22" stroke="#3c6f97" width="60" x="380" y="164"></rect>
                  <line stroke="#ad4b43" stroke-dasharray="4 3" stroke-width="1.5" x1="620" x2="620" y1="104" y2="194"></line>
