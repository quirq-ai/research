<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 556" role="img" aria-label="Decision flow of three questions asked in order, each with yes branches to the right and a no path continuing down. Question 1: is the file media, or already compressed (photos, audio, video, archives)? If yes: photos want AVIF or JPEG XL at a perceptual-quality target; graphics want lossless WebP or JPEG XL, or oxipng if the file must stay PNG; audio wants Opus to listen and FLAC to keep; video wants SVT-AV1 to store, H.264 to play and HEVC where required; already compressed files want to be stored as they are, never gzipped. If no, question 2: is it small, and stored alone (one message, one config file)? If yes: messages want zstd with a trained dictionary, or batching; config files want to be left alone, compressed as a set. If no, question 3: how will it be read? Once, over HTTP: brotli or zstd at the CDN, gzip as the fallback. Often, from disk: zstd 3 to 9, level 19 for cold archives. By offset: zstd in 1 MiB frames plus a seek table. By column: Parquet, dictionary encoding first, then zstd. By a package manager: the registry's format, gzip level 9 tarballs. Orange marks answers where a media codec does the work, blue a general-purpose codec, green a format first and then a codec, grey leaving the bytes alone."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="556.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-decision-ink" markerHeight="4" markerWidth="4" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>

                <text class="svg-lane" x="0" y="16">THREE QUESTIONS, IN ORDER</text>
                <text class="svg-lane" x="380" y="16">WHAT THE FILE WANTS</text>

                <rect fill="#ffffff" height="90" rx="6" stroke="#252525" width="300" x="0" y="64"></rect>
                <text class="svg-num" x="14" y="114">1</text>
                <text class="svg-step" x="30" y="114">Media, or already compressed?</text>
                <path d="M300 109 H340" fill="none" stroke="#252525" stroke-width="2.4"></path>
                <path d="M340 45 V173" fill="none" stroke="#252525" stroke-width="2.4"></path>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="45" y2="45"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="77" y2="77"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="109" y2="109"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="141" y2="141"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="173" y2="173"></line>
                <text class="svg-note" x="306" y="101">yes</text>

                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" width="740" x="380" y="32"></rect>
                <text class="svg-step" x="394" y="50">Photos</text>
                <text class="svg-sub" x="580" y="50">AVIF or JPEG XL at a quality target</text>
                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" width="740" x="380" y="64"></rect>
                <text class="svg-step" x="394" y="82">Graphics</text>
                <text class="svg-sub" x="580" y="82">lossless WebP or JPEG XL; oxipng if it must stay PNG</text>
                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" width="740" x="380" y="96"></rect>
                <text class="svg-step" x="394" y="114">Audio</text>
                <text class="svg-sub" x="580" y="114">Opus to listen, FLAC to keep</text>
                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" width="740" x="380" y="128"></rect>
                <text class="svg-step" x="394" y="146">Video</text>
                <text class="svg-sub" x="580" y="146">SVT-AV1 to store, H.264 to play, HEVC if required</text>
                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="740" x="380" y="160"></rect>
                <text class="svg-step" x="394" y="178">Already compressed</text>
                <text class="svg-sub" x="580" y="178">store as is; never gzip</text>

                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="150" x2="150" y1="154" y2="202"></line>
                <text class="svg-note" x="160" y="184">no</text>

                <rect fill="#ffffff" height="90" rx="6" stroke="#252525" width="300" x="0" y="206"></rect>
                <text class="svg-num" x="14" y="256">2</text>
                <text class="svg-step" x="30" y="256">Small, and stored alone?</text>
                <path d="M300 251 H340" fill="none" stroke="#252525" stroke-width="2.4"></path>
                <path d="M340 235 V267" fill="none" stroke="#252525" stroke-width="2.4"></path>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="235" y2="235"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="267" y2="267"></line>
                <text class="svg-note" x="306" y="240">yes</text>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="740" x="380" y="222"></rect>
                <text class="svg-step" x="394" y="240">Messages</text>
                <text class="svg-sub" x="580" y="240">zstd + trained dictionary, or batch</text>
                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="740" x="380" y="254"></rect>
                <text class="svg-step" x="394" y="272">Config files</text>
                <text class="svg-sub" x="580" y="272">leave them alone; compress the set</text>

                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="150" x2="150" y1="296" y2="346"></line>
                <text class="svg-note" x="160" y="327">no</text>

                <rect fill="#ffffff" height="90" rx="6" stroke="#252525" width="300" x="0" y="350"></rect>
                <text class="svg-num" x="14" y="400">3</text>
                <text class="svg-step" x="30" y="400">How will it be read?</text>
                <path d="M300 395 H340" fill="none" stroke="#252525" stroke-width="2.4"></path>
                <path d="M340 331 V459" fill="none" stroke="#252525" stroke-width="2.4"></path>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="331" y2="331"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="363" y2="363"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="395" y2="395"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="427" y2="427"></line>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="340" x2="375" y1="459" y2="459"></line>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="740" x="380" y="318"></rect>
                <text class="svg-step" x="394" y="336">Once, over HTTP</text>
                <text class="svg-sub" x="580" y="336">brotli or zstd at the CDN; gzip fallback</text>
                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="740" x="380" y="350"></rect>
                <text class="svg-step" x="394" y="368">Often, from disk</text>
                <text class="svg-sub" x="580" y="368">zstd 3 to 9; 19 for cold archives</text>
                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="740" x="380" y="382"></rect>
                <text class="svg-step" x="394" y="400">By offset</text>
                <text class="svg-sub" x="580" y="400">zstd in 1 MiB frames + seek table</text>
                <rect fill="#dfede5" height="26" rx="4" stroke="#367f59" width="740" x="380" y="414"></rect>
                <text class="svg-step" x="394" y="432">By column</text>
                <text class="svg-sub" x="580" y="432">Parquet: dictionary encoding first, then zstd</text>
                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="740" x="380" y="446"></rect>
                <text class="svg-step" x="394" y="464">By a package manager</text>
                <text class="svg-sub" x="580" y="464">the registry's format (gzip -9 tarballs)</text>

                <line stroke="#deded9" x1="0" x2="1120" y1="492" y2="492"></line>
                <rect fill="#f7e3c8" height="14" rx="3" stroke="#d98226" width="14" x="0" y="504"></rect>
                <text class="svg-sub" x="22" y="515">media codec</text>
                <rect fill="#e0ebf2" height="14" rx="3" stroke="#3c6f97" width="14" x="250" y="504"></rect>
                <text class="svg-sub" x="272" y="515">general-purpose codec</text>
                <rect fill="#dfede5" height="14" rx="3" stroke="#367f59" width="14" x="500" y="504"></rect>
                <text class="svg-sub" x="522" y="515">format, then codec</text>
                <rect fill="#f7f7f5" height="14" rx="3" stroke="#b8b8b1" width="14" x="760" y="504"></rect>
                <text class="svg-sub" x="782" y="515">leave the bytes alone</text>
                <line marker-end="url(#fig-decision-ink)" stroke="#252525" stroke-width="2.4" x1="0" x2="30" y1="540" y2="540"></line>
                <text class="svg-sub" x="40" y="544">yes goes right, no goes down</text>
              </svg>
