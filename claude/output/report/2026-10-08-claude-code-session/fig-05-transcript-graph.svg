<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-label="A vertical chain of ten transcript records on the left: a user prompt, an attachment, three assistant records that share one API request id and hold a thinking block and two tool uses, a tool result, an assistant reply, a compact boundary with no parent but a logical parent pointer, the compact summary, and the continuation. One tool result hangs off the first tool use as a dead-end leaf. On the right, a subagent file whose records are sidechains, four metadata lines that have no uuid, and a forked file that begins with copies of the original records."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1080.0" height="480.0" fill="#ffffff"/>
                <defs>
                  <marker id="ftg-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#252525"/></marker>
                  <marker id="ftg-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#765b98"/></marker>
                  <marker id="ftg-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f97"/></marker>
                </defs>
                <text x="60" y="22" class="svg-lane">&lt;sessionId&gt;.jsonl</text>

                <text x="40" y="54" class="svg-num">r1</text>
                <rect x="60" y="38" width="340" height="28" rx="6" fill="#f7e3c8" stroke="#d98226"/>
                <text x="70" y="57" class="svg-sub">user · prompt · parentUuid null · promptId P</text>
                <text x="40" y="96" class="svg-num">r2</text>
                <rect x="60" y="80" width="340" height="28" rx="6" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="70" y="99" class="svg-sub">attachment · hook_additional_context</text>
                <text x="40" y="138" class="svg-num">r3</text>
                <rect x="60" y="122" width="340" height="28" rx="6" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="70" y="141" class="svg-sub">assistant · thinking · requestId R · block 0</text>
                <text x="40" y="180" class="svg-num">r4</text>
                <rect x="60" y="164" width="340" height="28" rx="6" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="70" y="183" class="svg-sub">assistant · tool_use A (Bash) · R · block 1</text>
                <text x="40" y="222" class="svg-num">r5</text>
                <rect x="60" y="206" width="340" height="28" rx="6" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="70" y="225" class="svg-sub">assistant · tool_use B (Agent) · R · block 2</text>
                <text x="40" y="264" class="svg-num">r6</text>
                <rect x="60" y="248" width="340" height="28" rx="6" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="70" y="267" class="svg-sub">user · tool_result B · promptId P</text>
                <text x="40" y="306" class="svg-num">r7</text>
                <rect x="60" y="290" width="340" height="28" rx="6" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="70" y="309" class="svg-sub">assistant · text · end_turn · requestId R2</text>
                <text x="40" y="348" class="svg-num">r8</text>
                <rect x="60" y="332" width="340" height="28" rx="6" fill="#ece6f3" stroke="#765b98"/>
                <text x="70" y="351" class="svg-sub">system · compact_boundary · parentUuid null</text>
                <text x="40" y="390" class="svg-num">r9</text>
                <rect x="60" y="374" width="340" height="28" rx="6" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="70" y="393" class="svg-sub">user · isCompactSummary · the summary</text>
                <text x="36" y="432" class="svg-num">r10</text>
                <rect x="60" y="416" width="340" height="28" rx="6" fill="#ffffff" stroke="#b8b8b1" stroke-dasharray="3 3"/>
                <text x="70" y="435" class="svg-sub">… the conversation continues</text>

                <line x1="230" y1="66" x2="230" y2="78" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="108" x2="230" y2="120" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="150" x2="230" y2="162" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="192" x2="230" y2="204" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="234" x2="230" y2="246" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="276" x2="230" y2="288" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="402" x2="230" y2="414" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>
                <line x1="230" y1="360" x2="230" y2="372" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>

                <line x1="408" y1="124" x2="408" y2="232" stroke="#3c6f97" stroke-width="1"/>
                <line x1="404" y1="124" x2="408" y2="124" stroke="#3c6f97" stroke-width="1"/>
                <line x1="404" y1="232" x2="408" y2="232" stroke="#3c6f97" stroke-width="1"/>
                <text x="416" y="168" class="svg-note">r3 to r5: one API response;</text>
                <text x="416" y="184" class="svg-note">its usage repeated on each</text>

                <rect x="430" y="250" width="264" height="44" rx="6" fill="#ffffff" stroke="#ad4b43" stroke-dasharray="4 3"/>
                <text x="440" y="268" class="svg-sub">user · tool_result A · parent r4</text>
                <text x="440" y="285" class="svg-sub">a dead end: nothing points here</text>
                <path d="M 400 184 C 418 192, 414 262, 428 268" fill="none" stroke="#252525" stroke-width="1.8" marker-end="url(#ftg-k)"/>

                <path d="M 58 346 C 12 346, 12 304, 56 304" fill="none" stroke="#765b98" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ftg-p)"/>
                <text x="410" y="351" class="svg-note">logicalParentUuid → r7 (dashed)</text>

                <text x="712" y="22" class="svg-lane">&lt;sessionId&gt;/subagents/agent-a&lt;hex16&gt;.jsonl</text>
                <rect x="712" y="36" width="352" height="28" rx="6" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="722" y="55" class="svg-sub">user · the prompt · isSidechain true · agentId</text>
                <rect x="712" y="70" width="352" height="28" rx="6" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="722" y="89" class="svg-sub">assistant · … · same sessionId as the parent</text>
                <path d="M 400 220 L 600 220 C 662 220, 660 50, 708 50" fill="none" stroke="#3c6f97" stroke-width="1.3" marker-end="url(#ftg-b)"/>
                <text x="470" y="214" class="svg-sub">meta.json toolUseId</text>

                <text x="712" y="128" class="svg-lane">METADATA LINES: NO uuid, NO parent</text>
                <rect x="712" y="138" width="352" height="26" rx="13" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="724" y="155" class="svg-sub">last-prompt · leafUuid → r7</text>
                <rect x="712" y="170" width="352" height="26" rx="13" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="724" y="187" class="svg-sub">custom-title · re-appended; last one wins</text>
                <rect x="712" y="202" width="352" height="26" rx="13" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="724" y="219" class="svg-sub">queue-operation · enqueue, dequeue, remove</text>
                <rect x="712" y="234" width="352" height="26" rx="13" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="724" y="251" class="svg-sub">file-history-snapshot · messageId → r1</text>

                <text x="712" y="306" class="svg-lane">A FORK: ANOTHER .jsonl</text>
                <rect x="712" y="318" width="352" height="28" rx="6" fill="#f7e3c8" stroke="#d98226" stroke-dasharray="4 3"/>
                <text x="722" y="337" class="svg-sub">r1 … r7 copied: same uuids, old sessionId</text>
                <rect x="712" y="354" width="352" height="28" rx="6" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="722" y="373" class="svg-sub">new records chain from the copy</text>
                <text x="712" y="410" class="svg-note">desktop forks keep the source sessionId on copied lines;</text>
                <text x="712" y="428" class="svg-note">a headless resume observed here rewrote it</text>
              </svg>
