<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="A four-state saturating counter drawn as a chain: strongly not taken, weakly not taken, weakly taken, strongly taken, with taken transitions moving right and not-taken transitions moving left, and self-loops at both ends. A table compares misprediction rates of the two-bit counter against a one-bit predictor for branch taken-rates from 0.5 to 0.95: at 0.9 the two-bit predictor mispredicts 10.98 percent against the one-bit predictor's 18 percent."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="400.0" fill="#ffffff"/>
                <defs>
                  <marker id="bp-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#367f59"></path></marker>
                  <marker id="bp-arr-r" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#ad4b43"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">THE STATE MACHINE · GREEN = BRANCH TAKEN (p) · RED = NOT TAKEN (1 − p)</text>

                <rect fill="#f3dfdc" height="62" rx="8" stroke="#ad4b43" stroke-width="1.8" width="180" x="20" y="70"></rect>
                <text class="svg-step" text-anchor="middle" x="110" y="98">00 · strong N</text>
                <text class="svg-note" text-anchor="middle" x="110" y="120">predict not-taken</text>
                <rect fill="#f3dfdc" height="62" rx="8" stroke="#ad4b43" width="180" x="260" y="70"></rect>
                <text class="svg-step" text-anchor="middle" x="350" y="98">01 · weak N</text>
                <text class="svg-note" text-anchor="middle" x="350" y="120">predict not-taken</text>
                <rect fill="#dfede5" height="62" rx="8" stroke="#367f59" width="180" x="500" y="70"></rect>
                <text class="svg-step" text-anchor="middle" x="590" y="98">10 · weak T</text>
                <text class="svg-note" text-anchor="middle" x="590" y="120">predict taken</text>
                <rect fill="#dfede5" height="62" rx="8" stroke="#367f59" stroke-width="1.8" width="180" x="740" y="70"></rect>
                <text class="svg-step" text-anchor="middle" x="830" y="98">11 · strong T</text>
                <text class="svg-note" text-anchor="middle" x="830" y="120">predict taken</text>

                <line marker-end="url(#bp-arr)" stroke="#367f59" stroke-width="2" x1="200" x2="252" y1="88" y2="88"></line>
                <line marker-end="url(#bp-arr)" stroke="#367f59" stroke-width="2" x1="440" x2="492" y1="88" y2="88"></line>
                <line marker-end="url(#bp-arr)" stroke="#367f59" stroke-width="2" x1="680" x2="732" y1="88" y2="88"></line>
                <line marker-end="url(#bp-arr-r)" stroke="#ad4b43" stroke-width="2" x1="732" x2="688" y1="118" y2="118"></line>
                <line marker-end="url(#bp-arr-r)" stroke="#ad4b43" stroke-width="2" x1="492" x2="448" y1="118" y2="118"></line>
                <line marker-end="url(#bp-arr-r)" stroke="#ad4b43" stroke-width="2" x1="252" x2="208" y1="118" y2="118"></line>
                <path d="M40 70 C 30 26 118 26 100 66" fill="none" marker-end="url(#bp-arr-r)" stroke="#ad4b43" stroke-width="2"></path>
                <text class="svg-sub" x="46" y="36">1 − p</text>
                <path d="M840 66 C 824 26 912 26 900 68" fill="none" marker-end="url(#bp-arr)" stroke="#367f59" stroke-width="2"></path>
                <text class="svg-sub" x="846" y="36">p</text>
                <text class="svg-note" x="0" y="168">One surprise moves you one step. Flipping the prediction takes two consecutive surprises — that hysteresis is the whole design.</text>

                <line stroke="#deded9" x1="0" x2="1120" y1="190" y2="190"></line>
                <text class="svg-lane" x="0" y="216">MISPREDICTION RATE UNDER INDEPENDENT OUTCOMES</text>
                <text class="svg-sub" x="0" y="248">taken-rate p    stationary π (00, 01, 10, 11)              2-bit      1-bit</text>
                <line stroke="#deded9" x1="0" x2="1000" y1="258" y2="258"></line>
                <text class="svg-sub" x="0" y="282">0.50            0.2500  0.2500  0.2500  0.2500          0.5000     0.5000</text>
                <text class="svg-sub" x="0" y="306">0.70            0.0466  0.1086  0.2534  0.5914          0.3621     0.4200</text>
                <text class="svg-sub" x="0" y="330">0.80            0.0118  0.0471  0.1882  0.7529          0.2353     0.3200</text>
                <text class="svg-sub" x="0" y="354">0.90            0.0012  0.0110  0.0988  0.8890          0.1098     0.1800</text>
                <text class="svg-sub" x="0" y="378">0.95            0.0001  0.0026  0.0499  0.9474          0.0525     0.0950</text>
                <rect fill="#f7e3c8" height="122" rx="6" stroke="#d98226" width="110" x="1010" y="264"></rect>
                <text class="svg-note" x="1022" y="292">At p ≥ 0.8</text>
                <text class="svg-note" x="1022" y="312">two bits cut</text>
                <text class="svg-note" x="1022" y="332">mispredicts</text>
                <text class="svg-note" x="1022" y="352">by ~40% over</text>
                <text class="svg-note" x="1022" y="372">one bit.</text>
              </svg>
