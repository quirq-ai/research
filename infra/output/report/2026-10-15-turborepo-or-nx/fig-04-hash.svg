<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-label="Three copies of the benchmark's dependency chain from p01 through p05 and p08, then p09 and p11, to p12. In Turborepo, all six packages are re-run because upstream hashes are folded in. In Nx with inputs src and caret src, all six re-run. In Nx with inputs src only, only p01 re-runs, and the other five are restored from cache, marked stale."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }</style><rect x="0.0" y="0.0" width="1120.0" height="330.0" fill="#ffffff"/>
                <text class="svg-lane" x="0" y="22">CHAIN AFFECTED BY EDITING p01 (6 OF 12 PACKAGES)</text>
                <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
                  
                  <text class="svg-step" x="0" y="78">turbo</text>
                  <text class="svg-sub" x="0" y="98">dependsOn ^build</text>
                  <text class="svg-step" x="0" y="168">nx</text>
                  <text class="svg-sub" x="0" y="188">inputs src, ^src</text>
                  <text class="svg-step" x="0" y="258">nx</text>
                  <text class="svg-sub" x="0" y="278">inputs src only</text>
                </g>
                
                <g>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="230" y="62"></rect><text class="svg-step" x="268" y="87">p01</text>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="380" y="62"></rect><text class="svg-step" x="402" y="87">p05 p08</text>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="530" y="62"></rect><text class="svg-step" x="552" y="87">p09 p11</text>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="680" y="62"></rect><text class="svg-step" x="718" y="87">p12</text>
                  <text class="svg-step" x="830" y="80">6 run · 6 cached</text>
                  <text class="svg-sub" x="830" y="100">correct</text>
                </g>
                
                <g>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="230" y="152"></rect><text class="svg-step" x="268" y="177">p01</text>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="380" y="152"></rect><text class="svg-step" x="402" y="177">p05 p08</text>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="530" y="152"></rect><text class="svg-step" x="552" y="177">p09 p11</text>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="680" y="152"></rect><text class="svg-step" x="718" y="177">p12</text>
                  <text class="svg-step" x="830" y="170">6 run · 6 cached</text>
                  <text class="svg-sub" x="830" y="190">correct</text>
                </g>
                
                <g>
                  <rect fill="#f7e3c8" height="40" rx="4" stroke="#d98226" width="110" x="230" y="242"></rect><text class="svg-step" x="268" y="267">p01</text>
                  <rect fill="#f3dfdc" height="40" rx="4" stroke="#ad4b43" stroke-dasharray="4 3" width="110" x="380" y="242"></rect><text class="svg-step" x="402" y="267">p05 p08</text>
                  <rect fill="#f3dfdc" height="40" rx="4" stroke="#ad4b43" stroke-dasharray="4 3" width="110" x="530" y="242"></rect><text class="svg-step" x="552" y="267">p09 p11</text>
                  <rect fill="#f3dfdc" height="40" rx="4" stroke="#ad4b43" stroke-dasharray="4 3" width="110" x="680" y="242"></rect><text class="svg-step" x="718" y="267">p12</text>
                  <text class="svg-step" x="830" y="260">1 run · 11 cached</text>
                  <text class="svg-sub" x="830" y="280">5 stale outputs restored</text>
                </g>
                <rect fill="#f7e3c8" height="14" rx="3" stroke="#d98226" width="14" x="230" y="306"></rect>
                <text class="svg-sub" x="252" y="318">re-executed</text>
