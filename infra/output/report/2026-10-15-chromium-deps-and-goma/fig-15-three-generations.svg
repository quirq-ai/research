                <text class="svg-note" text-anchor="middle" x="223" y="672">2014</text>
                <text class="svg-note" text-anchor="middle" x="356" y="672">2016</text>
                <text class="svg-note" text-anchor="middle" x="489" y="672">2018</text>
                <text class="svg-note" text-anchor="middle" x="622" y="672">2020</text>
                <text class="svg-note" text-anchor="middle" x="755" y="672">2022</text>
                <text class="svg-note" text-anchor="middle" x="888" y="672">2024</text>
                <text class="svg-note" text-anchor="middle" x="1021" y="672">2026</text>

                <line opacity="0.32" stroke="#ad4b43" stroke-linecap="round" stroke-width="6" x1="118" x2="912" y1="452" y2="452"></line>
                <circle cx="118" cy="452" fill="#ad4b43" r="4"></circle>
                <text class="svg-sub" text-anchor="middle" x="118" y="470">2012-06</text>
                <text class="svg-note" text-anchor="middle" x="118" y="486">described</text>
                <circle cx="489" cy="452" fill="#ad4b43" r="4"></circle>
                <text class="svg-sub" text-anchor="middle" x="489" y="470">2018-01</text>
                <text class="svg-note" text-anchor="middle" x="489" y="486">open-sourced</text>
                <circle cx="679" cy="452" fill="#ad4b43" r="4"></circle>
                <text class="svg-sub" text-anchor="middle" x="679" y="470">2020-11</text>
                <text class="svg-note" text-anchor="middle" x="679" y="486">backend = RBE</text>
                <circle cx="867" cy="452" fill="#ad4b43" r="4"></circle>
                <text class="svg-sub" text-anchor="middle" x="867" y="470">2023-09</text>
                <text class="svg-note" text-anchor="middle" x="867" y="486">deprecation PSA</text>
                <circle cx="912" cy="452" fill="#ad4b43" r="4"></circle>
