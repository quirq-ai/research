<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 646" role="img" aria-label="A decision flow of four questions asked in order down the left, each with a yes branch to an answer on the right. Question 1: does the ecosystem expect a format? Yes: use that format with the guardrails; YAML for Actions, Compose, Kubernetes and Ansible, TOML for Cargo.toml, pyproject.toml and Codex, JSON for package.json, tsconfig and Claude Code. Question 2: will a program write it? Yes: strict JSON with a JSON Schema if the program owns it; if people edit it too, JSONC through one parser, or a preserving editor such as tomlkit, toml_edit or ruamel's round-trip mode. Question 3: will people edit it by hand? Yes: TOML written as the 1.0 subset, with top-level keys before the first table, absence documented because there is no null, and integers within int64, or within 2 to the 53 if JavaScript reads them. Question 4: does it need logic or types across files? Yes: a configuration language such as CUE, Pkl, Nickel, Dhall or Jsonnet, or configuration as code such as eslint.config.js, whose output still needs guarding. If every answer is no: strict JSON with a schema. Answers are tinted grey when the format is chosen for you, blue when a program writes the file, green when people write it, and purple when it is computed."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }</style><rect x="0.0" y="0.0" width="1120.0" height="646.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-decision-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">ASK IN THIS ORDER</text>
                <text class="svg-lane" x="600" y="18">ON THE FIRST YES, USE</text>

                <rect fill="#f7f7f5" height="96" rx="8" stroke="#b8b8b1" width="440" x="0" y="36"></rect>
                <text class="svg-num" x="16" y="62">1</text>
                <text class="svg-step" x="34" y="62">Does the ecosystem expect a format?</text>
                <text class="svg-sub" x="16" y="86">a tool documents one format, or a</text>
                <text class="svg-sub" x="16" y="104">spec defines the file it reads</text>

                <rect fill="#deded9" height="96" rx="8" stroke="#b8b8b1" width="520" x="600" y="36"></rect>
                <text class="svg-step" x="616" y="62">Use that format, with the guardrails</text>
                <text class="svg-sub" x="616" y="86">YAML: Actions, Compose, Kubernetes, Ansible</text>
                <text class="svg-sub" x="616" y="104">TOML: Cargo.toml, pyproject.toml, Codex</text>
                <text class="svg-sub" x="616" y="122">JSON: package.json, tsconfig, Claude Code</text>

                <rect fill="#f7f7f5" height="96" rx="8" stroke="#b8b8b1" width="440" x="0" y="160"></rect>
                <text class="svg-num" x="16" y="186">2</text>
                <text class="svg-step" x="34" y="186">Will a program write it?</text>
                <text class="svg-sub" x="16" y="210">cargo add, uv add, a settings UI,</text>
                <text class="svg-sub" x="16" y="228">an agent that edits its own config</text>

                <rect fill="#e0ebf2" height="96" rx="8" stroke="#3c6f97" width="520" x="600" y="160"></rect>
                <text class="svg-step" x="616" y="186">Strict JSON and a schema, or a preserving editor</text>
                <text class="svg-sub" x="616" y="210">the program owns it: strict JSON + JSON Schema</text>
                <text class="svg-sub" x="616" y="228">people edit it too: JSONC via one parser,</text>
                <text class="svg-sub" x="616" y="246">or tomlkit, toml_edit, ruamel round-trip</text>

                <rect fill="#f7f7f5" height="96" rx="8" stroke="#b8b8b1" width="440" x="0" y="284"></rect>
                <text class="svg-num" x="16" y="310">3</text>
                <text class="svg-step" x="34" y="310">Will people edit it by hand?</text>
                <text class="svg-sub" x="16" y="334">the usual case for an application's</text>
                <text class="svg-sub" x="16" y="352">or a tool's own settings</text>

                <rect fill="#dfede5" height="96" rx="8" stroke="#367f59" width="520" x="600" y="284"></rect>
                <text class="svg-step" x="616" y="310">TOML, written as the 1.0 subset</text>
                <text class="svg-sub" x="616" y="334">top-level keys before the first [table]</text>
                <text class="svg-sub" x="616" y="352">absence documented, since there is no null</text>
                <text class="svg-sub" x="616" y="370">integers in int64; within 2⁵³ for JS</text>

                <rect fill="#f7f7f5" height="96" rx="8" stroke="#b8b8b1" width="440" x="0" y="408"></rect>
                <text class="svg-num" x="16" y="434">4</text>
                <text class="svg-step" x="34" y="434">Does it need logic or types across files?</text>
                <text class="svg-sub" x="16" y="458">values computed from other values,</text>
                <text class="svg-sub" x="16" y="476">constraints shared by many files</text>

                <rect fill="#ece6f3" height="96" rx="8" stroke="#765b98" width="520" x="600" y="408"></rect>
                <text class="svg-step" x="616" y="434">A configuration language, or code</text>
                <text class="svg-sub" x="616" y="458">CUE, Pkl, Nickel, Dhall, Jsonnet</text>
                <text class="svg-sub" x="616" y="476">eslint.config.js: configuration as code</text>
                <text class="svg-sub" x="616" y="494">its output is parsed: guard that too</text>

                <rect fill="#e0ebf2" height="60" rx="8" stroke="#3c6f97" width="440" x="0" y="536"></rect>
                <text class="svg-step" x="16" y="562">Otherwise: strict JSON, with a schema</text>
                <text class="svg-sub" x="16" y="582">generated once, read only by programs</text>

                <g fill="none" marker-end="url(#fig-decision-arr)" stroke="#252525" stroke-width="2.4">
                  <path d="M440 84 L594 84"></path>
                  <path d="M440 208 L594 208"></path>
                  <path d="M440 332 L594 332"></path>
                  <path d="M440 456 L594 456"></path>
                  <path d="M220 132 L220 154"></path>
                  <path d="M220 256 L220 278"></path>
                  <path d="M220 380 L220 402"></path>
                  <path d="M220 504 L220 530"></path>
                </g>
                <text class="svg-sub" x="504" y="76">yes</text>
                <text class="svg-sub" x="504" y="200">yes</text>
                <text class="svg-sub" x="504" y="324">yes</text>
                <text class="svg-sub" x="504" y="448">yes</text>
                <text class="svg-sub" x="232" y="150">no</text>
                <text class="svg-sub" x="232" y="274">no</text>
                <text class="svg-sub" x="232" y="398">no</text>
                <text class="svg-sub" x="232" y="524">no</text>

                <rect fill="#deded9" height="14" rx="3" stroke="#b8b8b1" width="14" x="0" y="618"></rect>
                <text class="svg-sub" x="20" y="629">chosen for you</text>
                <rect fill="#e0ebf2" height="14" rx="3" stroke="#3c6f97" width="14" x="160" y="618"></rect>
                <text class="svg-sub" x="180" y="629">a program writes it</text>
                <rect fill="#dfede5" height="14" rx="3" stroke="#367f59" width="14" x="340" y="618"></rect>
                <text class="svg-sub" x="360" y="629">people write it</text>
                <rect fill="#ece6f3" height="14" rx="3" stroke="#765b98" width="14" x="500" y="618"></rect>
                <text class="svg-sub" x="520" y="629">it is computed</text>
                <path d="M660 625 L700 625" fill="none" marker-end="url(#fig-decision-arr)" stroke="#252525" stroke-width="2.4"></path>
                <text class="svg-sub" x="712" y="629">control: yes to an answer, no to the next question</text>
              </svg>
