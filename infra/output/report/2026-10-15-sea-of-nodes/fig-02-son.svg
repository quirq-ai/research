<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-label="The same function drawn as a sea of nodes graph"><style>.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="545.0" fill="#ffffff"/>
              
              <g fill="none" stroke="#252525" stroke-width="2.4">
                <polyline points="100,72 100,211 450,211"></polyline>
                <line x1="490" x2="430" y1="227" y2="265"></line>
                <line x1="530" x2="650" y1="227" y2="265"></line>
                <line x1="430" x2="430" y1="297" y2="405"></line>
                <line x1="650" x2="650" y1="297" y2="405"></line>
                <line x1="430" x2="480" y1="437" y2="475"></line>
                <line x1="650" x2="530" y1="437" y2="475"></line>
              </g>
              
              <g fill="none" stroke="#3c6f97" stroke-width="1.3">
                <line x1="250" x2="290" y1="72" y2="120"></line>
                <line x1="390" x2="340" y1="72" y2="120"></line>
                <line x1="300" x2="490" y1="72" y2="120"></line>
                <line x1="530" x2="520" y1="72" y2="120"></line>
                <line x1="510" x2="510" y1="152" y2="195"></line>
                <line x1="310" x2="310" y1="152" y2="335"></line>
                <polyline points="680,72 680,100 200,100 200,351 250,351"></polyline>
                <line x1="330" x2="410" y1="367" y2="405"></line>
                <polyline points="600,56 860,56 860,421 710,421"></polyline>
              </g>

              
              <rect fill="#f7f7f5" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="120" x="40" y="40"></rect>
              <text class="svg-step" text-anchor="middle" x="100" y="61">Start</text>

              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="200" y="40"></rect>
              <text class="svg-step" text-anchor="middle" x="260" y="61">Parameter x</text>

              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="340" y="40"></rect>
              <text class="svg-step" text-anchor="middle" x="400" y="61">Parameter y</text>

              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="480" y="40"></rect>
              <text class="svg-step" text-anchor="middle" x="540" y="61">Constant 0</text>

              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="620" y="40"></rect>
              <text class="svg-step" text-anchor="middle" x="680" y="61">Constant 1</text>

              <rect fill="#f7e3c8" height="32" rx="6" stroke="#d98226" stroke-width="1.6" width="120" x="250" y="120"></rect>
              <text class="svg-step" text-anchor="middle" x="310" y="141">Multiply</text>

              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="450" y="120"></rect>
              <text class="svg-step" text-anchor="middle" x="510" y="141">LessThan</text>

              <rect fill="#f7f7f5" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="120" x="450" y="195"></rect>
              <text class="svg-step" text-anchor="middle" x="510" y="216">Branch</text>

              <rect fill="#dfede5" height="32" rx="6" stroke="#367f59" stroke-width="1.6" width="120" x="370" y="265"></rect>
              <text class="svg-step" text-anchor="middle" x="430" y="286">IfTrue</text>

              <rect fill="#f3dfdc" height="32" rx="6" stroke="#ad4b43" stroke-width="1.6" width="120" x="590" y="265"></rect>
              <text class="svg-step" text-anchor="middle" x="650" y="286">IfFalse</text>

              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="250" y="335"></rect>
              <text class="svg-step" text-anchor="middle" x="310" y="356">Add</text>

              <rect fill="#f7f7f5" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="120" x="370" y="405"></rect>
              <text class="svg-step" text-anchor="middle" x="430" y="426">Return</text>

              <rect fill="#f7f7f5" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="120" x="590" y="405"></rect>
              <text class="svg-step" text-anchor="middle" x="650" y="426">Return</text>

              <rect fill="#f7f7f5" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="120" x="440" y="475"></rect>
              <text class="svg-step" text-anchor="middle" x="500" y="496">End</text>

              
              <text class="svg-note" x="740" y="140">Constant 0 has two users —</text>
              <text class="svg-note" x="740" y="158">the comparison and the second</text>
              <text class="svg-note" x="740" y="176">return. One node, shared.</text>

              <text class="svg-note" x="60" y="300">Multiply has no control edge</text>
              <text class="svg-note" x="60" y="318">at all. Nothing says where it</text>
              <text class="svg-note" x="60" y="336">runs. It floats.</text>

              
              <line stroke="#deded9" x1="740" x2="960" y1="250" y2="250"></line>
              <line stroke="#3c6f97" stroke-width="1.3" x1="748" x2="788" y1="278" y2="278"></line>
              <text class="svg-sub" x="798" y="282">value edge — "I need this answer"</text>
              <line stroke="#252525" stroke-width="2.4" x1="748" x2="788" y1="306" y2="306"></line>
              <text class="svg-sub" x="798" y="310">control edge — "run in this order"</text>
              <line stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.8" x1="748" x2="788" y1="334" y2="334"></line>
              <text class="svg-sub" x="798" y="338">effect edge — see §05</text>
            </svg>
