<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" role="img" aria-label="Business intents on the left; work drawn as a path of state changes taken by an agent or a person; an outcome space on the right divided by the declared definition of done into a region of good outcomes above and bad outcomes below. Two of the four paths land in the good region, two in the bad."><style>.os-band { fill: #252525; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; }
.os-sub { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; }
.os-chip { fill: #252525; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; font-weight: 620; }
.os-track { fill: none; stroke: #b8b8b1; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.os-step { stroke: #ffffff; stroke-width: 2; }
.os-step.is-agent { fill: #3c6f97; }
.os-step.is-human { fill: #d98226; }
.os-land { stroke: #ffffff; stroke-width: 2.5; }
.os-land.is-good { fill: #367f59; }
.os-land.is-bad { fill: #ad4b43; }
.os-region.is-good { fill: #dfede5; }
.os-region.is-bad { fill: #f3dfdc; opacity: 0.75; }
.os-boundary { fill: none; stroke: #4f4f4b; stroke-width: 1.6; }
.os-region-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; font-size: 15px; font-weight: 650; }
.os-region-name.is-good { fill: #367f59; }
.os-region-name.is-bad { fill: #ad4b43; }
.os-region-sub { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; }
.os-region-sub.is-good { fill: #4a8b6b; }
.os-region-sub.is-bad { fill: #b0665f; }
.os-note { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; }
.os-key { fill: #777772; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; }</style><rect x="0.0" y="0.0" width="1000.0" height="404.0" fill="#ffffff"/>
