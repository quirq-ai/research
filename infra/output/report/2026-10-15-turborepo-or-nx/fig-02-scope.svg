<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Two stacked columns of capability layers. Both columns share the bottom three layers: task graph and scheduling, content-hashed local cache, and remote cache protocol. Turborepo's column then adds pruning for Docker, generators, and experimental boundaries, drawn thin. Nx's column adds inferred tasks from plugins, generators and migrations, lint-enforced module boundaries, release versioning, distributed CI agents, self-healing CI, and an MCP server."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="380.0" fill="#ffffff"/>
