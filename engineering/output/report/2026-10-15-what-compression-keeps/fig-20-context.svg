<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 526" role="img" aria-label="Three columns. Left, the context window before compaction, oldest content at the top, filled to the trigger line. Its ten blocks are tinted by their fate. System prompt and tools sit outside the history, unchanged. Kept exactly: project CLAUDE.md and auto memory, re-injected from disk; files read or edited, up to five re-read; path-scoped rules and nested CLAUDE.md, summarised but reloaded on demand; the most recent records, kept verbatim by some tools. Kept approximately, in the summary: early instructions, whose detail may be lost; requests and key code snippets; context added by hooks. Dropped for good: older tool outputs, cleared first by Claude Code; images, documents and fetched URLs in the summarised range, per the Claude API docs. Middle, top to bottom: dashed purple edges send the dropped blocks to a box noting that the host's transcript may still hold them; a box for files on disk feeds the re-injected blocks with a thin blue edge; the summariser, a separate model request over the same system prompt, tools and history, receives the whole history on a thin blue edge and writes the summary; and a trigger box, about 967K of 1M tokens in Claude Code or 150K input tokens by default in the Claude API, reached by a thick black edge from the fill line and sending one on to the summariser. Right, the next request: system prompt and tools; project CLAUDE.md and auto memory; a fresh git status; up to five recent files, over 5,000 tokens as a path only; invoked skill bodies capped at 5,000 tokens each and 25,000 in all; the summary, readable text in the Claude API and an opaque item at OpenAI; the most recent records; path rules reloaded on demand; and free room for new turns."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="526.0" fill="#ffffff"/>
