<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 980 354" role="img" aria-label="Three columns: browser clients on the left connect over WebSocket to a Liveblocks room on the edge in the middle; an application server on the right issues tokens, mutates rooms through the REST API, and receives webhooks."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-24.0" width="980.0" height="354.0" fill="#ffffff"/>
                <defs>
                  <marker id="arr-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                  <marker id="arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="arr-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
                </defs>
                <text class="svg-lane" x="20" y="28">YOUR CLIENTS</text>
                <text class="svg-lane" x="370" y="28">LIVEBLOCKS (HOSTED)</text>
                <text class="svg-lane" x="700" y="28">YOUR SERVER</text>

                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" width="230" x="20" y="48"></rect>
                <text class="svg-step" x="36" y="74">Browser · @liveblocks/client</text>
                <text class="svg-sub" x="36" y="94">enterRoom(id) · presence · storage</text>
                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" width="230" x="20" y="124"></rect>
                <text class="svg-step" x="36" y="150">Second browser · phone</text>
                <text class="svg-sub" x="36" y="170">same room, same token flow</text>
                <rect fill="#ece6f3" height="64" rx="8" stroke="#765b98" width="230" x="20" y="200"></rect>
                <text class="svg-step" x="36" y="226">Agent (no socket)</text>
                <text class="svg-sub" x="36" y="246">REST: presence · json-patch · feeds</text>

                <rect fill="#f7f7f5" height="216" rx="10" stroke="#b8b8b1" width="260" x="370" y="48"></rect>
                <text class="svg-step" x="386" y="76">Project (keys, region, usage)</text>
                <rect fill="#ffffff" height="156" rx="8" stroke="#deded9" width="228" x="386" y="92"></rect>
                <text class="svg-step" x="400" y="116">Room = one artifact</text>
                <text class="svg-sub" x="400" y="138">Presence · Broadcast</text>
                <text class="svg-sub" x="400" y="156">Storage (Live* CRDT tree)</text>
                <text class="svg-sub" x="400" y="174">Feeds · Threads</text>
                <text class="svg-sub" x="400" y="192">Yjs doc · version history</text>
                <text class="svg-note" x="400" y="228">"a stateful WebSocket server on the edge"</text>

                <rect fill="#ffffff" height="64" rx="8" stroke="#252525" width="260" x="700" y="48"></rect>
                <text class="svg-step" x="716" y="74">Auth endpoint</text>
                <text class="svg-sub" x="716" y="94">identifyUser / prepareSession → token</text>
                <rect fill="#ffffff" height="64" rx="8" stroke="#252525" width="260" x="700" y="124"></rect>
                <text class="svg-step" x="716" y="150">@liveblocks/node · pip liveblocks</text>
                <text class="svg-sub" x="716" y="170">secret key → api.liveblocks.io/v2</text>
                <rect fill="#ffffff" height="64" rx="8" stroke="#252525" width="260" x="700" y="200"></rect>
                <text class="svg-step" x="716" y="226">Webhook receiver</text>
                <text class="svg-sub" x="716" y="246">storageUpdated · commentCreated · …</text>

                <line marker-end="url(#arr-blue)" stroke="#3c6f97" stroke-width="1.5" x1="250" x2="370" y1="80" y2="120"></line>
                <line marker-end="url(#arr-blue)" stroke="#3c6f97" stroke-width="1.5" x1="250" x2="370" y1="156" y2="150"></line>
                <line marker-end="url(#arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="250" x2="370" y1="232" y2="200"></line>
                <line marker-end="url(#arr-ink)" stroke="#252525" stroke-width="2.5" x1="700" x2="630" y1="156" y2="156"></line>
                <line marker-end="url(#arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="630" x2="700" y1="232" y2="232"></line>
                <path d="M135 48 C135 -4 830 -4 830 48" fill="none" marker-end="url(#arr-ink)" stroke="#252525" stroke-width="2.5"></path>
                <text class="svg-note" text-anchor="middle" x="482" y="2">token request → token</text>
                <text class="svg-note" text-anchor="middle" x="490" y="304">thin blue = data over WebSocket · thick black = control (token issue, REST mutation) · dashed purple = effect (agent writes, webhook callbacks)</text>
              </svg>
