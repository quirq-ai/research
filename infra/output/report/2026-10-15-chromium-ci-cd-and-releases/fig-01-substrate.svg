                <text class="svg-sub" x="164" y="68">Commit-Queue+2</text>
                <rect fill="#e0ebf2" height="62" rx="8" stroke="#3c6f97" width="164" x="338" y="24"></rect>
                <text class="svg-step" x="352" y="48">Run → tryjobs</text>
                <text class="svg-sub" x="352" y="68">reuse, retry, submit</text>
