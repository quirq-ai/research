<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 622" role="img" aria-label="Four panels. A: the /dyn tree of root layout, page, Suspense and a component that awaits cookies(), drawn twice. In the legacy model every box is dynamic: cookies() throws DynamicServerError, revalidate becomes 0 and the whole route renders per request. Under Cache Components the call returns a hanging promise; only the subtree under the nearest Suspense is a hole and its fallback ships in the shell. B: pass 1 renders with a CacheSignal and fills a per-page Resume Data Cache; pass 2 replays it and advances one stage per task, ShellStatic 10, PrefetchStatic 12, NavigationStatic 13, Static 14; anything still pending is a hole, legal only with a Suspense frame above it, otherwise a build error. C: measured timeline of one request: PPR /dyn first byte 3.63 ms and last byte 15.35 ms at p50, the 2,298-byte shell arriving at 4.1 to 5.0 ms and the resumed part at 10.9 to 22.4 ms; the same page without Cache Components 6.45 to 7.92 ms; a static page 3.07 to 3.42 ms; the PPR response is private, no-store, with x-nextjs-postponed: 1. D: a schematic chart of stale against expire: stale under 30 s is out of every prerender, stale under 300 s is out of the App Shell, expire under 300 s or revalidate 0 is out of static prerenders; the seconds preset sits in the last region and every other preset in the shell."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="622.0" fill="#ffffff"/>
