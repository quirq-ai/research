<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 320" role="img" aria-label="One Kafka partition with eleven records at offsets 0 to 10. Before cleaning: 0 K1=a, 1 K2=b, 2 K1=c, 3 K3=d, 4 K4=e, 5 K2=f, 6 K3 null (a tombstone), 7 K1=g, 8 K4=h in three closed segments, then 9 K2=i and 10 K1=j in the active segment, which is never cleaned. The log cleaner recopies segments 1 to 3 keeping the latest record per key. After one cleaning, offsets 0 to 4 are gone and nothing is renumbered; offsets 5 K2=f, 6 K3 tombstone, 7 K1=g, 8 K4=h, 9 K2=i and 10 K1=j remain. K1 and K2 still appear twice, because the guarantee is at least the last value per key. The tombstone stays until delete.retention.ms, one day by default, then goes."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="704.0" height="320.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-kafka-compact-blu" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>

                <text class="svg-lane" x="0" y="16">ONE PARTITION · BEFORE CLEANING</text>
                <rect fill="#ece6f3" height="44" rx="4" stroke="#765b98" width="56" x="0" y="28"></rect>
                <text class="svg-sub" x="8" y="44">0</text><text class="svg-sub" x="8" y="63">K1=a</text>
                <rect fill="#ece6f3" height="44" rx="4" stroke="#765b98" width="56" x="62" y="28"></rect>
                <text class="svg-sub" x="70" y="44">1</text><text class="svg-sub" x="70" y="63">K2=b</text>
                <rect fill="#ece6f3" height="44" rx="4" stroke="#765b98" width="56" x="124" y="28"></rect>
                <text class="svg-sub" x="132" y="44">2</text><text class="svg-sub" x="132" y="63">K1=c</text>
                <rect fill="#ece6f3" height="44" rx="4" stroke="#765b98" width="56" x="186" y="28"></rect>
                <text class="svg-sub" x="194" y="44">3</text><text class="svg-sub" x="194" y="63">K3=d</text>
                <rect fill="#ece6f3" height="44" rx="4" stroke="#765b98" width="56" x="248" y="28"></rect>
                <text class="svg-sub" x="256" y="44">4</text><text class="svg-sub" x="256" y="63">K4=e</text>
                <rect fill="#dfede5" height="44" rx="4" stroke="#367f59" width="56" x="310" y="28"></rect>
                <text class="svg-sub" x="318" y="44">5</text><text class="svg-sub" x="318" y="63">K2=f</text>
                <rect fill="#f3dfdc" height="44" rx="4" stroke="#ad4b43" width="56" x="372" y="28"></rect>
                <text class="svg-sub" x="376" y="44">6</text><text class="svg-sub" x="376" y="63">K3 null</text>
                <rect fill="#dfede5" height="44" rx="4" stroke="#367f59" width="56" x="434" y="28"></rect>
                <text class="svg-sub" x="442" y="44">7</text><text class="svg-sub" x="442" y="63">K1=g</text>
                <rect fill="#dfede5" height="44" rx="4" stroke="#367f59" width="56" x="496" y="28"></rect>
                <text class="svg-sub" x="504" y="44">8</text><text class="svg-sub" x="504" y="63">K4=h</text>
                <rect fill="#f7f7f5" height="44" rx="4" stroke="#b8b8b1" width="56" x="558" y="28"></rect>
                <text class="svg-sub" x="566" y="44">9</text><text class="svg-sub" x="566" y="63">K2=i</text>
                <rect fill="#f7f7f5" height="44" rx="4" stroke="#b8b8b1" width="56" x="620" y="28"></rect>
                <text class="svg-sub" x="628" y="44">10</text><text class="svg-sub" x="628" y="63">K1=j</text>

                <path d="M0 80 V86 H180 V80" fill="none" stroke="#b8b8b1"></path>
                <text class="svg-sub" text-anchor="middle" x="90" y="101">segment 1</text>
                <path d="M186 80 V86 H366 V80" fill="none" stroke="#b8b8b1"></path>
                <text class="svg-sub" text-anchor="middle" x="276" y="101">segment 2</text>
                <path d="M372 80 V86 H552 V80" fill="none" stroke="#b8b8b1"></path>
                <text class="svg-sub" text-anchor="middle" x="462" y="101">segment 3</text>
                <path d="M558 80 V86 H676 V80" fill="none" stroke="#b8b8b1"></path>
                <text class="svg-sub" text-anchor="middle" x="617" y="101">active, never cleaned</text>

                <line marker-end="url(#fig-kafka-compact-blu)" stroke="#3c6f97" stroke-width="1.4" x1="10" x2="10" y1="112" y2="146"></line>
                <text class="svg-sub" x="24" y="133">log cleaner: recopy segments 1–3, keep the latest record per key</text>

                <text class="svg-lane" x="0" y="166">AFTER ONE CLEANING · OFFSETS UNCHANGED</text>
                <rect fill="none" height="44" rx="4" stroke="#765b98" stroke-dasharray="4 3" width="56" x="0" y="176"></rect>
                <text class="svg-sub" x="8" y="192">0</text>
                <rect fill="none" height="44" rx="4" stroke="#765b98" stroke-dasharray="4 3" width="56" x="62" y="176"></rect>
                <text class="svg-sub" x="70" y="192">1</text>
                <rect fill="none" height="44" rx="4" stroke="#765b98" stroke-dasharray="4 3" width="56" x="124" y="176"></rect>
                <text class="svg-sub" x="132" y="192">2</text>
                <rect fill="none" height="44" rx="4" stroke="#765b98" stroke-dasharray="4 3" width="56" x="186" y="176"></rect>
                <text class="svg-sub" x="194" y="192">3</text>
                <rect fill="none" height="44" rx="4" stroke="#765b98" stroke-dasharray="4 3" width="56" x="248" y="176"></rect>
                <text class="svg-sub" x="256" y="192">4</text>
                <rect fill="#dfede5" height="44" rx="4" stroke="#367f59" width="56" x="310" y="176"></rect>
                <text class="svg-sub" x="318" y="192">5</text><text class="svg-sub" x="318" y="211">K2=f</text>
                <rect fill="#f3dfdc" height="44" rx="4" stroke="#ad4b43" width="56" x="372" y="176"></rect>
                <text class="svg-sub" x="376" y="192">6</text><text class="svg-sub" x="376" y="211">K3 null</text>
                <rect fill="#dfede5" height="44" rx="4" stroke="#367f59" width="56" x="434" y="176"></rect>
                <text class="svg-sub" x="442" y="192">7</text><text class="svg-sub" x="442" y="211">K1=g</text>
                <rect fill="#dfede5" height="44" rx="4" stroke="#367f59" width="56" x="496" y="176"></rect>
                <text class="svg-sub" x="504" y="192">8</text><text class="svg-sub" x="504" y="211">K4=h</text>
                <rect fill="#f7f7f5" height="44" rx="4" stroke="#b8b8b1" width="56" x="558" y="176"></rect>
                <text class="svg-sub" x="566" y="192">9</text><text class="svg-sub" x="566" y="211">K2=i</text>
                <rect fill="#f7f7f5" height="44" rx="4" stroke="#b8b8b1" width="56" x="620" y="176"></rect>
                <text class="svg-sub" x="628" y="192">10</text><text class="svg-sub" x="628" y="211">K1=j</text>

                <text class="svg-note" x="0" y="242">Offsets 0–4 are gone; nothing is renumbered.</text>
                <text class="svg-note" x="0" y="260">K1 and K2 still appear twice: the promise is at least the last value per key.</text>
                <text class="svg-note" x="0" y="278">The K3 tombstone stays until delete.retention.ms (one day by default), then goes.</text>

                <line stroke="#deded9" x1="0" x2="704" y1="290" y2="290"></line>
                <rect fill="#dfede5" height="14" rx="3" stroke="#367f59" width="14" x="0" y="300"></rect>
                <text class="svg-sub" x="22" y="311">kept by the cleaner</text>
                <rect fill="#ece6f3" height="14" rx="3" stroke="#765b98" width="14" x="170" y="300"></rect>
                <text class="svg-sub" x="192" y="311">superseded: dropped</text>
                <rect fill="#f3dfdc" height="14" rx="3" stroke="#ad4b43" width="14" x="345" y="300"></rect>
                <text class="svg-sub" x="367" y="311">tombstone</text>
                <rect fill="#f7f7f5" height="14" rx="3" stroke="#b8b8b1" width="14" x="445" y="300"></rect>
                <text class="svg-sub" x="467" y="311">not yet cleaned</text>
                <line marker-end="url(#fig-kafka-compact-blu)" stroke="#3c6f97" stroke-width="1.4" x1="590" x2="620" y1="307" y2="307"></line>
                <text class="svg-sub" x="630" y="311">data</text>
              </svg>
