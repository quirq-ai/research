<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="An IF node producing a tuple, unpacked by two projection nodes"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="340.0" fill="#ffffff"/>
              <text class="svg-lane" x="30" y="34">WHAT IT REPLACES</text>
              <line stroke="#deded9" x1="30" x2="330" y1="44" y2="44"></line>
              <rect fill="#f7f7f5" height="76" rx="7" stroke="#deded9" width="300" x="30" y="64"></rect>
              <text class="svg-sub" x="48" y="88">…</text>
              <text class="svg-step" x="48" y="110">cc := predicate</text>
              <text class="svg-step" x="48" y="132">branch eq B1</text>
              <text class="svg-note" x="30" y="176">One instruction, two hidden results:</text>
              <text class="svg-note" x="30" y="194">a condition code and a control transfer.</text>

              <line stroke="#deded9" x1="380" x2="380" y1="24" y2="316"></line>

              <text class="svg-lane" x="420" y="34">WHAT IT BECOMES</text>
              <line stroke="#deded9" x1="420" x2="960" y1="44" y2="44"></line>

              <rect fill="#ffffff" height="30" rx="6" stroke="#252525" stroke-width="1.4" width="120" x="440" y="64"></rect>
              <text class="svg-step" text-anchor="middle" x="500" y="84">control</text>
              <rect fill="#e0ebf2" height="30" rx="6" stroke="#3c6f97" width="120" x="600" y="64"></rect>
              <text class="svg-step" text-anchor="middle" x="660" y="84">predicate</text>

              <g fill="none" stroke="#252525" stroke-width="2.4">
                <line x1="500" x2="560" y1="94" y2="130"></line>
              </g>
              <g fill="none" stroke="#3c6f97" stroke-width="1.3">
                <line x1="660" x2="620" y1="94" y2="130"></line>
              </g>

              <rect fill="#ffffff" height="30" rx="6" stroke="#252525" stroke-width="1.8" width="120" x="530" y="130"></rect>
              <text class="svg-step" text-anchor="middle" x="590" y="150">IF</text>

              <g fill="none" stroke="#252525" stroke-width="2.4">
                <line x1="560" x2="500" y1="160" y2="196"></line>
                <line x1="620" x2="690" y1="160" y2="196"></line>
                <line x1="500" x2="500" y1="226" y2="262"></line>
                <line x1="690" x2="690" y1="226" y2="262"></line>
              </g>

              <rect fill="#dfede5" height="30" rx="6" stroke="#367f59" stroke-width="1.4" width="140" x="430" y="196"></rect>
              <text class="svg-sub" text-anchor="middle" x="500" y="216">PROJECTION true</text>
              <rect fill="#f3dfdc" height="30" rx="6" stroke="#ad4b43" stroke-width="1.4" width="140" x="620" y="196"></rect>
              <text class="svg-sub" text-anchor="middle" x="690" y="216">PROJECTION false</text>

              <rect fill="#ffffff" height="30" rx="6" stroke="#252525" stroke-width="1.4" width="120" x="440" y="262"></rect>
              <text class="svg-step" text-anchor="middle" x="500" y="282">REGION B1</text>
              <rect fill="#ffffff" height="30" rx="6" stroke="#252525" stroke-width="1.4" width="120" x="630" y="262"></rect>
              <text class="svg-step" text-anchor="middle" x="690" y="282">REGION B2</text>

              <text class="svg-note" x="790" y="150">The IF emits one tuple</text>
              <text class="svg-note" x="790" y="168">{ true-control,</text>
              <text class="svg-note" x="790" y="186">  false-control }</text>
              <text class="svg-note" x="790" y="212">on every out-edge.</text>
              <text class="svg-note" x="790" y="240">Each projection keeps</text>
              <text class="svg-note" x="790" y="258">one field and costs</text>
              <text class="svg-note" x="790" y="276">zero cycles.</text>
            </svg>
