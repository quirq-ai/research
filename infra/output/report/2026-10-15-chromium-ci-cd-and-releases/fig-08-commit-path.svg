      <text class="svg-lane" x="8" y="418">RESULTDB</text>

      <rect fill="#f7f7f5" height="58" rx="8" stroke="#252525" width="212" x="175" y="26"></rect>
      <text class="svg-step" x="189" y="50">git cl upload</text>
      <text class="svg-sub" x="189" y="70">presubmit_support --upload</text>

      <rect fill="#f7f7f5" height="58" rx="8" stroke="#252525" width="212" x="412" y="26"></rect>
      <text class="svg-step" x="426" y="50">git cl try -B … -b …</text>
      <text class="svg-sub" x="426" y="70">user_agent: git_cl_try</text>

      <rect fill="#e0ebf2" height="62" rx="8" stroke="#3c6f97" width="212" x="175" y="118"></rect>
      <text class="svg-step" x="189" y="142">New change, WIP</text>
      <text class="svg-sub" x="189" y="162">refs/for/&lt;branch&gt;%l=CQ+2</text>

      <rect fill="#e0ebf2" height="62" rx="8" stroke="#3c6f97" width="212" x="412" y="118"></rect>
      <text class="svg-step" x="426" y="142">Review gates</text>
      <text class="svg-sub" x="426" y="162">CR+1 · OWNERS · Bot-Commit</text>

      <rect fill="#ece6f3" height="62" rx="8" stroke="#765b98" width="212" x="412" y="212"></rect>
      <text class="svg-step" x="426" y="236">Run: PENDING → RUNNING</text>
