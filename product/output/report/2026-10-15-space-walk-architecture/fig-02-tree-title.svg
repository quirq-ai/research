                <text fill="#777772" font-size="11" text-anchor="middle" x="250" y="38">rings: r = depth · step</text>
                <text fill="#367f59" font-size="11" font-weight="600" x="452" y="150">subtree owns a</text>
                <text fill="#367f59" font-size="11" font-weight="600" x="452" y="165">contiguous span</text>
                <text fill="#c67210" font-size="11" font-weight="600" x="372" y="234">dir at centroid</text>
                <text fill="#2f74ab" font-size="11" x="418" y="330">leaves: one slot each</text>
                <text fill="#2f74ab" font-size="10.5" x="300" y="270">eased edge, 8 segments</text>
                
                <rect fill="#f7f7f5" height="310" rx="12" stroke="#b8b8b1" width="330" x="600" y="60"></rect>
                <text fill="#777772" font-size="11" font-weight="700" letter-spacing="1.5" x="620" y="92">THE ENTIRE LAYOUT, FOUR LINES</text>
                <g fill="#252525" font-family="SFMono-Regular, Consolas, monospace" font-size="13">
                  <text x="620" y="130">L = total file leaves</text>
                  <text x="620" y="162">R = max(55, 4·√L)</text>
                  <text x="620" y="194">step = R ⁄ maxDepth</text>
                  <text x="620" y="226">θ_slot = 2π ⁄ L</text>
                </g>
                <g fill="#4f4f4b" font-size="11.5">
                  <text x="620" y="262">dir angle = (cursor + leaves⁄2)·θ_slot</text>
                  <text x="620" y="284">leaf angle = (cursor + 0.5)·θ_slot</text>
                  <text x="620" y="306">edge ease = t²·(3 − 2t), radius linear</text>
                  <text fill="#777772" x="620" y="340">no collision pass: slots are assigned,</text>
                  <text fill="#777772" x="620" y="356">not searched for — distinct, not disjoint</text>
                </g>
