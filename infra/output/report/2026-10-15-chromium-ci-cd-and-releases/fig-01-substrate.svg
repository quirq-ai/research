                <rect fill="#f3dfdc" height="62" rx="8" stroke="#ad4b43" width="164" x="526" y="252"></rect>
                <text class="svg-step" x="540" y="276">chrome project</text>
                <text class="svg-sub" x="540" y="296">bucket not public</text>
                <rect fill="#f3dfdc" height="62" rx="8" stroke="#ad4b43" width="164" x="714" y="252"></rect>
                <text class="svg-step" x="728" y="276">official builders</text>
                <text class="svg-sub" x="728" y="296">not enumerable</text>
                <rect fill="#ffffff" height="62" rx="8" stroke="#d98226" width="164" x="902" y="252"></rect>
                <text class="svg-step" x="916" y="276">chromiumdash</text>
                <text class="svg-sub" x="916" y="296">branch, ship dates</text>

