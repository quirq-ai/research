<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 196" role="img" aria-label="Task success rate on WebArena-Lite for a Llama 3.1 8B agent: 4.8 per cent for the base instruct model, 20.6 after supervised imitation on the same data, and 42.4 after reinforcement learning on verified task completion. GPT-4-Turbo scores 17.6 on the same benchmark."><style>line { opacity: 0.3; }
