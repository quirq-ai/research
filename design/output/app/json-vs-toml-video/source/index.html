<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Time base: 90 BPM. Every event below is placed in beats; seek(t) is a pure function of t.
// ---------------------------------------------------------------------------------------------
const BPM = 90, BEAT = 60 / BPM, b = n => n * BEAT;
const DURATION = b(152);
const M = window.MEASURED;

const C = { ink: "#252525", soft: "#4f4f4b", faint: "#8a8a84", line: "#deded9", paper: "#f6f5f1", blue: "#3c6f97",
  purple: "#765b98", green: "#367f59", red: "#ad4b43", orange: "#d98226" };
const STATE = {
  neutral: { bg: "#efeee9", border: "#deded9", dot: "#c9c8c2", nm: "#6b6b66", vl: "#8a8a84" },
  ok: { bg: "#dfede5", border: "#a9cbb8", dot: "#367f59", nm: "#252525", vl: "#2c6a4a" },
  err: { bg: "#f3dfdc", border: "#dcb0aa", dot: "#ad4b43", nm: "#252525", vl: "#963c35" },
  diff: { bg: "#f7e3c8", border: "#e7bd85", dot: "#d98226", nm: "#252525", vl: "#9c5810" },
};

// ---------- math -------------------------------------------------------------------------------
const clamp = (x, a = 0, b2 = 1) => Math.min(b2, Math.max(a, x));
const lerp = (a, b2, x) => a + (b2 - a) * x;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// closed-form spring step response (zeta 0.78: about 2% overshoot), settles in roughly `dur` seconds
function spring(x, dur = 0.45, zeta = 0.78) {
  if (x <= 0) return 0;
  const wn = 4.6 / (zeta * dur), wd = wn * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * wn * x) * (Math.cos(wd * x) + (zeta * wn / wd) * Math.sin(wd * x));
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b2, x) {
  const A = hex(a), B = hex(b2); x = clamp(x);
  return "rgb(" + A.map((v, i) => Math.round(lerp(v, B[i], x))).join(",") + ")";
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// ---------- DOM ---------------------------------------------------------------------------------
const stage = document.getElementById("stage");
function el(tag, cls, parent = stage, html = "") {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}

// ---------- the two files ---------------------------------------------------------------------
// Each line has one or more "lives": typed in over [a, b], optionally erased over [ea, eb].
// Suffix edits append characters to a line for a while (a trailing comma, say).
const COLX = { json: 96, toml: 996 };
function L(id, text, lives, suffixes = []) { return { id, text, lives, suffixes }; }
const CPS = 26; // typing speed, characters per second
function typed(text, a) { return [a, a + Math.max(0.12, text.length / CPS)]; }

// Setup typing: JSON first, then TOML.
const JSON_BASE = ['{', '  "title": "app",', '  "server": {', '    "host": "0.0.0.0",', '    "port": 8080', '  }', '}'];
const TOML_BASE = ['title = "app"', '', '[server]', 'host = "0.0.0.0"', 'port = 8080'];
function seq(lines, start, cps = 30, gap = 0.12) {
  const out = []; let t = start;
  for (const s of lines) { const w = [t, t + Math.max(0.12, s.length / cps)]; out.push(w); t = w[1] + gap; }
  return out;
}
// both files are typed at once in the setup, and both are finished before the parsers appear (b15)
const JW = seq(JSON_BASE, b(9.5)), TW = seq(TOML_BASE, b(10.5));

function life(text, a, ea, eb) { const w = typed(text, a); return { a: w[0], b: w[1], ea, eb }; }
const E = (n0, n1) => [b(n0), b(n1)]; // erase window helper

const FILES = {
  json: [
    L("j0", JSON_BASE[0], [{ a: JW[0][0], b: JW[0][1] }]),
    L("j1", JSON_BASE[1], [{ a: JW[1][0], b: JW[1][1] }]),
    L("jBig", '  "id": 9007199254740993,', [life('  "id": 9007199254740993,', b(64), ...E(75, 76.5))]),
    L("jDate", '  "deployed": "2026-10-09T09:30:00Z",', [life('  "deployed": "2026-10-09T09:30:00Z",', b(78), ...E(87, 88))]),
    L("jNull", '  "proxy": null,', [life('  "proxy": null,', b(89), ...E(98, 99))]),
    L("j2", JSON_BASE[2], [{ a: JW[2][0], b: JW[2][1] }]),
    L("j3", JSON_BASE[3], [{ a: JW[3][0], b: JW[3][1] }]),
    L("jCmt", '    // admin UI port', [life('    // admin UI port', b(25), ...E(36, 37))]),
    L("j4", JSON_BASE[4], [{ a: JW[4][0], b: JW[4][1] }],
      [{ text: ",", a: b(40), b: b(40) + 0.12, ea: b(46), eb: b(46) + 0.12 },
       { text: ",", a: b(49), b: b(49) + 0.12, ea: b(62.2), eb: b(62.2) + 0.12 }]),
    L("jDup", '    "port": 9090', [life('    "port": 9090', b(49.4), ...E(61, 62))]),
    L("j5", JSON_BASE[5], [{ a: JW[5][0], b: JW[5][1] }],
      [{ text: ",", a: b(100), b: b(100) + 0.12, ea: b(113.2), eb: b(113.2) + 0.12 }]),
    L("jDbg", '  "debug": true', [life('  "debug": true', b(100.4), ...E(112, 113))]),
    L("j6", JSON_BASE[6], [{ a: JW[6][0], b: JW[6][1] }]),
  ],
  toml: [
    L("t0", TOML_BASE[0], [{ a: TW[0][0], b: TW[0][1] }]),
    L("tBig", 'id = 9007199254740993', [life('id = 9007199254740993', b(65), ...E(75, 76.5))]),
    L("tDate", 'deployed = 2026-10-09T09:30:00Z', [life('deployed = 2026-10-09T09:30:00Z', b(79), ...E(87, 88))]),
    L("tNull", 'proxy =', [life('proxy =', b(89.6), ...E(98, 99))]),
    L("t1", TOML_BASE[1], [{ a: TW[1][0], b: TW[1][1] }]),
    L("tS0", 'server = {', [life('server = {', b(116.6), ...E(126, 126.6))]),
    L("tS1", '  host = "0.0.0.0",', [life('  host = "0.0.0.0",', b(116.6) + 0.55, ...E(126, 126.7))]),
    L("tS2", '  port = 8080,', [life('  port = 8080,', b(116.6) + 1.45, ...E(126, 126.6))]),
    L("tS3", '}', [life('}', b(116.6) + 2.1, ...E(126, 126.3))]),
    L("t2", TOML_BASE[2], [{ a: TW[2][0], b: TW[2][1], ea: b(115.2), eb: b(115.9) }, life(TOML_BASE[2], b(127))]),
    L("t3", TOML_BASE[3], [{ a: TW[3][0], b: TW[3][1], ea: b(115.0), eb: b(115.8) }, life(TOML_BASE[3], b(127) + 0.45)]),
    L("tCmt", '# admin UI port', [life('# admin UI port', b(25.6), ...E(36, 37))]),
    L("t4", TOML_BASE[4], [{ a: TW[4][0], b: TW[4][1], ea: b(114.8), eb: b(115.6) }, life(TOML_BASE[4], b(127) + 1.2)]),
    L("tDup", 'port = 9090', [life('port = 9090', b(50), ...E(61, 62))]),
    L("tBl2", '', [{ a: b(100.5), b: b(100.5), ea: b(113), eb: b(113) }]),
    L("tTop", '# top-level switch', [life('# top-level switch', b(100.6), ...E(112, 113))]),
    L("tDbg", 'debug = true', [life('debug = true', b(101.8), ...E(112, 112.8))]),
  ],
};
// lines that carry the edit in each scene (tinted while the scene runs)
const EDITS = [
  { lines: ["jCmt", "tCmt"], a: b(25), z: b(37) },
  { lines: ["j4"], a: b(40), z: b(46.3) },
  { lines: ["jDup", "tDup"], a: b(49), z: b(62) },
  { lines: ["jBig", "tBig"], a: b(64), z: b(76.5) },
  { lines: ["jDate", "tDate"], a: b(78), z: b(88) },
  { lines: ["jNull", "tNull"], a: b(89), z: b(99) },
  { lines: ["jDbg", "tTop", "tDbg"], a: b(100), z: b(113) },
  { lines: ["tS0", "tS1", "tS2", "tS3"], a: b(116.6), z: b(126.7) },
];
// squiggles under what a parser objected to or silently changed, shown after the verdict lands
const MARKS = [
  { line: "jCmt", from: 4, to: 20, color: C.red, a: b(28.6), z: b(36) },
  { line: "j4", from: 16, to: 17, color: C.red, a: b(41.6), z: b(46) },
  { line: "j4", from: 4, to: 16, color: C.orange, a: b(52.6), z: b(61), suffixWindow: 1 },
  { line: "tDup", from: 0, to: 11, color: C.red, a: b(52.6), z: b(61) },
  { line: "jBig", from: 8, to: 24, color: C.orange, a: b(67.6), z: b(75) },
  { line: "tNull", from: 0, to: 7, color: C.red, a: b(91.6), z: b(98) },
  { line: "tDbg", from: 0, to: 12, color: C.orange, a: b(104.6), z: b(112) },
  { line: "tS0", from: 0, to: 10, color: C.red, a: b(120.6), z: b(126) },
];

// ---------- syntax colouring (greyscale only: colour is reserved for meaning) -------------------
function tokens(fmt, s) {
  const out = []; // [text, cls]
  const push = (t, c) => { if (t) out.push([t, c]); };
  if (fmt === "json") {
    const m = s.match(/^(\s*)(\/\/.*)$/);
    if (m) { push(m[1], "p"); push(m[2], "c"); return out; }
    const re = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d[\d.eE+-]*)|(true|false|null)|([{}\[\],:])|(\s+)|(.)/g;
    let r;
    while ((r = re.exec(s))) {
      if (r[1]) { push(r[1], r[2] ? "k" : "s"); if (r[2]) push(r[2], "p"); }
      else if (r[3]) push(r[3], "n"); else if (r[4]) push(r[4], "n"); else if (r[5]) push(r[5], "p");
      else push(r[0], "p");
    }
    return out;
  }
  if (/^\s*#/.test(s)) { push(s, "c"); return out; }
  if (/^\s*\[/.test(s)) { push(s, "h"); return out; }
  const kv = s.match(/^(\s*)([A-Za-z0-9_.-]+)(\s*=\s*)?(.*)$/);
  if (!kv) { push(s, "p"); return out; }
  push(kv[1], "p"); push(kv[2], kv[3] ? "k" : "p"); push(kv[3] || "", "p");
  const re = /("(?:[^"\\]|\\.)*")|(\d{4}-\d\d-\d\dT[\d:]+Z?)|(-?\d[\d_]*)|(true|false)|([{}\[\],])|(\s+)|(.)/g;
  let r;
  while ((r = re.exec(kv[4]))) {
    if (r[1]) push(r[1], "s"); else if (r[2]) push(r[2], "d"); else if (r[3]) push(r[3], "n");
    else if (r[4]) push(r[4], "n"); else if (r[5]) push(r[5], "p"); else push(r[0], "p");
  }
  return out;
}

// ---------- build the static scene --------------------------------------------------------------
const hook = el("div", "abs", stage); hook.id = "hook";
const HOOK_WORDS = [["A ", C.ink], ["config ", C.ink], ["file ", C.ink], ["has ", C.ink], ["two ", C.orange], ["readers.", C.orange]];
const hookW = HOOK_WORDS.map(([w, c]) => { const s = el("span", "w", hook, esc(w)); s.style.color = c; return s; });
const hookSub = el("div", "abs", stage); hookSub.id = "hookSub";
const SUB_WORDS = ["The ", "person ", "who ", "writes ", "it, ", "and ", "the ", "program ", "that ", "loads ", "it."];
const hookSubW = SUB_WORDS.map(w => el("span", "w", hookSub, esc(w)));

const caption = el("div", "abs", stage); caption.id = "caption";
const sub = el("div", "abs", stage); sub.id = "sub";

const COLS = {};
for (const fmt of ["json", "toml"]) {
  const x = COLX[fmt];
  const col = el("div", "abs col", stage); col.style.left = x + "px";
  const head = el("div", "abs colhead", col);
  const f = el("div", "fmt", head, fmt.toUpperCase()); f.style.color = fmt === "json" ? C.blue : C.purple;
  el("div", "spec", head, fmt === "json" ? "RFC 8259 · ECMA-404" : "TOML 1.0.0 · 1.1.0");
  const card = el("div", "abs card", col);
  el("div", "tab", card, "<b>" + (fmt === "json" ? "config.json" : "config.toml") + "</b>");
  const pool = [];
  for (let i = 0; i < 14; i++) {
    const ln = el("div", "ln", card);
    const hl = el("div", "hl", ln), no = el("div", "no", ln), tx = el("div", "tx", ln), caret = el("div", "caret", ln);
    pool.push({ ln, hl, no, tx, caret, key: "" });
  }
  const send = el("div", "abs sendbar", col);
  const pills = M[fmt].map((name, i) => {
    const p = el("div", "abs pill", col);
    p.style.left = (i % 2) * 424 + "px"; p.style.top = 684 + Math.floor(i / 2) * 58 + "px";
    const dot = el("div", "dot", p), nm = el("div", "nm", p, esc(name)), vl = el("div", "vl", p);
    return { p, dot, nm, vl, i };
  });
  const tally = el("div", "abs tally", col);
  let bracket = null, bracketLbl = null;
  if (fmt === "toml") { bracket = el("div", "abs bracket", col); bracketLbl = el("div", "abs bracketLbl", col, "[server]"); }
  COLS[fmt] = { col, head, card, pool, send, pills, tally, bracket, bracketLbl, lines: FILES[fmt] };
}

const rulesBox = el("div", "abs", stage); rulesBox.id = "rules";
const RULES = [
  { chip: "JSON", color: C.blue, text: "Keep it strict wherever a program writes it.", t: b(130.5) },
  { chip: "TOML", color: C.purple, text: "Put top-level keys before the first table. Write the 1.0 subset unless every reader is pinned.", t: b(133) },
  { chip: "ANY", color: C.ink, text: "Name the parser and its version, validate against a schema, reject duplicate keys.", t: b(136.5) },
];
const ruleEls = RULES.map((r, i) => {
  const row = el("div", "abs rule", rulesBox); row.style.top = [0, 130, 300][i] + "px";
  const chip = el("div", "chip", row, r.chip); chip.style.border = "2px solid " + r.color; chip.style.color = r.color;
  el("div", "rt", row, esc(r.text));
  return row;
});
const endBox = el("div", "abs", stage); endBox.id = "end";
const endEls = [
  el("div", "t1", endBox, "What the Parser Hears"),
  el("div", "t2", endBox, "A field guide to JSON, YAML and TOML as configuration files"),
  el("div", "t3", endBox, "71 cases · 34 parser configurations · measured October 2026"),
  el("div", "t4", endBox, "XO Research <span>·</span> quirq.ai/what-the-parser-hears"),
  el("div", "t5", endBox, "Every snippet in this video re-measured on 14 October 2026 with the same 20 parsers."),
];

// ---------- captions -----------------------------------------------------------------------------
// segments: [text, colour?]; colour keys r g o b p
const CAPTIONS = [
  { t: b(9), segs: [["The same settings, written twice."]], sub: "config.json and config.toml: a title, and a server with a host and a port." },
  { t: b(15), segs: [["Twenty parsers read them: ten for JSON, ten for TOML."]], sub: "Real libraries at pinned versions, the ones the research measured." },
  { t: b(19), segs: [["All twenty hear the same thing."]], sub: "Every snippet in this video was run through all twenty." },
  { t: b(24), segs: [["Explain the port with a comment."]], sub: "" },
  { t: b(29), segs: [["JSON has no comments: "], ["7 of 10", "r"], [" parsers stop."]], sub: "jsonc-parser and the two json5 parsers read on. All ten TOML parsers skip the # line." },
  { t: b(38), segs: [["Leave a trailing comma."]], sub: "TOML has no commas between keys, so only the JSON file changes." },

const SENDS = [

  { scene: "comment", t: b(28), clear: b(36) },

const DIM = { toml: [[b(38), b(47)]], json: [[b(114), b(127)]] };
const STAGGER = 0.045, FLIP = 0.16;

function pillState(fmt, i, t) {
  // returns {from, to, x} for colour mixing, plus label and pulse
  let cur = { s: "neutral", v: "" }, prev = { s: "neutral", v: "" }, since = -1e9;
  for (const S of SENDS) {
    const st = M.scenes[S.scene][fmt];
    if (!st) continue;
    const on = S.t + 0.24 + i * STAGGER, off = S.clear + i * 0.02;
    if (t >= on) { prev = cur; cur = { s: st[i][0], v: st[i][1] }; since = on; }

// ---------- file layout at time t ---------------------------------------------------------------
function lineState(Lx, t) {

      h = Math.max(h, Math.min(1.02, grow) * (1 - shrink));

      if (lf.ea !== undefined && t >= lf.ea) k = 1 - clamp((t - lf.ea) / Math.max(1e-6, lf.eb - lf.ea));
      n = Math.round(k * Lx.text.length);
      if ((t >= lf.a && t <= lf.b + 0.3) || (lf.ea !== undefined && t >= lf.ea - 0.15 && t <= lf.eb)) active = true;
    }
    void hh;
  }
  let text = Lx.text.slice(0, n), sfx = "";

    if (t < s.a || t > s.eb) continue;
    let k = clamp((t - s.a) / (s.b - s.a));
    if (t >= s.ea) k = 1 - clamp((t - s.ea) / (s.eb - s.ea));
    sfx = s.text.slice(0, Math.round(k * s.text.length));
    if (t <= s.b + 0.3 || t >= s.ea - 0.15) active = true;

}

const LH = 37, TOP = 52;
function renderFile(fmt, t) {
  const S = COLS[fmt];

  const pos = {};
  for (const Lx of S.lines) {

    const slot = S.pool[used++];
    if (st.h > 0.5) num++;
    slot.ln.style.display = "block";
    slot.ln.style.top = y + "px";
    slot.ln.style.opacity = clamp(st.h * 1.4).toFixed(3);
    slot.ln.style.transform = `translateY(${((1 - Math.min(1, st.h)) * -8).toFixed(2)}px)`;
    // edit tint

    for (const E2 of EDITS) if (E2.lines.includes(Lx.id)) tint = Math.max(tint, clamp((t - E2.a) / 0.25) * (1 - clamp((t - E2.z) / 0.3)));

    slot.no.textContent = st.h > 0.5 ? String(num) : "";

      for (let i = 0; i < part.length; i++) {
        const ch = part[i], at = pos2 + i;

        if (mk) {

          const [r, g, bb] = hex(mk.color);
          html += `<span class="${cls}" style="text-decoration:underline wavy rgba(${r},${g},${bb},${a.toFixed(3)});text-decoration-thickness:2px;text-underline-offset:7px">${esc(ch)}</span>`;
        } else html += `<span class="${cls}">${esc(ch)}</span>`;
      }
      pos2 += tx.length;
    }
    slot.tx.innerHTML = html;
    slot.caret.style.display = st.active ? "block" : "none";
    slot.caret.style.left = (70 + st.n * CHW) + "px";
    pos[Lx.id] = { y, h: st.h };
    y += LH * Math.min(1, st.h);
  }

// ---------- seek ----------------------------------------------------------------------------------
let CHW = 15;
function measureChar() {

}

function seek(t) {

  });

    });

      P.p.style.borderColor = mix(A.border, B.border, ps.x);
      P.dot.style.background = mix(A.dot, B.dot, ps.x);

      P.vl.style.color = B.vl;
      P.vl.textContent = ps.cur.v;

}

  return btoa(s);
}

window.DURATION = DURATION;
window.seek = seek;
window.renderAudio = renderAudio;
function fitText() {
  // one line per caption and per sub-caption: shrink the type to fit, never below a readable floor
  for (const c of capEls) {
    c.box.style.display = "block"; c.sb.style.display = "block";
    let fs = 50;
    c.box.style.fontSize = fs + "px";
    const width = () => c.words.reduce((a, w) => a + w.offsetWidth, 0);
    while (width() > 1660 && fs > 40) { fs -= 1; c.box.style.fontSize = fs + "px"; }
    c.fontSize = fs;
    let ss = 25; c.sb.style.whiteSpace = "nowrap"; c.sb.style.fontSize = ss + "px";
    while (c.sb.scrollWidth > 1600 && ss > 20) { ss -= 1; c.sb.style.fontSize = ss + "px"; }
    c.box.style.display = "none"; c.sb.style.display = "none";
  }
}
window.ready = document.fonts.ready.then(() => { measureChar(); fitText(); seek(0); return true; });
</script>
