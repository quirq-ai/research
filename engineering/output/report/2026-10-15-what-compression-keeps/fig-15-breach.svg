                <text class="svg-sub" style="fill: #252525" text-anchor="end" x="620" y="238">771 B</text>
                <text class="svg-step" x="0" y="278">32 right</text>
                <text class="svg-sub" x="72" y="278">csrf_token=<tspan style="fill: #367f59; font-weight: 700">d1caced813ca27e49ef98529634aceab</tspan></text>
                <text class="svg-sub" style="fill: #252525" text-anchor="end" x="476" y="278">711 B</text>
