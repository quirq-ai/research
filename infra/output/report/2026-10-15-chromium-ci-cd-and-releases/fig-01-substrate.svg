<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -34 1100 468" role="img" aria-label="Four horizontal lanes — pre-submit, post-submit, performance, release — crossing five vertical service columns: Gerrit, LUCI CV, Buildbucket, Swarming plus RBE-CAS, and ResultDB plus LUCI Analysis. The performance and release lanes turn red at the Buildbucket column because their builders live in the internal chrome project. A band underneath shows five side-channel services, four of them with appspot hosts bound in main.star."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-34.0" width="1100.0" height="468.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-substrate-arr-blue" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                  <marker id="fig-substrate-arr-grey" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#b8b8b1"></path></marker>
                </defs>

                <text class="svg-lane" x="150" y="-16">GERRIT</text>
