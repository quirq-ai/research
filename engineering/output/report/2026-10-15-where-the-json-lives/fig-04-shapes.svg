<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Four panels show one agent session stored four ways. Key-value: the key session:s42 maps to an opaque blob, cheap to get by id and blind to its contents. Document: a nested object with id, project, status, model and an array of turns, queryable by field. Wide-column: partition key project p7 with rows clustered by started_at, so one read returns a project's sessions in time order. Graph: nodes for user, session, project and file with edges ran, in, and edited, so traversal from a file to the users who touched it is cheap."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="470.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-shapes-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">KEY-VALUE</text>
                <rect fill="#f7f7f5" height="180" rx="8" stroke="#b8b8b1" width="480" x="0" y="30"></rect>
                <rect fill="#e0ebf2" height="40" rx="6" stroke="#3c6f97" width="150" x="16" y="56"></rect>
                <text class="svg-sub" x="28" y="81">session:s42</text>
                <line marker-end="url(#fig-shapes-arr)" stroke="#3c6f97" stroke-width="1.4" x1="166" x2="210" y1="76" y2="76"></line>
                <rect fill="#f7e3c8" height="40" rx="6" stroke="#d98226" width="250" x="214" y="56"></rect>
                <text class="svg-sub" style="white-space:pre" x="226" y="81">0x7b2269…  (2.8 KB)</text>
                <text class="svg-note" x="16" y="138">cheap: GET by exact id, TTL, overwrite</text>
                <text class="svg-note" x="16" y="162">blind: "all running sessions" is a full scan</text>
                <text class="svg-note" x="16" y="186">of every value, done in the application</text>

                <text class="svg-lane" x="520" y="18">DOCUMENT</text>
                <rect fill="#e0ebf2" height="180" rx="8" stroke="#3c6f97" width="480" x="520" y="30"></rect>
                <text class="svg-sub" x="536" y="56">{ "id": "s42", "project": "p7",</text>
                <text class="svg-sub" style="white-space:pre" x="536" y="78">  "status": "running",</text>
                <text class="svg-sub" style="white-space:pre" x="536" y="100">  "model": "…", "turns": [</text>
                <text class="svg-sub" style="white-space:pre" x="536" y="122">    { "role": "user", … }, … ] }</text>
                <text class="svg-note" x="536" y="162">cheap: load the aggregate; filter on fields</text>
                <text class="svg-note" x="536" y="186">awkward: anything shared with another doc</text>

                <text class="svg-lane" x="0" y="248">WIDE-COLUMN</text>
                <rect fill="#ece6f3" height="200" rx="8" stroke="#765b98" width="480" x="0" y="260"></rect>
                <text class="svg-sub" x="16" y="286">partition: project = p7</text>
                <line stroke="#b8b8b1" x1="16" x2="464" y1="296" y2="296"></line>
                <text class="svg-sub" style="white-space:pre" x="16" y="318">started_at ↑   session  status</text>
                <text class="svg-sub" style="white-space:pre" x="16" y="342">09:02:11       s40      done</text>
                <text class="svg-sub" style="white-space:pre" x="16" y="364">09:40:57       s41      done</text>
                <text class="svg-sub" style="white-space:pre" x="16" y="386">10:15:03       s42      running</text>
                <text class="svg-note" x="16" y="422">cheap: one partition, in clustering order</text>
                <text class="svg-note" x="16" y="446">absent: "all running, any project" — new table</text>

                <text class="svg-lane" x="520" y="248">GRAPH</text>
                <rect fill="#dfede5" height="200" rx="8" stroke="#367f59" width="480" x="520" y="260"></rect>
                <circle cx="580" cy="320" fill="#ffffff" r="30" stroke="#367f59" stroke-width="2"></circle>
                <text class="svg-sub" x="562" y="325">user</text>
                <circle cx="730" cy="320" fill="#ffffff" r="30" stroke="#367f59" stroke-width="2"></circle>
                <text class="svg-sub" x="709" y="325">s42</text>
                <circle cx="900" cy="300" fill="#ffffff" r="34" stroke="#367f59" stroke-width="2"></circle>
                <text class="svg-sub" x="875" y="305">proj</text>
                <circle cx="900" cy="400" fill="#ffffff" r="30" stroke="#367f59" stroke-width="2"></circle>
                <text class="svg-sub" x="879" y="405">file</text>
                <line marker-end="url(#fig-shapes-arr)" stroke="#3c6f97" stroke-width="1.4" x1="610" x2="696" y1="320" y2="320"></line>
                <text class="svg-sub" x="630" y="310">ran</text>
                <line marker-end="url(#fig-shapes-arr)" stroke="#3c6f97" stroke-width="1.4" x1="760" x2="862" y1="316" y2="304"></line>
                <text class="svg-sub" x="800" y="298">in</text>
                <line marker-end="url(#fig-shapes-arr)" stroke="#3c6f97" stroke-width="1.4" x1="756" x2="872" y1="336" y2="390"></line>
                <text class="svg-sub" x="782" y="380">edited</text>
                <text class="svg-note" x="536" y="422">cheap: file → sessions → users,</text>
                <text class="svg-note" x="536" y="446">any number of hops</text>
              </svg>
