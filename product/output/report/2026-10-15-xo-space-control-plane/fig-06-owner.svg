<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Flowchart for resolving which adapter owns a session"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="340.0" fill="#ffffff"/>
              <rect fill="#f7f7f5" height="52" rx="7" stroke="#deded9" width="230" x="30" y="24"></rect>
              <text class="svg-step" x="44" y="46">find_session_backend(sid)</text>
              <text class="svg-sub" x="44" y="64">called on every prompt with a session</text>

              <line stroke="#b8b8b1" x1="145" x2="145" y1="76" y2="104"></line>
              <rect fill="#e0ebf2" height="70" rx="7" stroke="#3c6f97" width="230" x="30" y="104"></rect>
              <text class="svg-step" x="44" y="126">Scan every project</text>
              <text class="svg-sub" x="44" y="145">~/xo-projects/*/.xo/sessions/</text>
              <text class="svg-sub" x="44" y="160">sessionslist.json — match sessionId</text>

              <line stroke="#b8b8b1" x1="260" x2="330" y1="139" y2="139"></line>
              <text class="svg-sub" x="272" y="132">hit</text>
              <rect fill="#dfede5" height="70" rx="7" stroke="#367f59" width="220" x="330" y="104"></rect>
              <text class="svg-step" x="344" y="126">Read the backend tag</text>
              <text class="svg-sub" x="344" y="145">the entry says which runtime wrote</text>
              <text class="svg-sub" x="344" y="160">it. No probing, no guessing. Done.</text>

              <line stroke="#b8b8b1" x1="145" x2="145" y1="174" y2="204"></line>
              <text class="svg-sub" x="156" y="194">miss</text>
              <rect fill="#ece6f3" height="70" rx="7" stroke="#765b98" width="230" x="30" y="204"></rect>
              <text class="svg-step" x="44" y="226">Ask every adapter</text>
              <text class="svg-sub" x="44" y="245">list_adapters() → each one's</text>
              <text class="svg-sub" x="44" y="260">sessions.owns_session(sid)</text>

              <line stroke="#b8b8b1" x1="260" x2="330" y1="239" y2="239"></line>
              <rect fill="#f7f7f5" height="70" rx="7" stroke="#deded9" width="220" x="330" y="204"></rect>
              <text class="svg-step" x="344" y="226">First claim wins</text>
              <text class="svg-sub" x="344" y="245">each backend searches only its own</text>
              <text class="svg-sub" x="344" y="260">store; none returns ⇒ AGENT_NAME</text>

              <line stroke="#deded9" x1="600" x2="600" y1="30" y2="300"></line>
              <text class="svg-lane" x="630" y="44">THE SAME SHAPE, THREE TIMES</text>
              <text class="svg-step" x="630" y="76">find_session_backend</text>
              <text class="svg-sub" x="630" y="94">→ who owns it</text>
              <text class="svg-step" x="630" y="122">find_session_file</text>
              <text class="svg-sub" x="630" y="140">→ resolve_native_file on the owner</text>
              <text class="svg-step" x="630" y="168">load_all_sessions</text>
              <text class="svg-sub" x="630" y="186">→ project scan (only if the active</text>
              <text class="svg-sub" x="630" y="201">backend sets USES_PROJECT_SESSIONS)</text>
              <text class="svg-sub" x="630" y="216">+ list_native_sessions, de-duplicated</text>
              <text class="svg-sub" x="630" y="231">by id — project-tied wins</text>
              <line stroke="#deded9" x1="630" x2="970" y1="252" y2="252"></line>
              <text class="svg-note" x="630" y="274">Listing is filtered to the active backend on purpose:</text>
              <text class="svg-note" x="630" y="292">the other runtimes' stores are never opened, so their</text>
              <text class="svg-note" x="630" y="310">sessions cannot leak into the sidebar.</text>
            </svg>
