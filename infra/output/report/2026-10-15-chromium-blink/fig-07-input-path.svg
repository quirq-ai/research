<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 980 404" role="img" aria-label="Three horizontal lanes. Browser main thread: RenderWidgetHostImpl forward methods into InputRouterImpl, which calls WidgetInputHandler DispatchEvent. Renderer compositor thread: WidgetInputHandlerImpl, then InputHandlerProxy and cc InputHandler. Renderer main thread: MainThreadEventQueue, then EventHandler and DOM dispatch. A blue ack path returns along the bottom to the browser."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-18.0" width="980.0" height="404.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-input-path-arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="fig-input-path-arr-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                  <marker id="fig-input-path-arr-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
                </defs>

                <line stroke="#deded9" x1="0" x2="980" y1="106" y2="106"></line>
                <line stroke="#deded9" x1="0" x2="980" y1="210" y2="210"></line>

                <text class="svg-lane" x="16" y="14">BROWSER · MAIN THREAD</text>
                <text class="svg-lane" x="16" y="118">RENDERER · COMPOSITOR THREAD</text>
                <text class="svg-lane" x="16" y="222">RENDERER · MAIN THREAD</text>

                <rect fill="#ffffff" height="64" rx="8" stroke="#252525" width="240" x="16" y="24"></rect>
                <text class="svg-step" x="30" y="50">RenderWidgetHostImpl</text>
                <text class="svg-sub" x="30" y="70">Forward{Mouse,Wheel,Key,Gesture}</text>
                <rect fill="#ffffff" height="64" rx="8" stroke="#252525" width="240" x="286" y="24"></rect>
                <text class="svg-step" x="300" y="50">InputRouterImpl</text>
                <text class="svg-sub" x="300" y="70">queues + TouchActionFilter</text>

                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" width="180" x="556" y="128"></rect>
                <text class="svg-step" x="570" y="154">WidgetInputHandlerImpl</text>
                <text class="svg-sub" x="570" y="174">bound here to keep order</text>
                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" width="190" x="756" y="128"></rect>
                <text class="svg-step" x="770" y="154">InputHandlerProxy → cc</text>
                <text class="svg-sub" x="770" y="174">latches · 6 dispositions</text>

                <rect fill="#dfede5" height="64" rx="8" stroke="#367f59" width="180" x="556" y="232"></rect>
                <text class="svg-step" x="570" y="258">MainThreadEventQueue</text>
                <text class="svg-sub" x="570" y="278">rAF-aligned or not</text>
                <rect fill="#dfede5" height="64" rx="8" stroke="#367f59" width="190" x="756" y="232"></rect>
                <text class="svg-step" x="770" y="258">EventHandler → DOM</text>
                <text class="svg-sub" x="770" y="278">EventPath → listeners</text>

                <line marker-end="url(#fig-input-path-arr-ink)" stroke="#252525" stroke-width="2.5" x1="256" x2="286" y1="56" y2="56"></line>
                <path d="M526 60 C560 60 540 138 556 150" fill="none" marker-end="url(#fig-input-path-arr-ink)" stroke="#252525" stroke-width="2.5"></path>
                <text class="svg-note" x="534" y="104">WidgetInputHandler::DispatchEvent</text>
                <line marker-end="url(#fig-input-path-arr-ink)" stroke="#252525" stroke-width="2.5" x1="736" x2="756" y1="160" y2="160"></line>
                <line marker-end="url(#fig-input-path-arr-ink)" stroke="#252525" stroke-width="2.5" x1="646" x2="646" y1="192" y2="232"></line>
                <text class="svg-note" x="656" y="216">DID_NOT_HANDLE</text>
                <line marker-end="url(#fig-input-path-arr-ink)" stroke="#252525" stroke-width="2.5" x1="736" x2="756" y1="264" y2="264"></line>

                <line marker-end="url(#fig-input-path-arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="520" x2="520" y1="250" y2="172"></line>
                <text class="svg-note" text-anchor="end" x="508" y="206">4 listener classes × 4 properties</text>

                <path d="M946 160 L966 160 L966 356 L40 356 L40 92" fill="none" marker-end="url(#fig-input-path-arr-blue)" stroke="#3c6f97" stroke-width="1.5"></path>
                <line stroke="#3c6f97" stroke-width="1.5" x1="946" x2="966" y1="264" y2="264"></line>
                <text class="svg-note" text-anchor="middle" x="500" y="348">ack: DispatchEventResult (4) → WebInputEventResult (4) → InputEventResultState (7)</text>

                <text class="svg-note" x="56" y="316">mousedown · mousemove · mouseleave: always kHandledSystem</text>
                <text class="svg-note" x="56" y="332">click from pointerup: result discarded, never merged</text>

                <text class="svg-note" text-anchor="middle" x="490" y="378">thick black = the event travelling · thin blue = the ack returning · dashed purple = state Blink pushes to cc</text>
              </svg>
