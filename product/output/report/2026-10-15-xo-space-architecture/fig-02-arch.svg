              <text fill="#252525" font-size="11.5" text-anchor="middle" x="150" y="514">native logs — the devices</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="150" y="534">~/.claude · ~/.codex · ~/.pi …</text>
              <rect fill="#e0ebf2" height="86" rx="10" stroke="#3c6f97" width="300" x="300" y="484"></rect>
              <text fill="#252525" font-size="11.5" text-anchor="middle" x="450" y="514">the filesystem — projects root</text>
              <text fill="#3c6f97" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="450" y="534">units one deep · .xo proc entries · kernel tables</text>
              <rect fill="#fff8ea" height="86" rx="10" stroke="#d98226" width="240" x="620" y="484"></rect>
              <text fill="#252525" font-size="11.5" text-anchor="middle" x="740" y="514">machine state — .quirq/</text>
              <text fill="#d98226" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="740" y="534">/etc + /var · cursors · locks</text>
