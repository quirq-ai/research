<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 604" role="img" aria-label="Bar chart on a logarithmic axis showing how many strings each level of the 446-byte CVE-2019-11253 alias bomb names: level a 9, b 81, c 729, d 6,561, e 59,049, f 531,441, g 4,782,969, h 43,046,721, i 387,420,489. The whole document expands to 435,848,053 leaves. Green callouts mark where loaders refuse it: eemeli's yaml 2.9.1 (maxAliasCount 100), yaml.v3 and sigs.k8s.io/yaml (alias-ratio check) on level d; serde-saphyr (max_nodes 250,000) and serde_yaml (alias jumps above 100 times the event count) on level f. An orange panel lists the loaders that return shared references in under 10 milliseconds each: PyYAML 6.0.3 pure and C, ruamel 0.19.1 safe and round-trip, js-yaml 4.3.2 and 5.4.3, goccy/go-yaml v1.19.2. A red panel shows the six-level, 335-byte version serialised: 4,334,696 bytes from Python json.dumps, 12,939 times the input, and 3,736,811 bytes from JavaScript and Go."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="604.0" fill="#ffffff"/>
