<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="A forward chain from x zero to x T adding Gaussian noise, labelled fixed and requiring no learning, running left to right. Beneath it a reverse chain from x T back to x zero labelled learned. A note says the forward chain has a closed form for any step and that shortening the reverse chain is what distillation and consistency models do."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="250.0" fill="#ffffff"/>
                <defs>
                  <marker id="dif-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#ad4b43"></path></marker>
                  <marker id="dif-arr-b" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">FORWARD q(xₜ | x₍ₜ₋₁₎) · FIXED, NO PARAMETERS</text>
                <rect fill="#dfede5" height="48" rx="8" stroke="#367f59" width="120" x="20" y="36"></rect><text class="svg-step" text-anchor="middle" x="80" y="66">x₀ · data</text>
                <rect fill="#e6efe9" height="48" rx="8" stroke="#8fb5a0" width="120" x="240" y="36"></rect><text class="svg-step" text-anchor="middle" x="300" y="66">x₁</text>
                <rect fill="#f0f0ee" height="48" rx="8" stroke="#b8b8b1" width="120" x="460" y="36"></rect><text class="svg-step" text-anchor="middle" x="520" y="66">x₂ …</text>
                <rect fill="#f7f7f5" height="48" rx="8" stroke="#b8b8b1" stroke-dasharray="4 3" width="140" x="680" y="36"></rect><text class="svg-step" text-anchor="middle" x="750" y="66">x_T · noise</text>
                <line marker-end="url(#dif-arr)" stroke="#ad4b43" stroke-width="2" x1="140" x2="232" y1="60" y2="60"></line>
                <line marker-end="url(#dif-arr)" stroke="#ad4b43" stroke-width="2" x1="360" x2="452" y1="60" y2="60"></line>
                <line marker-end="url(#dif-arr)" stroke="#ad4b43" stroke-width="2" x1="580" x2="672" y1="60" y2="60"></line>
                <text class="svg-note" x="840" y="52">T = 1000 in the</text>
                <text class="svg-note" x="840" y="72">original DDPM.</text>

                <text class="svg-lane" x="0" y="132">REVERSE p₍θ₎(x₍ₜ₋₁₎ | xₜ) · LEARNED</text>
                <line marker-end="url(#dif-arr-b)" stroke="#3c6f97" stroke-width="2.4" x1="672" x2="580" y1="160" y2="160"></line>
                <line marker-end="url(#dif-arr-b)" stroke="#3c6f97" stroke-width="2.4" x1="452" x2="360" y1="160" y2="160"></line>
                <line marker-end="url(#dif-arr-b)" stroke="#3c6f97" stroke-width="2.4" x1="232" x2="140" y1="160" y2="160"></line>
                <text class="svg-sub" x="150" y="150">sample</text>
                <text class="svg-sub" x="370" y="150">denoise</text>
                <text class="svg-sub" x="590" y="150">denoise</text>
                <path d="M700 176 C 520 226 300 226 150 180" fill="none" marker-end="url(#dif-arr-b)" stroke="#d98226" stroke-dasharray="6 4" stroke-width="2"></path>
                <text class="svg-sub" style="fill:#d98226" x="330" y="222">distillation: the same endpoints, far fewer steps</text>
                <text class="svg-note" x="0" y="246">Because q has a closed form at every t, training samples a single random step instead of simulating the chain.</text>
              </svg>
