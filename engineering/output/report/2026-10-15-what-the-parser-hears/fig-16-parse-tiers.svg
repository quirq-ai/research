<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-label="Range chart on a logarithmic axis from 10 microseconds to 100 milliseconds: the time to parse one copy of the same agent configuration, for 30 parser configurations grouped by format, each with its median as a dot and its 10th to 90th percentile as a bar, from 501 timed parses after 50 warm-ups on one contended 2-CPU machine where medians moved by up to 2.7 times between runs; medians below are rounded to one significant figure. JSON family, about 10 microseconds to 20 milliseconds: serde_json, serde_json with arbitrary precision and JSON.parse about 10 µs; Python json and Go encoding/json/v2 about 20 µs; Go encoding/json about 50 µs; jsonc-parser about 0.1 ms; Node json5 about 0.4 ms; Python json5 about 20 ms. TOML, about 30 microseconds to 4 milliseconds: go-toml/v2 about 30 µs; Rust toml about 40 µs; toml_edit about 60 µs; smol-toml about 90 µs; tomli, @iarna/toml and BurntSushi/toml about 0.2 ms; tomllib on Python 3.14 about 0.4 ms; tomlkit about 4 ms. YAML, about 0.1 to 10 milliseconds: serde_yaml about 0.1 ms; serde-saphyr, js-yaml 4, js-yaml 5 and yaml.v3 about 0.2 ms; sigs.k8s.io/yaml about 0.3 ms; goccy/go-yaml about 0.4 ms; PyYAML CSafeLoader about 0.5 ms; yaml (eemeli) about 2 ms; PyYAML safe_load about 5 ms; ruamel safe about 8 ms; ruamel round-trip about 10 ms. In 26 of the 30 bars the 90th percentile is within 2 times the median; for tomlkit, PyYAML safe_load and ruamel's two loaders it is 3 to 5 times."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
