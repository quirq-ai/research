<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="Two lanes. Top lane, compression: the data, all N bytes, flows through a model that predicts symbols and an entropy coder that codes the surprise, giving fewer bits that are stored or sent; a decoder running the same model gives back either the same bytes (lossless, kept exactly) or a close copy (lossy, kept approximately). It keeps all the information if lossless, or what a person will notice if lossy; the only thing it cannot undo is the detail a lossy coder discarded. Bottom lane, compaction: a log of six records at offsets 0 to 5 (put K1 = 40, put K2 = 12, put K1 = 38, put K3 = 7, a tombstone deleting K2, put K1 = 45) is merged, keeping the last value per key and dropping tombstones past their grace period. The live state is K1 = 45 and K3 = 7, kept exactly. A dashed purple edge sends the three superseded versions and the K2 tombstone to a box marked gone for good; the history from offset 0 to 5 can no longer be replayed."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="470.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-two-pipelines-blu" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                  <marker id="fig-two-pipelines-pur" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
                </defs>

                <text class="svg-lane" x="0" y="16">COMPRESSION · THE SAME INFORMATION IN FEWER BITS</text>
                <rect fill="#f7f7f5" height="64" rx="6" stroke="#b8b8b1" width="148" x="0" y="30"></rect>
                <text class="svg-step" x="12" y="52">The data</text>
                <text class="svg-sub" x="12" y="76">all N bytes</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="148" x2="175" y1="62" y2="62"></line>
                <rect fill="#f7f7f5" height="64" rx="6" stroke="#b8b8b1" width="148" x="180" y="30"></rect>
                <text class="svg-step" x="192" y="52">Model</text>
                <text class="svg-sub" x="192" y="76">predicts symbols</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="328" x2="355" y1="62" y2="62"></line>
                <rect fill="#f7f7f5" height="64" rx="6" stroke="#b8b8b1" width="148" x="360" y="30"></rect>
                <text class="svg-step" x="372" y="52">Entropy coder</text>
                <text class="svg-sub" x="372" y="76">codes surprise</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="508" x2="535" y1="62" y2="62"></line>
                <rect fill="#f7f7f5" height="64" rx="6" stroke="#b8b8b1" width="148" x="540" y="30"></rect>
                <text class="svg-step" x="552" y="52">Fewer bits</text>
                <text class="svg-sub" x="552" y="76">stored or sent</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="688" x2="715" y1="62" y2="62"></line>
                <rect fill="#f7f7f5" height="64" rx="6" stroke="#b8b8b1" width="148" x="720" y="30"></rect>
                <text class="svg-step" x="732" y="52">Decoder</text>
                <text class="svg-sub" x="732" y="76">same model again</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="868" x2="895" y1="62" y2="62"></line>
                <rect fill="#f7f7f5" height="64" rx="6" stroke="#b8b8b1" width="219" x="900" y="30"></rect>
                <rect fill="#dfede5" height="20" rx="10" stroke="#367f59" width="200" x="910" y="38"></rect>
                <text class="svg-sub" x="922" y="52">lossless: same bytes</text>
                <rect fill="#f7e3c8" height="20" rx="10" stroke="#d98226" width="200" x="910" y="66"></rect>
                <text class="svg-sub" x="922" y="80">lossy: a close copy</text>
                <text class="svg-lane" x="0" y="122">KEEPS</text>
                <text class="svg-note" x="120" y="122">all the information (lossless), or what a person will notice (lossy)</text>
                <text class="svg-lane" x="0" y="142">CANNOT UNDO</text>
                <text class="svg-note" x="120" y="142">nothing (lossless); the discarded detail (lossy)</text>

                <line stroke="#deded9" x1="0" x2="1120" y1="160" y2="160"></line>

                <text class="svg-lane" x="0" y="186">COMPACTION · ONLY THE PRESENT, REWRITTEN DENSELY</text>
                <rect fill="#f7f7f5" height="168" rx="6" stroke="#b8b8b1" width="260" x="0" y="200"></rect>
                <text class="svg-step" x="12" y="222">A log of versions</text>
                <rect fill="#ece6f3" height="18" rx="3" width="236" x="12" y="232"></rect>
                <text class="svg-sub" x="20" y="245">0 · put K1 = 40</text>
                <rect fill="#ece6f3" height="18" rx="3" width="236" x="12" y="254"></rect>
                <text class="svg-sub" x="20" y="267">1 · put K2 = 12</text>
                <rect fill="#ece6f3" height="18" rx="3" width="236" x="12" y="276"></rect>
                <text class="svg-sub" x="20" y="289">2 · put K1 = 38</text>
                <rect fill="#dfede5" height="18" rx="3" width="236" x="12" y="298"></rect>
                <text class="svg-sub" x="20" y="311">3 · put K3 = 7</text>
                <rect fill="#ece6f3" height="18" rx="3" width="236" x="12" y="320"></rect>
                <text class="svg-sub" x="20" y="333">4 · del K2 (tombstone)</text>
                <rect fill="#dfede5" height="18" rx="3" width="236" x="12" y="342"></rect>
                <text class="svg-sub" x="20" y="355">5 · put K1 = 45</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="260" x2="307" y1="296" y2="296"></line>
                <rect fill="#f7f7f5" height="68" rx="6" stroke="#b8b8b1" width="200" x="312" y="262"></rect>
                <text class="svg-step" x="324" y="285">Merge</text>
                <text class="svg-sub" x="324" y="304">keep last value per key</text>
                <text class="svg-sub" x="324" y="321">drop expired tombstones</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="512" x2="549" y1="296" y2="296"></line>
                <rect fill="#f7f7f5" height="100" rx="6" stroke="#b8b8b1" width="200" x="554" y="246"></rect>
                <text class="svg-step" x="566" y="272">Live state</text>
                <rect fill="#dfede5" height="20" rx="10" stroke="#367f59" width="84" x="566" y="282"></rect>
                <text class="svg-sub" x="576" y="296">K1 = 45</text>
                <rect fill="#dfede5" height="20" rx="10" stroke="#367f59" width="76" x="658" y="282"></rect>
                <text class="svg-sub" x="668" y="296">K3 = 7</text>
                <text class="svg-note" x="566" y="328">K2 deleted: no entry</text>
                <path d="M412 262 V222 H795" fill="none" marker-end="url(#fig-two-pipelines-pur)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.6"></path>
                <text class="svg-note" x="566" y="214">history dropped</text>
                <rect fill="#ece6f3" height="146" rx="6" stroke="#765b98" stroke-dasharray="5 4" width="319" x="800" y="200"></rect>
                <text class="svg-step" x="812" y="222">Gone for good</text>
                <text class="svg-sub" x="812" y="245">K1 = 40, K1 = 38, K2 = 12</text>
                <text class="svg-note" x="812" y="267">superseded versions</text>
                <text class="svg-sub" x="812" y="289">K2 tombstone</text>
                <text class="svg-note" x="812" y="311">dropped after its grace period</text>
                <text class="svg-note" x="812" y="333">history 0–5 cannot be replayed</text>
                <text class="svg-lane" x="0" y="392">KEEPS</text>
                <text class="svg-note" x="120" y="392">the latest value of every live key</text>
                <text class="svg-lane" x="0" y="412">CANNOT UNDO</text>
                <text class="svg-note" x="120" y="412">superseded versions and expired tombstones</text>

                <line stroke="#deded9" x1="0" x2="1120" y1="430" y2="430"></line>
                <rect fill="#dfede5" height="14" rx="3" stroke="#367f59" width="14" x="0" y="442"></rect>
                <text class="svg-sub" x="22" y="453">kept exactly</text>
                <rect fill="#f7e3c8" height="14" rx="3" stroke="#d98226" width="14" x="150" y="442"></rect>
                <text class="svg-sub" x="172" y="453">kept approximately</text>
                <rect fill="#ece6f3" height="14" rx="3" stroke="#765b98" width="14" x="330" y="442"></rect>
                <text class="svg-sub" x="352" y="453">dropped for good</text>
                <line marker-end="url(#fig-two-pipelines-blu)" stroke="#3c6f97" stroke-width="1.4" x1="500" x2="530" y1="449" y2="449"></line>
                <text class="svg-sub" x="540" y="453">data</text>
                <path d="M600 449 H630" fill="none" marker-end="url(#fig-two-pipelines-pur)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.6"></path>
                <text class="svg-sub" x="640" y="453">state discarded</text>
              </svg>
