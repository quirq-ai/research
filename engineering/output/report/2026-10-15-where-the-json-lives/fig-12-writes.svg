<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="Horizontal bar chart on a logarithmic axis from 1 microsecond to 10 milliseconds, cost per update for fourteen ways of keeping a 2,879-byte JSON document current, measured over 1,500 updates each. Values in microseconds per operation: file tmp + fsync + os.replace 1,464.5; JSONL append, fsync each line 1,153.9; SQLite FULL whole-doc UPDATE 991.0; SQLite FULL jsonb_set 417.6; SQLite FULL event INSERT 412.0; SQLite FULL json_set (text) 411.1; file tmp + os.replace, no fsync 241.3; SQLite NORMAL whole-doc UPDATE 34.1; SQLite NORMAL json_set (text) 21.3; SQLite NORMAL event INSERT 17.6; JSONL append, fsync every 100 14.0; SQLite NORMAL jsonb_set 10.8; SQLite FULL 100 INSERTs per txn 8.4; SQLite NORMAL 100 INSERTs per txn 3.6. Bars that fsync on every commit cluster between 411 and 1,465 microseconds; batched or non-fsyncing variants fall between 3.6 and 241 microseconds."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="600.0" fill="#ffffff"/>
                <text class="svg-lane" x="0" y="18">MICROSECONDS PER UPDATE · LOG SCALE · 1,500 UPDATES EACH · 2,879-BYTE DOCUMENT</text>
                <rect fill="#e0ebf2" height="14" rx="3" stroke="#3c6f97" width="14" x="0" y="38"></rect>
                <text class="svg-sub" x="22" y="50">fsync on every commit</text>
                <rect fill="#dfede5" height="14" rx="3" stroke="#367f59" width="14" x="209" y="38"></rect>
                <text class="svg-sub" x="231" y="50">one fsync per 100 writes</text>
                <rect fill="#f7e3c8" height="14" rx="3" stroke="#d98226" width="14" x="439" y="38"></rect>
                <text class="svg-sub" x="461" y="50">no fsync at commit</text>
                <line stroke="#deded9" x1="360" x2="360" y1="78" y2="484"></line>
                <text class="svg-sub" text-anchor="middle" x="360" y="502">1 µs</text>
                <line stroke="#deded9" x1="530" x2="530" y1="78" y2="484"></line>
                <text class="svg-sub" text-anchor="middle" x="530" y="502">10 µs</text>
                <line stroke="#deded9" x1="700" x2="700" y1="78" y2="484"></line>
                <text class="svg-sub" text-anchor="middle" x="700" y="502">100 µs</text>
                <line stroke="#deded9" x1="870" x2="870" y1="78" y2="484"></line>
                <text class="svg-sub" text-anchor="middle" x="870" y="502">1 ms</text>
                <line stroke="#deded9" x1="1040" x2="1040" y1="78" y2="484"></line>
                <text class="svg-sub" text-anchor="middle" x="1040" y="502">10 ms</text>
                <line stroke="#b8b8b1" x1="360" x2="1040" y1="484" y2="484"></line>
                <text class="svg-sub" text-anchor="end" x="348" y="104">file · tmp + fsync + os.replace</text>
                <rect fill="#e0ebf2" height="16" rx="2" stroke="#3c6f97" width="538.2" x="360" y="92"></rect>
                <text class="svg-sub" x="906.2" y="104">1,464.5 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="132">JSONL · append, fsync each line</text>
                <rect fill="#e0ebf2" height="16" rx="2" stroke="#3c6f97" width="520.6" x="360" y="120"></rect>
                <text class="svg-sub" x="888.6" y="132">1,153.9 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="160">SQLite FULL · whole-doc UPDATE</text>
                <rect fill="#e0ebf2" height="16" rx="2" stroke="#3c6f97" width="509.3" x="360" y="148"></rect>
                <text class="svg-sub" x="877.3" y="160">991.0 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="188">SQLite FULL · jsonb_set</text>
                <rect fill="#e0ebf2" height="16" rx="2" stroke="#3c6f97" width="445.5" x="360" y="176"></rect>
                <text class="svg-sub" x="813.5" y="188">417.6 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="216">SQLite FULL · event INSERT</text>
                <rect fill="#e0ebf2" height="16" rx="2" stroke="#3c6f97" width="444.5" x="360" y="204"></rect>
                <text class="svg-sub" x="812.5" y="216">412.0 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="244">SQLite FULL · json_set (text)</text>
                <rect fill="#e0ebf2" height="16" rx="2" stroke="#3c6f97" width="444.4" x="360" y="232"></rect>
                <text class="svg-sub" x="812.4" y="244">411.1 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="272">file · tmp + os.replace, no fsync</text>
                <rect fill="#f7e3c8" height="16" rx="2" stroke="#d98226" width="405.0" x="360" y="260"></rect>
                <text class="svg-sub" x="773.0" y="272">241.3 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="300">SQLite NORMAL · whole-doc UPDATE</text>
                <rect fill="#f7e3c8" height="16" rx="2" stroke="#d98226" width="260.6" x="360" y="288"></rect>
                <text class="svg-sub" x="628.6" y="300">34.1 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="328">SQLite NORMAL · json_set (text)</text>
                <rect fill="#f7e3c8" height="16" rx="2" stroke="#d98226" width="225.8" x="360" y="316"></rect>
                <text class="svg-sub" x="593.8" y="328">21.3 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="356">SQLite NORMAL · event INSERT</text>
                <rect fill="#f7e3c8" height="16" rx="2" stroke="#d98226" width="211.7" x="360" y="344"></rect>
                <text class="svg-sub" x="579.7" y="356">17.6 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="384">JSONL · append, fsync every 100</text>
                <rect fill="#dfede5" height="16" rx="2" stroke="#367f59" width="194.8" x="360" y="372"></rect>
                <text class="svg-sub" x="562.8" y="384">14.0 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="412">SQLite NORMAL · jsonb_set</text>
                <rect fill="#f7e3c8" height="16" rx="2" stroke="#d98226" width="175.7" x="360" y="400"></rect>
                <text class="svg-sub" x="543.7" y="412">10.8 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="440">SQLite FULL · 100 INSERTs per txn</text>
                <rect fill="#dfede5" height="16" rx="2" stroke="#367f59" width="157.1" x="360" y="428"></rect>
                <text class="svg-sub" x="525.1" y="440">8.4 µs</text>
                <text class="svg-sub" text-anchor="end" x="348" y="468">SQLite NORMAL · 100 INSERTs per txn</text>
                <rect fill="#f7e3c8" height="16" rx="2" stroke="#d98226" width="94.6" x="360" y="456"></rect>
                <text class="svg-sub" x="462.6" y="468">3.6 µs</text>
                <text class="svg-note" x="0" y="532">A single durable commit costs 0.4–1.5 ms here, whatever the format. Sharing one fsync across 100 writes</text>
                <text class="svg-note" x="0" y="552">cuts SQLite FULL from 412.0 to 8.4 µs per row (49×) and JSONL from 1,153.9 to 14.0 µs per line (82×).</text>
              </svg>
