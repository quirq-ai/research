<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 494" role="img" aria-label="Three panels side by side. Panel a, a prefetched static target, /sec0/a/1 to /sec0/a/2: the click makes zero requests, the server is not contacted, the root, sec0 and a CacheNodes are reused and the [id] and page nodes are new from the client cache; html and section DOM nodes are kept; 0 bytes, 50 ms wall. Panel b, an unprefetched prerendered target, the same pair with prefetch aborted: one GET with rsc, state tree and next-url headers; the handler strips the Flight headers and serves the cached 2.rsc whole; every node is sent in full, yet the client reuses the root, sec0 and a nodes and keeps the html and section nodes; 5,866 bytes decoded, 1,619 on the wire, the same with or without a state tree. Panel c, a dynamic target, /sec0/a/2 to /dyn: walkTreeWithFlightRouterState finds the root unchanged and sends it as a skipped node with r null, then renders dyn and its page; the client reuses the root, adds dyn and the page, and removes the sec0 subtree and its section DOM node; 2,602 bytes against 4,433 without a state tree, a 41 percent saving."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="494.0" fill="#ffffff"/>
