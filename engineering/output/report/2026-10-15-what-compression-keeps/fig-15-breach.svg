                <text class="svg-sub" style="fill: #252525" text-anchor="end" x="620" y="278">757 B</text>
                <text class="svg-note" x="0" y="314">green: characters that match the secret · black: filler that is never hex, so every reflected input is 43 bytes</text>
                <text class="svg-note" x="0" y="334">DEFLATE is raw, level 6; a gzip body adds a constant 18 bytes</text>
                <text class="svg-step" x="0" y="358">One character at a time, 16 candidates per position</text>
                <text class="svg-sub" x="0" y="376">right one uniquely shortest / tied / beaten, of 32:</text>
                <text class="svg-sub" style="fill: #252525" x="0" y="394">DEFLATE 13 / 19 / 0 · brotli 10 / 18 / 4 · zstd 10 / 17 / 5</text>
                <text class="svg-lane" x="690" y="166">BYTES SAVED VS THE 0-RIGHT GUESS</text>
