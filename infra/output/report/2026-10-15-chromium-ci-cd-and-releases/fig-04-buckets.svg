<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 1020 574" role="img" aria-label="A tree map of the eighteen Buildbucket buckets. The ci bucket with 641 builders and the try bucket with 500 fill the top row at proportional widths, each subdivided into horizontal bands for its largest builder groups with a hatched remainder band. Below, ten equal tiles carry the small buckets with their builder counts and a one-line role each. A strip of six hairlines at the bottom stands for the six empty shadow buckets."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }</style><rect x="0.0" y="-24.0" width="1020.0" height="574.0" fill="#ffffff"/>
