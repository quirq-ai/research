<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-label="Grouped bar chart of compression ratio, original bytes divided by compressed bytes, for 10,000 held-out synthetic agent-event messages in five size buckets, linear axis from 0 to 6 with a dashed break-even line at 1, no compression, below which the output is larger than the input. Bars per bucket: gzip -6 on each message alone, zstd 3 on each message alone, zstd 3 with a 110 KiB trained dictionary on each message alone, and zstd 3 on frames of 100 messages of that bucket. 100 to 199 bytes, 1,409 messages: 0.98, 1.05, 2.71, 5.53; gzip -6 made 1,216 of them bigger. 200 to 499 bytes, 2,862 messages: 1.30, 1.32, 3.17, 3.96. 500 to 999 bytes, 1,889 messages: 1.69, 1.65, 3.16, 3.35. 1,000 to 1,999 bytes, 1,856 messages: 2.00, 1.96, 3.20, 3.26. 2,000 to 4,096 bytes, 1,984 messages: 2.36, 2.35, 3.25, 3.32."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }</style><rect x="0.0" y="0.0" width="1120.0" height="450.0" fill="#ffffff"/>
                <text class="svg-lane" x="0" y="16">RATIO, ORIGINAL ÷ COMPRESSED · 10,000 HELD-OUT MESSAGES BY SIZE</text>
                <rect fill="#e0ebf2" height="14" rx="3" stroke="#3c6f97" width="14" x="0" y="34"></rect>
