<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-label="Five phases left to right, joined by thick black sequence arrows. Phase 1, interface over files: reads and writes go to files and the change is only code. Phase 2, dual-write with the database as a shadow: reads from files, writes to files and the database, database errors only logged. Phase 3, backfill and compare: old files are loaded into the database and a nightly diff must reach zero. Phase 4, read from the database: files are still written, now as a projection. Phase 5, stop writing files: the database is the record and a read-only JSON export remains for humans. Underneath, a source-of-truth bar is orange for files across phases 1 to 3 and blue for the database across phases 4 and 5. Each phase has a red rollback box naming how to undo it."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }</style><rect x="0.0" y="0.0" width="1120.0" height="420.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-migration-ink" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">PHASES · EACH SHIPS BEHIND A FLAG</text>

                <rect fill="#f7f7f5" height="200" rx="8" stroke="#b8b8b1" width="200" x="0" y="32"></rect>
                <text class="svg-num" x="14" y="56">1</text>
                <text class="svg-step" x="30" y="56">Interface over files</text>
                <text class="svg-sub" style="white-space:pre" x="14" y="88">reads:  files</text>
                <text class="svg-sub" x="14" y="108">writes: files</text>
                <text class="svg-sub" x="14" y="140">ship DocumentStore;</text>
                <text class="svg-sub" x="14" y="160">callers stop touching</text>
                <text class="svg-sub" x="14" y="180">paths directly</text>

                <rect fill="#f7f7f5" height="200" rx="8" stroke="#b8b8b1" width="200" x="230" y="32"></rect>
                <text class="svg-num" x="244" y="56">2</text>
                <text class="svg-step" x="260" y="56">Dual-write, DB shadow</text>
                <text class="svg-sub" style="white-space:pre" x="244" y="88">reads:  files</text>
                <text class="svg-sub" x="244" y="108">writes: files, then DB</text>
                <text class="svg-sub" x="244" y="140">DB failures logged,</text>
                <text class="svg-sub" x="244" y="160">never surfaced; files</text>
                <text class="svg-sub" x="244" y="180">still decide</text>

                <rect fill="#f7f7f5" height="200" rx="8" stroke="#b8b8b1" width="200" x="460" y="32"></rect>
                <text class="svg-num" x="474" y="56">3</text>
                <text class="svg-step" x="490" y="56">Backfill + compare</text>
                <text class="svg-sub" style="white-space:pre" x="474" y="88">reads:  files</text>
                <text class="svg-sub" x="474" y="108">writes: files, then DB</text>
                <text class="svg-sub" x="474" y="140">load every old file;</text>
                <text class="svg-sub" x="474" y="160">nightly diff of files</text>
                <text class="svg-sub" x="474" y="180">vs rows must hit zero</text>

                <rect fill="#e0ebf2" height="200" rx="8" stroke="#3c6f97" width="200" x="690" y="32"></rect>
                <text class="svg-num" x="704" y="56">4</text>
                <text class="svg-step" x="720" y="56">Read from DB</text>
                <text class="svg-sub" style="white-space:pre" x="704" y="88">reads:  DB</text>
                <text class="svg-sub" x="704" y="108">writes: DB, then files</text>
                <text class="svg-sub" x="704" y="140">files become a</text>
                <text class="svg-sub" x="704" y="160">projection; BFF reads</text>
                <text class="svg-sub" x="704" y="180">go through the store</text>

                <rect fill="#e0ebf2" height="200" rx="8" stroke="#3c6f97" width="200" x="920" y="32"></rect>
                <text class="svg-num" x="934" y="56">5</text>
                <text class="svg-step" x="950" y="56">Stop writing files</text>
                <text class="svg-sub" style="white-space:pre" x="934" y="88">reads:  DB</text>
                <text class="svg-sub" x="934" y="108">writes: DB</text>
                <text class="svg-sub" x="934" y="140">read-only JSON export</text>
                <text class="svg-sub" x="934" y="160">for humans and agents,</text>
                <text class="svg-sub" x="934" y="180">marked generated</text>

                <path d="M200 132 H 226" fill="none" marker-end="url(#fig-migration-ink)" stroke="#252525" stroke-width="2.6"></path>
                <path d="M430 132 H 456" fill="none" marker-end="url(#fig-migration-ink)" stroke="#252525" stroke-width="2.6"></path>
                <path d="M660 132 H 686" fill="none" marker-end="url(#fig-migration-ink)" stroke="#252525" stroke-width="2.6"></path>
                <path d="M890 132 H 916" fill="none" marker-end="url(#fig-migration-ink)" stroke="#252525" stroke-width="2.6"></path>

                <text class="svg-lane" x="0" y="266">SOURCE OF TRUTH</text>
                <rect fill="#f7e3c8" height="30" rx="6" stroke="#d98226" width="660" x="0" y="278"></rect>
                <text class="svg-sub" x="14" y="298">files (.xo/*.json, ~/.quirq/state.json)</text>
                <rect fill="#e0ebf2" height="30" rx="6" stroke="#3c6f97" width="430" x="690" y="278"></rect>
                <text class="svg-sub" x="704" y="298">database (SQLite or PostgreSQL)</text>

                <text class="svg-lane" x="0" y="342">ROLLBACK POINT</text>
                <rect fill="#f3dfdc" height="50" rx="6" stroke="#ad4b43" width="200" x="0" y="354"></rect>
                <text class="svg-sub" x="14" y="376">revert the commit;</text>
                <text class="svg-sub" x="14" y="394">no data touched</text>
                <rect fill="#f3dfdc" height="50" rx="6" stroke="#ad4b43" width="200" x="230" y="354"></rect>
                <text class="svg-sub" x="244" y="376">flag off; drop the</text>
                <text class="svg-sub" x="244" y="394">shadow tables</text>
                <rect fill="#f3dfdc" height="50" rx="6" stroke="#ad4b43" width="200" x="460" y="354"></rect>
                <text class="svg-sub" x="474" y="376">same as 2; fix the</text>
                <text class="svg-sub" x="474" y="394">diff, rerun backfill</text>
                <rect fill="#f3dfdc" height="50" rx="6" stroke="#ad4b43" width="200" x="690" y="354"></rect>
                <text class="svg-sub" x="704" y="376">flag back to file</text>
                <text class="svg-sub" x="704" y="394">reads; files current</text>
                <rect fill="#f3dfdc" height="50" rx="6" stroke="#ad4b43" width="200" x="920" y="354"></rect>
                <text class="svg-sub" x="934" y="376">regenerate files</text>
                <text class="svg-sub" x="934" y="394">from DB; back to 4</text>
              </svg>
