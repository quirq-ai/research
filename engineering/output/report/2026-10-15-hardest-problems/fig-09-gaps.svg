<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-label="A logarithmic bar chart showing the bound on prime gaps falling from 70 million to 246, with conditional and conjectural targets at 6 and 2"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="372.0" fill="#ffffff"/>
                <text class="svg-lane" x="16" y="30">BOUND ON GAPS THAT RECUR INFINITELY OFTEN · BAR LENGTH ∝ log₁₀(gap)</text>

                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" stroke-width="1.2" width="700" x="210" y="46"></rect>
                <text class="svg-step" x="16" y="64">Zhang · May 2013</text>
                <text class="svg-step" x="922" y="64">70,000,000</text>

                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" stroke-width="1.2" width="327" x="210" y="92"></rect>
                <text class="svg-step" x="16" y="110">Polymath8a · 2013</text>
                <text class="svg-step" x="549" y="110">4,680</text>

                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" stroke-width="1.2" width="248" x="210" y="138"></rect>
                <text class="svg-step" x="16" y="156">Maynard · Nov 2013</text>
                <text class="svg-step" x="470" y="156">600</text>

                <rect fill="#f7e3c8" height="26" rx="4" stroke="#d98226" stroke-width="1.2" width="213" x="210" y="184"></rect>
                <text class="svg-step" x="16" y="202">Polymath8b · 2014</text>
                <text class="svg-step" x="435" y="202">246 — the current record, unimproved for twelve years</text>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" stroke-width="1.2" width="70" x="210" y="230"></rect>
                <text class="svg-step" x="16" y="248">Same paper, on GEH</text>
                <text class="svg-step" x="292" y="248">6 — conditional on the generalised Elliott–Halberstam conjecture</text>

                <rect fill="#dfede5" height="26" rx="4" stroke="#367f59" stroke-width="1.2" width="27" x="210" y="276"></rect>
                <text class="svg-step" x="16" y="294">The conjecture</text>
                <text class="svg-step" x="249" y="294">2 — and the last factor of three is the parity problem</text>

                <line stroke="#deded9" x1="16" x2="984" y1="322" y2="322"></line>
                <text class="svg-note" x="16" y="346">Chen Jingrun got to “p + 2 is prime or a product of two primes” in 1973. Fifty-three years later that “or” has not been removed, by anyone, for any pair.</text>
              </svg>
