<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 980 476" role="img" aria-label="Two stacked timelines. The top band runs KHTML 1998 and WebKit 2001, then, after an axis break, the Blink announcement in April 2013, Chrome 28 stable in July 2013, BlinkNG from 2014, Onion Soup from November 2015, the Reformat blink, Blink Rename and Great Blink mv megacommits in 2016, 2017 and 2018, and the reference tree f288fed6 in September 2026. The bottom band plots four subsystem lanes on the same 2013 to 2026 scale: Slimming Paint milestones M45, M58, M67, M75 and M94 with a separate tip-of-tree flip in October 2021; LayoutNG 77, then 93, then the 102, 103, 106, 108 cluster in 2022; Oilpan from the 2013 branch through unified heap M74, the V8 library at M94, pointer compression at M106 and ElementSpace in 2026; and Fontations 128, 133, 136 and 145."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
