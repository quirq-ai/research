                <rect fill="#ffffff" height="62" rx="8" stroke="#765b98" width="164" x="902" y="176"></rect>
                <text class="svg-step" x="916" y="200">Skia Perf</text>
                <text class="svg-sub" x="916" y="220">perf.luci.app, public</text>

