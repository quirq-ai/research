<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-label="Three tiers. At the top, clients: the phone OS, the Space UI, the desktop, and schedules. In the middle, the XO session manager with six components: a process table, launch profiles, a permission broker, an event bus, a job interface, and a store for indexes and budgets. At the bottom, one claude process per active conversation, each speaking stream-json and the control protocol to the manager, posting hook events to it, and reaching XO apps through a plugin with MCP servers, skills and command-line tools. Apps report finished work back through the inbox socket or a channel."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1080.0" height="450.0" fill="#ffffff"/>
                <defs>
                  <marker id="fso-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#252525"/></marker>
                  <marker id="fso-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f97"/></marker>
                  <marker id="fso-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#765b98"/></marker>
                </defs>
                <text x="16" y="24" class="svg-lane">CLIENTS</text>
                <rect x="120" y="10" width="200" height="40" rx="8" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="134" y="35" class="svg-step">xo-phone-os</text>
                <rect x="340" y="10" width="200" height="40" rx="8" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="354" y="35" class="svg-step">Space UI</text>
                <rect x="560" y="10" width="200" height="40" rx="8" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="574" y="35" class="svg-step">desktop, terminal</text>
                <rect x="780" y="10" width="200" height="40" rx="8" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="794" y="35" class="svg-step">schedules, inbox</text>
                <line x1="550" y1="52" x2="550" y2="80" stroke="#252525" stroke-width="2.2" marker-start="url(#fso-k)" marker-end="url(#fso-k)"/>
                <text x="560" y="72" class="svg-sub">HTTP, SSE, push</text>

                <rect x="16" y="84" width="1048" height="170" rx="10" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>
                <text x="32" y="106" class="svg-lane">XO SESSION MANAGER</text>
                <rect x="32" y="118" width="320" height="58" rx="7" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="44" y="140" class="svg-step">Process table</text>
                <text x="44" y="160" class="svg-sub">own spawns + claude agents --json</text>
                <rect x="380" y="118" width="320" height="58" rx="7" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="392" y="140" class="svg-step">Launch profiles</text>
                <text x="392" y="160" class="svg-sub">argv, --settings, config dir, version</text>
                <rect x="728" y="118" width="320" height="58" rx="7" fill="#ffffff" stroke="#d98226"/>
                <text x="740" y="140" class="svg-step">Permission broker</text>
                <text x="740" y="160" class="svg-sub">policy, then silent, toast, or prompt</text>
                <rect x="32" y="184" width="320" height="58" rx="7" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="44" y="206" class="svg-step">Event bus</text>
                <text x="44" y="226" class="svg-sub">stream events + HTTP hook events</text>
                <rect x="380" y="184" width="320" height="58" rx="7" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="392" y="206" class="svg-step">Job interface</text>
                <text x="392" y="226" class="svg-sub">acknowledge, then push back</text>
                <rect x="728" y="184" width="320" height="58" rx="7" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="740" y="206" class="svg-step">Store</text>
                <text x="740" y="226" class="svg-sub">ID map, budgets, transcript mirror</text>

                <text x="16" y="286" class="svg-lane">ONE PROCESS PER ACTIVE CONVERSATION</text>
                <rect x="16" y="298" width="330" height="72" rx="8" fill="#ffffff" stroke="#252525"/>
                <text x="30" y="320" class="svg-step">claude · conversation A</text>
                <text x="30" y="340" class="svg-sub">stream-json in and out</text>
                <text x="30" y="358" class="svg-sub">--await-initialize, prompt tool stdio</text>
                <rect x="376" y="298" width="330" height="72" rx="8" fill="#ffffff" stroke="#252525"/>
                <text x="390" y="320" class="svg-step">claude · conversation B</text>
                <text x="390" y="340" class="svg-sub">parked after idle; resumed with</text>
                <text x="390" y="358" class="svg-sub">the same profile and ID</text>
                <rect x="736" y="298" width="328" height="72" rx="8" fill="#ffffff" stroke="#3c6f97"/>
                <text x="750" y="320" class="svg-step">XO plugin</text>
                <text x="750" y="340" class="svg-sub">skills, MCP servers, hooks, bin/</text>
                <text x="750" y="358" class="svg-sub">apps that do the offloaded work</text>

                <line x1="300" y1="256" x2="300" y2="294" stroke="#252525" stroke-width="2.2" marker-start="url(#fso-k)" marker-end="url(#fso-k)"/>
                <text x="310" y="280" class="svg-sub">control protocol</text>
                <line x1="540" y1="256" x2="540" y2="294" stroke="#252525" stroke-width="2.2" marker-start="url(#fso-k)" marker-end="url(#fso-k)"/>
                <path d="M 180 372 L 180 388 L 900 388 L 900 376" fill="none" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fso-b)"/>
                <line x1="540" y1="372" x2="540" y2="388" stroke="#3c6f97" stroke-width="1.4"/>
                <text x="600" y="402" class="svg-sub">tool calls</text>
                <line x1="840" y1="296" x2="840" y2="258" stroke="#765b98" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fso-p)"/>
                <text x="850" y="282" class="svg-sub">job done: socket or channel</text>

                <text x="16" y="412" class="svg-note">Every arrow is a documented or measured interface of Claude Code 2.1.280; the boxes in orange are XO's to build.</text>
                <text x="16" y="430" class="svg-note">Nothing in this design parses a transcript to learn what is happening now; transcripts are read only to rebuild history.</text>
              </svg>
