<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="Left: the seven-line TOML file from case t_scope_trap. Line 1 title = &quot;app&quot; is the whole root table. Line 2 opens [server], whose scope runs to the end of the file. Lines 3 and 4 are host = &quot;0.0.0.0&quot; and port = 8080, line 5 is blank, line 6 is the comment # meant as a top-level setting, and line 7 is debug = true. Middle: the tree all 10 parser configurations returned: a root table with title = &quot;app&quot; and a server table holding host, port and debug = true. An arrow runs from line 7 to debug inside server. Right: the tree the author meant, with debug = true in the root beside title, crossed out because no parser produced it. Below: no error and no warning in 10 of 10 configurations here and 16 of 16 in the research probe; the fixes are to move the key above the first header, where the root table ends, or to have no root keys at all, as Alacritty 0.14 did by removing its root-level options and adding a [general] table (PR #8192)."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="470.0" fill="#ffffff"/>
