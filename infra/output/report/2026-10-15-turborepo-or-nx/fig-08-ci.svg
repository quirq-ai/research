                  <rect fill="#ece6f3" height="22" stroke="#765b98" width="120" x="200" y="238"></rect><rect fill="#ece6f3" height="22" stroke="#765b98" width="90" x="320" y="238"></rect><rect fill="#ece6f3" height="22" stroke="#765b98" width="60" x="410" y="238"></rect>
