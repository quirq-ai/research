<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-label="A sequence diagram between the host on the left and the claude process on the right. The host spawns the process and sends initialize. Startup hook frames and the initialize response come back. The host sends a user message. The process reports it queued and started, emits system init, streams the assistant's tool call, and sends a can_use_tool control request. The host answers allow. The process emits the tool result, the final assistant text, the result message with usage and cost, and a completed lifecycle event. Later the host can send interrupt, and closing stdin ends the process."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1080.0" height="470.0" fill="#ffffff"/>
                <defs>
                  <marker id="fpr-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#252525"/></marker>
                  <marker id="fpr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f97"/></marker>
                  <marker id="fpr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d98226"/></marker>
                </defs>
                <text x="150" y="22" text-anchor="middle" class="svg-lane">HOST</text>
                <text x="930" y="22" text-anchor="middle" class="svg-lane">CLAUDE PROCESS</text>
                <line x1="150" y1="32" x2="150" y2="460" stroke="#b8b8b1"/>
                <line x1="930" y1="32" x2="930" y2="460" stroke="#b8b8b1"/>

                <line x1="152" y1="46" x2="926" y2="46" stroke="#252525" stroke-width="2" marker-end="url(#fpr-k)"/>
                <text x="170" y="40" class="svg-sub">spawn: -p, stream-json in and out, --permission-prompt-tool stdio, --session-id</text>
                <line x1="152" y1="74" x2="926" y2="74" stroke="#252525" stroke-width="2" marker-end="url(#fpr-k)"/>
                <text x="170" y="68" class="svg-sub">control_request initialize {hooks, sdkMcpServers, agents, systemPrompt, plugins}</text>
                <line x1="928" y1="100" x2="154" y2="100" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fpr-b)"/>
                <text x="170" y="94" class="svg-sub">system/hook_started, hook_response   (SessionStart hooks)</text>
                <line x1="928" y1="126" x2="154" y2="126" stroke="#252525" stroke-width="2" marker-end="url(#fpr-k)"/>
                <text x="170" y="120" class="svg-sub">control_response success {commands, agents, models, account, pid, session_state}</text>

                <line x1="152" y1="160" x2="926" y2="160" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fpr-b)"/>
                <text x="170" y="154" class="svg-sub">{"type":"user", message, uuid, priority}</text>
                <line x1="928" y1="186" x2="154" y2="186" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fpr-b)"/>
                <text x="170" y="180" class="svg-sub">command_lifecycle queued, started; system/init (sent at the start of every turn)</text>
                <line x1="928" y1="212" x2="154" y2="212" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fpr-b)"/>
                <text x="170" y="206" class="svg-sub">stream_event deltas; assistant (one per content block): tool_use Bash</text>

                <line x1="928" y1="246" x2="154" y2="246" stroke="#d98226" stroke-width="2" marker-end="url(#fpr-o)"/>
                <text x="170" y="240" class="svg-sub">control_request can_use_tool {tool_name, input, permission_suggestions, blocked_path, …}</text>
                <line x1="152" y1="272" x2="926" y2="272" stroke="#d98226" stroke-width="2" marker-end="url(#fpr-o)"/>
                <text x="170" y="266" class="svg-sub">control_response {behavior: "allow", updatedInput}   or   {behavior: "deny", message}</text>

                <line x1="928" y1="306" x2="154" y2="306" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fpr-b)"/>
                <text x="170" y="300" class="svg-sub">user (tool_result); assistant (text)</text>
                <line x1="928" y1="332" x2="154" y2="332" stroke="#252525" stroke-width="2" marker-end="url(#fpr-k)"/>
                <text x="170" y="326" class="svg-sub">result {subtype, result, usage, total_cost_usd, num_turns, terminal_reason, permission_denials}</text>
                <line x1="928" y1="358" x2="154" y2="358" stroke="#3c6f97" stroke-width="1.4" marker-end="url(#fpr-b)"/>
                <text x="170" y="352" class="svg-sub">command_lifecycle completed; the process stays alive, idle</text>

                <line x1="152" y1="396" x2="926" y2="396" stroke="#252525" stroke-width="2" marker-end="url(#fpr-k)"/>
                <text x="170" y="390" class="svg-sub">later: control_request interrupt {cancel_queued}   ← receipt {still_queued, cancelled}</text>
                <line x1="152" y1="432" x2="926" y2="432" stroke="#252525" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fpr-k)"/>
                <text x="170" y="426" class="svg-sub">close stdin: finish the current turn, run SessionEnd hooks, exit 0</text>
              </svg>
