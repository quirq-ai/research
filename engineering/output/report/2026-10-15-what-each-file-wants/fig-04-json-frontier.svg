s. Rings mark the knees, gzip -6, brotli 5 and zstd 9, where the next level adds under 15% to the ratio."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
