<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 526" role="img" aria-label="Two panels. A: the counting argument for 3 bits. Eight 3-bit inputs, 000 to 111, map to the seven strings shorter than 3 bits: four of length 2, two of length 1 and the empty string. Seven inputs each take a distinct output; the eighth, 111, must share the empty string with 110, so the decoder cannot tell them apart. B: bytes added when 1,048,576 pseudo-random bytes are compressed, on a log scale, every round trip exact: brotli -q 5 and -q 11 +5 (0.0005%); zstd -3 and -19 +33 (0.0031%); snappy raw +51 (0.0049%); lz4 frame, default and HC -9 +83 (0.0079%); xz -6 and -9 +112 (0.0107%); snappy framed +138 (0.0132%); raw DEFLATE -9 +320 (0.0305%); zlib -9 +326 (0.0311%); gzip -6 and -9 +338 (0.0322%); lz4 block +4,118 (0.3927%); bzip2 -9 +5,181 (0.4941%). Every codec grows the input; nine stay under 0.04 percent and two, lz4 block and bzip2, grow it by 0.39 and 0.49 percent."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="704.0" height="526.0" fill="#ffffff"/>
