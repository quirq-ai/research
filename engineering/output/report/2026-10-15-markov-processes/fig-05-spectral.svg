<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-label="A line chart of total variation distance against step number for three two-state chains. The chain with second eigenvalue zero reaches its stationary distribution in one step. The chain with second eigenvalue 0.8 crosses one quarter at step 4. The chain with second eigenvalue 0.96 crosses one quarter only at step 17 and is still visibly above zero at step 40."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="350.0" fill="#ffffff"/>
                <line stroke="#b8b8b1" x1="90" x2="90" y1="40" y2="250"></line>
