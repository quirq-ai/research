                <line stroke="#deded9" x1="0" x2="1120" y1="378" y2="378"></line>
                <text class="svg-lane" x="0" y="404">READING IT OFF</text>
                <text class="svg-sub" x="0" y="428">Best path: Human → Bot → Bot → Human,  probability 0.0013328</text>
                <text class="svg-sub" x="0" y="450">Forward: P(observations) = 0.005389625 over all 16 paths</text>
                <text class="svg-lane" x="600" y="404">THE CAVEAT</text>
                <text class="svg-sub" x="600" y="428">The single best path carries 0.0013328 / 0.005389625 = 24.7%</text>
                <text class="svg-sub" x="600" y="450">of the posterior. Three quarters of the mass is on other paths.</text>
              </svg>
