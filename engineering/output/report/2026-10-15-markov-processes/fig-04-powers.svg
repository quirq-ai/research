<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-label="On the left, a three-state chain with states Healthy, Degraded and Down and labelled transition arrows. In the middle, the transition matrix P. On the right, a table of the rows of P to the powers one, two, four, eight and sixteen, showing all three rows converging to the same stationary distribution 0.78767, 0.15068, 0.06164."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="430.0" fill="#ffffff"/>
                <defs>
                  <marker id="arith-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#367f59"></path></marker>
                </defs>

                <text class="svg-lane" x="0" y="18">THE CHAIN · ONE STEP = ONE HOUR</text>
                <circle cx="130" cy="96" fill="#dfede5" r="42" stroke="#367f59" stroke-width="1.6"></circle>
                <text class="svg-step" text-anchor="middle" x="130" y="94">Healthy</text>
                <text class="svg-sub" text-anchor="middle" x="130" y="112">H</text>
                <circle cx="300" cy="216" fill="#f7e3c8" r="42" stroke="#d98226" stroke-width="1.6"></circle>
                <text class="svg-step" text-anchor="middle" x="300" y="214">Degraded</text>
                <text class="svg-sub" text-anchor="middle" x="300" y="232">D</text>
                <circle cx="80" cy="300" fill="#f3dfdc" r="42" stroke="#ad4b43" stroke-width="1.6"></circle>
                <text class="svg-step" text-anchor="middle" x="80" y="298">Down</text>
                <text class="svg-sub" text-anchor="middle" x="80" y="316">X</text>

                <path d="M168 114 L 262 196" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="228" y="142">0.08</text>
                <path d="M264 232 L 124 286" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="196" y="274">0.10</text>
                <path d="M100 138 L 96 254" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="40" y="200">0.02</text>
                <path d="M120 258 L 130 148" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="142" y="204">0.30</text>
                <path d="M262 190 L 172 116" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="188" y="168">0.40</text>
                <path d="M122 292 L 258 226" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="184" y="322">0.20</text>
                <path d="M166 74 C 224 48 224 122 166 118" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="230" y="100">0.90</text>
                <path d="M338 196 C 392 176 396 250 340 244" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="382" y="216">0.50</text>
                <path d="M46 328 C 10 368 90 386 96 344" fill="none" marker-end="url(#arith-arr)" stroke="#367f59" stroke-width="1.6"></path>
                <text class="svg-sub" x="14" y="388">0.50</text>

                <text class="svg-lane" x="404" y="18">P</text>
                <text class="svg-sub" x="404" y="60">        H       D       X</text>
                <text class="svg-sub" x="404" y="86">H   0.90    0.08    0.02</text>
                <text class="svg-sub" x="404" y="110">D   0.40    0.50    0.10</text>
                <text class="svg-sub" x="404" y="134">X   0.30    0.20    0.50</text>
                <text class="svg-note" x="404" y="176">Rows sum to 1. Reading a row: given</text>
                <text class="svg-note" x="404" y="196">the state on the left, where am I next?</text>
                <text class="svg-lane" x="404" y="240">STATIONARY π — SOLVES πP = π</text>
                <text class="svg-sub" x="404" y="268">π = ( 0.78767 , 0.15068 , 0.06164 )</text>
                <text class="svg-note" x="404" y="300">Expected return time to Down</text>
                <text class="svg-note" x="404" y="320">= 1/π(X) = 16.2 hours.</text>
                <text class="svg-note" x="404" y="352">Every row of Pⁿ is within 0.001 of π</text>
                <text class="svg-note" x="404" y="372">by n = 12.</text>

                <text class="svg-lane" x="716" y="18">ROWS OF Pⁿ</text>
                <text class="svg-sub" x="716" y="48">n       H        D        X</text>
                <line stroke="#deded9" x1="716" x2="1096" y1="58" y2="58"></line>
                <text class="svg-sub" x="716" y="80">1     0.9000   0.0800   0.0200   ← from H</text>
                <text class="svg-sub" x="716" y="102">      0.4000   0.5000   0.1000   ← from D</text>
                <text class="svg-sub" x="716" y="124">      0.3000   0.2000   0.5000   ← from X</text>
                <text class="svg-sub" x="716" y="158">2     0.8480   0.1160   0.0360</text>
                <text class="svg-sub" x="716" y="180">      0.5900   0.3020   0.1080</text>
                <text class="svg-sub" x="716" y="202">      0.5000   0.2240   0.2760</text>
                <text class="svg-sub" x="716" y="236">4     0.8055   0.1415   0.0530</text>
                <text class="svg-sub" x="716" y="258">      0.7325   0.1838   0.0837</text>
                <text class="svg-sub" x="716" y="280">      0.6942   0.1875   0.1184</text>
                <text class="svg-sub" x="716" y="314">8     0.7893   0.1499   0.0608</text>
                <text class="svg-sub" x="716" y="336">      0.7828   0.1531   0.0641</text>
                <text class="svg-sub" x="716" y="358">      0.7787   0.1549   0.0665</text>
                <rect fill="#f7e3c8" height="46" rx="6" stroke="#d98226" width="392" x="710" y="374"></rect>
                <text class="svg-sub" x="716" y="394">16    0.7877   0.1507   0.0616</text>
                <text class="svg-sub" x="716" y="414">      0.7876   0.1507   0.0617    ← rows agree</text>
              </svg>
