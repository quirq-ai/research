<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="A depth bar showing sensory, workspace and motor regions of the model"><style>.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="300.0" fill="#ffffff"/>
              <rect fill="#e0ebf2" height="54" rx="6" stroke="#3c6f97" stroke-width="1.4" width="404" x="40" y="60"></rect>
              <rect fill="#f7e3c8" height="54" rx="6" stroke="#d98226" stroke-width="2" width="572" x="444" y="60"></rect>
              <rect fill="#f3dfdc" height="54" rx="6" stroke="#ad4b43" stroke-width="1.4" width="64" x="1016" y="60"></rect>

              <text class="svg-step" text-anchor="middle" x="242" y="93">SENSORY</text>
              <text class="svg-step" text-anchor="middle" x="730" y="93">WORKSPACE</text>
              <text class="svg-sub" text-anchor="middle" x="1048" y="93">MOTOR</text>

              <line stroke="#deded9" x1="40" x2="1080" y1="130" y2="130"></line>
              <text class="svg-sub" x="40" y="150">L0</text>
              <text class="svg-num" text-anchor="middle" x="444" y="150">~L38</text>
              <text class="svg-num" text-anchor="middle" x="1016" y="150">~L92</text>
              <text class="svg-sub" text-anchor="end" x="1080" y="150">L100</text>

              <text class="svg-sub" x="40" y="188">Readouts noisy and largely</text>
              <text class="svg-sub" x="40" y="206">uninterpretable. Ambiguous inputs</text>
              <text class="svg-sub" x="40" y="224">tracked smoothly — the model has</text>
              <text class="svg-sub" x="40" y="242">not committed to a reading yet.</text>

              <text class="svg-sub" x="470" y="188">Sharp transition in all four structural metrics at onset. Ambiguous inputs</text>
              <text class="svg-sub" x="470" y="206">stop tracking smoothly and snap to a binary commitment. J-lens vectors</text>
              <text class="svg-sub" x="470" y="224">compose with downstream weights more broadly than other directions —</text>
              <text class="svg-sub" x="470" y="242">the "broadcast" property a workspace is supposed to have. Ablation</text>
              <text class="svg-sub" x="470" y="260">experiments target L38–79, inside this band.</text>

              <text class="svg-note" x="40" y="290">The J-space carries never more than 10% of activation variance at any layer — the workspace is a narrow channel through a wide network, not a wide one.</text>
            </svg>
