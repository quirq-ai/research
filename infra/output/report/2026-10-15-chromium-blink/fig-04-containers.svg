<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1120 346" role="img" aria-label="Three panels read left to right. The first shows one browser process above two sandboxed renderer processes and one Viz process. Two dotted fans zoom into the second panel, which shows the threads inside a single renderer: CrRendererMain, the compositor thread, the IO thread, and N worker threads each with their own isolate and Oilpan heap. A second fan zooms from CrRendererMain into the third panel, the main-thread object graph: AgentSchedulingGroup contains a WebView and blink::Page, which owns a FrameTree of LocalFrame and RemoteFrame; under LocalFrame sits LocalDOMWindow, which points at a WindowAgent holding an EventLoop and microtask queue."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-14.0" width="1120.0" height="346.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-containers-arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="fig-containers-arr-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
                </defs>

                <line stroke="#b8b8b1" stroke-dasharray="3 3" stroke-width="1" x1="334" x2="368" y1="100" y2="24"></line>
                <line stroke="#b8b8b1" stroke-dasharray="3 3" stroke-width="1" x1="334" x2="368" y1="126" y2="278"></line>
                <line stroke="#b8b8b1" stroke-dasharray="3 3" stroke-width="1" x1="700" x2="732" y1="52" y2="24"></line>
                <line stroke="#b8b8b1" stroke-dasharray="3 3" stroke-width="1" x1="700" x2="732" y1="76" y2="278"></line>

                <text class="svg-lane" x="4" y="2">PROCESSES</text>
                <rect fill="#ffffff" height="50" rx="8" stroke="#252525" stroke-width="1.5" width="330" x="4" y="24"></rect>
                <text class="svg-step" x="20" y="48">Browser process</text>
                <text class="svg-sub" x="20" y="65">decides placement · SiteInfo · SiteInstance</text>
                <rect fill="#e0ebf2" height="54" rx="8" stroke="#3c6f97" width="330" x="4" y="86"></rect>
                <text class="svg-step" x="20" y="110">Renderer · sandboxed</text>
                <text class="svg-sub" x="20" y="127">locked to one site: scheme + eTLD+1</text>
                <rect fill="#e0ebf2" height="54" rx="8" stroke="#3c6f97" width="330" x="4" y="150"></rect>
                <text class="svg-step" x="20" y="174">Renderer · sandboxed</text>
                <text class="svg-sub" x="20" y="191">another principal, another process</text>
                <text class="svg-sub" x="20" y="220">… N more, up to a soft process limit</text>
                <rect fill="#dfede5" height="48" rx="8" stroke="#367f59" width="330" x="4" y="230"></rect>
                <text class="svg-step" x="20" y="253">Viz process</text>
                <text class="svg-sub" x="20" y="269">one, for all of Chromium</text>
                <text class="svg-note" x="4" y="302">desktop: site-per-process since Chrome 67, ~10–13% memory</text>
                <text class="svg-note" x="4" y="320">≥ 2 GB Android: partial · below that, WebView, iOS: none</text>

                <text class="svg-lane" x="368" y="2">THREADS IN ONE RENDERER</text>
                <rect fill="#f7f7f5" height="254" rx="10" stroke="#b8b8b1" width="332" x="368" y="24"></rect>
                <rect fill="#e0ebf2" height="52" rx="8" stroke="#3c6f97" stroke-width="2" width="308" x="380" y="38"></rect>
                <text class="svg-step" x="394" y="60">CrRendererMain</text>
                <text class="svg-sub" x="394" y="77">one V8 isolate · one Oilpan heap</text>
                <rect fill="#f7e3c8" height="52" rx="8" stroke="#d98226" width="308" x="380" y="100"></rect>
                <text class="svg-step" x="394" y="122">Compositor</text>
                <text class="svg-sub" x="394" y="139">kCompositorThread · kPresentation</text>
                <rect fill="#ffffff" height="48" rx="8" stroke="#252525" width="308" x="380" y="162"></rect>
                <text class="svg-step" x="394" y="184">IO thread</text>
                <text class="svg-sub" x="394" y="201">every Mojo message lands here first</text>
                <rect fill="#ece6f3" height="48" rx="8" stroke="#765b98" width="308" x="380" y="220"></rect>
                <text class="svg-step" x="394" y="242">N worker threads</text>
                <text class="svg-sub" x="394" y="259">each: own isolate, own Oilpan heap</text>
                <text class="svg-note" x="368" y="302">compositor thread optional: --disable-threaded-compositing</text>
                <text class="svg-note" x="368" y="320">blue = main thread · orange = compositor · purple = workers</text>

                <text class="svg-lane" x="732" y="2">OBJECTS ON CrRendererMain</text>
                <rect fill="#ffffff" height="44" rx="8" stroke="#252525" stroke-width="1.5" width="384" x="732" y="24"></rect>
                <text class="svg-step" x="746" y="46">AgentSchedulingGroup</text>
                <text class="svg-sub" x="746" y="61">one WebAgentGroupScheduler</text>
                <line marker-end="url(#fig-containers-arr-ink)" stroke="#252525" stroke-width="2.5" x1="760" x2="760" y1="68" y2="78"></line>
                <rect fill="#f7f7f5" height="44" rx="8" stroke="#b8b8b1" width="372" x="744" y="78"></rect>
                <text class="svg-step" x="758" y="100">WebView → blink::Page</text>
                <text class="svg-sub" x="758" y="115">"roughly … a tab or popup window"</text>
                <line marker-end="url(#fig-containers-arr-ink)" stroke="#252525" stroke-width="2.5" x1="760" x2="760" y1="122" y2="138"></line>
                <text class="svg-lane" x="790" y="132">FRAMETREE</text>
                <rect fill="#e0ebf2" height="66" rx="8" stroke="#3c6f97" width="172" x="756" y="138"></rect>
                <text class="svg-step" x="768" y="158">LocalFrame</text>
                <text class="svg-sub" x="768" y="176">local root → widget</text>
                <text class="svg-sub" x="768" y="194">→ cc::LayerTreeHost</text>
                <rect fill="#f7f7f5" height="66" rx="8" stroke="#b8b8b1" stroke-dasharray="5 4" width="164" x="952" y="138"></rect>
                <text class="svg-step" x="964" y="158">RemoteFrame</text>
                <text class="svg-sub" x="964" y="176">always cross-site</text>
                <text class="svg-sub" x="964" y="194">a stand-in, no DOM</text>
                <line marker-end="url(#fig-containers-arr-ink)" stroke="#252525" stroke-width="2.5" x1="800" x2="800" y1="204" y2="216"></line>
                <rect fill="#e0ebf2" height="62" rx="8" stroke="#3c6f97" width="172" x="756" y="216"></rect>
                <text class="svg-step" x="768" y="236">LocalDOMWindow</text>
                <text class="svg-sub" x="768" y="253">is the ExecutionContext</text>
                <text class="svg-sub" x="768" y="270">Document hangs off it</text>
                <line marker-end="url(#fig-containers-arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="928" x2="952" y1="247" y2="247"></line>
                <rect fill="#ece6f3" height="62" rx="8" stroke="#765b98" width="164" x="952" y="216"></rect>
                <text class="svg-step" x="964" y="236">WindowAgent</text>
                <text class="svg-sub" x="964" y="253">one per AgentClusterKey</text>
                <text class="svg-sub" x="964" y="270">EventLoop + microtasks</text>
                <text class="svg-note" x="732" y="302">thick black = ownership · dashed purple = agent of a context</text>
                <text class="svg-note" x="732" y="320">only a local root owns a widget, and so a LayerTreeHost</text>
              </svg>
