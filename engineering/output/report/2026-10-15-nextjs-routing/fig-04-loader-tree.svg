<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 806" role="img" aria-label="Nested boxes showing the compiled LoaderTree for /sec0/a/[id]. A key row names the four tuple elements: segment, parallelRoutes (slots), modules and staticSiblings. Five nodes nest through their children slot: the root with an empty segment string, sec0, a, [id] and __PAGE__. The root's modules are its layout plus Next's built-in not-found, forbidden, unauthorized and global-error; sec0 has a layout; a and [id] hold only metadata; __PAGE__ has empty slots and a lazy page getter, instrumentModuleGetter of a.r(79741). Every node ends in an empty array. Notes explain that an empty array means known to have no static siblings, null means unknown in webpack dev, and the doc comment's example is ['sale']. An inset shows the /dashboard/settings tree from section 02: the dashboard node has three slots, children as a __DEFAULT__ leaf from dashboard/default.tsx, team as a (__SLOT__) level containing settings and then __PAGE__, and analytics as a __DEFAULT__ leaf from its default.tsx."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="806.0" fill="#ffffff"/>
