<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1120 416" role="img" aria-label="A left-to-right pipeline of six boxes: IDL sources, collect_idl_files.py, per-component pickles, build_web_idl_database.py, web_idl_database.pickle, and generate_bindings.py in eleven GN actions, with runtime_enabled_features.json5 feeding the database step and the generated v8 files hanging off the last step. Below, one generated V8Foo class is exploded into six members: WrapperTypeInfo, InstallInterfaceTemplate, and four installers."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-14.0" width="1120.0" height="416.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-idl-pipeline-arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="fig-idl-pipeline-arr-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>

                <text class="svg-lane" x="0" y="2">BUILD TIME · third_party/blink/renderer/bindings</text>

                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" width="160" x="0" y="24"></rect>
                <text class="svg-step" x="12" y="47">*.idl</text>
                <text class="svg-sub" x="12" y="65">892 core</text>
                <text class="svg-sub" x="12" y="81">1,350 modules</text>
                <line marker-end="url(#fig-idl-pipeline-arr-ink)" stroke="#252525" stroke-width="2.5" x1="164" x2="188" y1="56" y2="56"></line>

                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" width="160" x="192" y="24"></rect>
                <text class="svg-step" x="204" y="47">collect_idl_files</text>
                <text class="svg-sub" x="204" y="65">//tools/idl_parser</text>
                <text class="svg-sub" x="204" y="81">→ IDLNode ASTs</text>
                <line marker-end="url(#fig-idl-pipeline-arr-ink)" stroke="#252525" stroke-width="2.5" x1="356" x2="380" y1="56" y2="56"></line>

                <rect fill="#f7f7f5" height="64" rx="8" stroke="#b8b8b1" width="160" x="384" y="24"></rect>
                <text class="svg-step" x="396" y="47">*.pickle</text>
                <text class="svg-sub" x="396" y="65">one per component</text>
                <text class="svg-sub" x="396" y="81">web_idl.AstGroup</text>
                <line marker-end="url(#fig-idl-pipeline-arr-ink)" stroke="#252525" stroke-width="2.5" x1="548" x2="572" y1="56" y2="56"></line>

                <rect fill="#ffffff" height="64" rx="8" stroke="#252525" stroke-width="1.5" width="160" x="576" y="24"></rect>
                <text class="svg-step" x="588" y="47">build_web_idl_</text>
                <text class="svg-step" x="588" y="63">database</text>
                <text class="svg-sub" x="588" y="81">IRs, phase by phase</text>
                <line marker-end="url(#fig-idl-pipeline-arr-ink)" stroke="#252525" stroke-width="2.5" x1="740" x2="764" y1="56" y2="56"></line>

                <rect fill="#f7f7f5" height="64" rx="8" stroke="#b8b8b1" width="160" x="768" y="24"></rect>
                <text class="svg-step" x="780" y="47">web_idl_database</text>
                <text class="svg-step" x="780" y="63">.pickle</text>
                <text class="svg-sub" x="780" y="81">immutable objects</text>
                <line marker-end="url(#fig-idl-pipeline-arr-ink)" stroke="#252525" stroke-width="2.5" x1="932" x2="956" y1="56" y2="56"></line>

                <rect fill="#dfede5" height="64" rx="8" stroke="#367f59" width="160" x="960" y="24"></rect>
                <text class="svg-step" x="972" y="47">generate_bindings</text>
                <text class="svg-sub" x="972" y="65">11 GN actions</text>
                <text class="svg-sub" x="972" y="81">parallel on RBE</text>

                <rect fill="#e0ebf2" height="46" rx="8" stroke="#3c6f97" width="356" x="380" y="124"></rect>
                <text class="svg-step" x="394" y="145">runtime_enabled_features.json5</text>
                <text class="svg-sub" x="394" y="162">origin trial? browser_process_read_write_access?</text>
                <line marker-end="url(#fig-idl-pipeline-arr-blue)" stroke="#3c6f97" stroke-width="1.5" x1="656" x2="656" y1="122" y2="92"></line>

                <rect fill="#dfede5" height="46" rx="8" stroke="#367f59" width="352" x="768" y="124"></rect>
                <text class="svg-step" x="782" y="145">gen/…/bindings/{core,modules}/v8/v8_*.{h,cc}</text>
                <text class="svg-sub" x="782" y="162">2,243 core + 3,619 modules paths</text>
                <line marker-end="url(#fig-idl-pipeline-arr-ink)" stroke="#252525" stroke-width="2.5" x1="1040" x2="1040" y1="90" y2="122"></line>

                <text class="svg-lane" x="0" y="212">ONE GENERATED V8Foo, EXPLODED</text>

                <rect fill="#f7f7f5" height="58" rx="8" stroke="#b8b8b1" width="352" x="0" y="226"></rect>
                <text class="svg-step" x="14" y="249">WrapperTypeInfo</text>
                <text class="svg-sub" x="14" y="267">the class's identity in every wrapper</text>
                <rect fill="#f7f7f5" height="58" rx="8" stroke="#b8b8b1" width="352" x="384" y="226"></rect>
                <text class="svg-step" x="398" y="249">InstallInterfaceTemplate</text>
                <text class="svg-sub" x="398" y="267">per-isolate v8::FunctionTemplate</text>
                <rect fill="#e0ebf2" height="58" rx="8" stroke="#3c6f97" width="352" x="768" y="226"></rect>
                <text class="svg-step" x="782" y="249">InstallUnconditionalProperties</text>
                <text class="svg-sub" x="782" y="267">identical in every context</text>

                <rect fill="#e0ebf2" height="58" rx="8" stroke="#3c6f97" width="352" x="0" y="296"></rect>
                <text class="svg-step" x="14" y="319">InstallContextIndependentProperties</text>
                <text class="svg-sub" x="14" y="337">settled once, per isolate</text>
                <rect fill="#ece6f3" height="58" rx="8" stroke="#765b98" width="352" x="384" y="296"></rect>
                <text class="svg-step" x="398" y="319">InstallContextDependentProperties</text>
                <text class="svg-sub" x="398" y="337">re-decided for each v8::Context</text>
                <rect fill="#ece6f3" height="58" rx="8" stroke="#765b98" width="352" x="768" y="296"></rect>
                <text class="svg-step" x="782" y="319">InstallPropertiesPerFeature</text>
                <text class="svg-sub" x="782" y="337">(ScriptState*, OriginTrialFeature)</text>

                <text class="svg-note" x="0" y="380">"Context dependent" is decided at build time: an origin-trial or browser-controlled [RuntimeEnabled] feature, or [ContextEnabled],</text>
                <text class="svg-note" x="0" y="396">[SecureContext], [CrossOriginIsolated], [IsolatedContext], [InjectionMitigated]</text>
              </svg>
