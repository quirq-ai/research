              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" x="24" y="190">KERNEL SPACE · ONE PROCESS, server.py</text>
              <rect fill="#e0ebf2" height="240" rx="12" stroke="#3c6f97" width="740" x="20" y="200"></rect>
              <rect fill="#ffffff" height="60" rx="8" stroke="#3c6f97" width="220" x="40" y="220"></rect>
              <text fill="#252525" font-size="12" text-anchor="middle" x="150" y="246">syscall handlers</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="150" y="264">BFF routers + scopes (VFS)</text>
              <rect fill="#ffffff" height="60" rx="8" stroke="#3c6f97" width="220" x="280" y="220"></rect>
              <text fill="#252525" font-size="12" text-anchor="middle" x="390" y="246">graph builders</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="390" y="264">space_index · categorized_graph</text>
              <rect fill="#ffffff" height="60" rx="8" stroke="#3c6f97" width="220" x="520" y="220"></rect>
              <text fill="#252525" font-size="12" text-anchor="middle" x="630" y="246">image engine</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="630" y="264">xo_projects_sync · gpg · chunks</text>
              <rect fill="#252525" height="116" rx="8" width="460" x="40" y="300"></rect>
              <text fill="#ffffff" font-size="13" text-anchor="middle" x="270" y="330">the watcher — the daemon, 1 s tick</text>
              <text fill="#b8b8b1" font-family="SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="middle" x="270" y="352">drivers' sources → PII filter → typed events → sinks</text>
              <text fill="#b8b8b1" font-family="SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="middle" x="270" y="372">presence sweep → workspace re-aggregate</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="270" y="398">drivers: adapters/&lt;name&gt;/ — loaded like kernel modules</text>
              <rect fill="#ece6f3" height="116" rx="8" stroke="#765b98" width="220" x="520" y="300"></rect>
              <text fill="#252525" font-size="12" text-anchor="middle" x="630" y="336">Argus daemon</text>
              <text fill="#765b98" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="630" y="356">session_telemetry providers</text>
              <text fill="#765b98" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="630" y="374">start_daemon / stop_daemon</text>
              <text fill="#765b98" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="630" y="398">own SQLite, read-only to kernel</text>

              
              <rect fill="#fff8ea" height="110" rx="10" stroke="#d98226" width="340" x="800" y="200"></rect>
              <text fill="#252525" font-size="12.5" text-anchor="middle" x="970" y="234">the profiler · Space Walk</text>
              <text fill="#d98226" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="970" y="256">separate Go binary — replays process history</text>
              <text fill="#d98226" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="middle" x="970" y="274">reads the same devices, zero coupling (§4.3)</text>

              
