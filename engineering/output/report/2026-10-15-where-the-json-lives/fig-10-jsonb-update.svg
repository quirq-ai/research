<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-label="Five steps for an UPDATE that calls jsonb_set to change one integer in a 40 kilobyte jsonb document. One: the whole value is detoasted, decompressed and rebuilt as a new 40 kilobyte value. Two: MVCC writes a new tuple version and marks the old one dead; this is a HOT update only if no indexed column changes and the page has room. Three: because the row exceeds the 2 kilobyte TOAST threshold, the new value is compressed with pglz or lz4 and stored out of line in new chunks of about 2 kilobytes. Four: WAL records cover the heap tuple, every new TOAST chunk and any index entries, with full-page images on the first touch of a page after a checkpoint. Five: the old tuple and old chunks remain until vacuum reclaims them. Below, the alternative: promote the hot counter to its own bigint column, so one update writes one narrow tuple and can be HOT."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="430.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-jsonb-update-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">UPDATE sessions SET body = jsonb_set(body, '{usage,input_tokens}', '42') WHERE id = $1</text>

                <rect fill="#e0ebf2" height="176" rx="6" stroke="#3c6f97" width="206" x="0" y="36"></rect>
                <text class="svg-num" x="12" y="60">1</text>
                <text class="svg-step" x="28" y="60">Rebuild the value</text>
                <text class="svg-sub" x="12" y="88">fetch all TOAST chunks</text>
                <text class="svg-sub" x="12" y="110">decompress 40 KB</text>
                <text class="svg-sub" x="12" y="132">set one integer</text>
                <text class="svg-sub" x="12" y="154">emit a new 40 KB jsonb</text>
                <text class="svg-note" x="12" y="192">8 bytes of meaning</text>

                <rect fill="#ece6f3" height="176" rx="6" stroke="#765b98" width="206" x="228" y="36"></rect>
                <text class="svg-num" x="240" y="60">2</text>
                <text class="svg-step" x="256" y="60">New tuple version</text>
                <text class="svg-sub" x="240" y="88">MVCC: never in place</text>
                <text class="svg-sub" x="240" y="110">old tuple gets xmax</text>
                <text class="svg-sub" x="240" y="132">HOT only if no indexed</text>
                <text class="svg-sub" x="240" y="154">column changed and</text>
                <text class="svg-sub" x="240" y="176">the page has room</text>

                <rect fill="#f7e3c8" height="176" rx="6" stroke="#d98226" width="206" x="456" y="36"></rect>
                <text class="svg-num" x="468" y="60">3</text>
                <text class="svg-step" x="484" y="60">TOAST</text>
                <text class="svg-sub" x="468" y="88">row &gt; 2 kB threshold</text>
                <text class="svg-sub" x="468" y="110">compress: pglz or lz4</text>
                <text class="svg-sub" x="468" y="132">still wide: out of line</text>
                <text class="svg-sub" x="468" y="154">~2 kB chunks, all new</text>
                <text class="svg-note" x="468" y="192">≤ 20 chunks uncompressed</text>

                <rect fill="#f3dfdc" height="176" rx="6" stroke="#ad4b43" width="206" x="684" y="36"></rect>
                <text class="svg-num" x="696" y="60">4</text>
                <text class="svg-step" x="712" y="60">WAL</text>
                <text class="svg-sub" x="696" y="88">heap tuple record</text>
                <text class="svg-sub" x="696" y="110">+ every new chunk</text>
                <text class="svg-sub" x="696" y="132">+ index entries</text>
                <text class="svg-sub" x="696" y="154">full-page image on the</text>
                <text class="svg-sub" x="696" y="176">first touch after ckpt</text>

                <rect fill="#f7f7f5" height="176" rx="6" stroke="#b8b8b1" width="208" x="912" y="36"></rect>
                <text class="svg-num" x="924" y="60">5</text>
                <text class="svg-step" x="940" y="60">Dead versions</text>
                <text class="svg-sub" x="924" y="88">old tuple and old</text>
                <text class="svg-sub" x="924" y="110">chunks stay on disk</text>
                <text class="svg-sub" x="924" y="132">until autovacuum</text>
                <text class="svg-sub" x="924" y="154">long transactions</text>
                <text class="svg-sub" x="924" y="176">delay reclaim</text>

                <g fill="none" marker-end="url(#fig-jsonb-update-arr)" stroke="#252525" stroke-width="2.4">
                  <path d="M206 124 L226 124"></path>
                  <path d="M434 124 L454 124"></path>
                  <path d="M662 124 L682 124"></path>
                  <path d="M890 124 L910 124"></path>
                </g>

                <text class="svg-lane" x="0" y="250">WHAT ONE EDIT WRITES · SCHEMATIC, NOT TO SCALE</text>
                <rect fill="#e0ebf2" height="22" rx="3" stroke="#3c6f97" width="60" x="0" y="262"></rect>
                <text class="svg-sub" x="72" y="278">the change: one bigint</text>
                <rect fill="#f7e3c8" height="22" rx="3" stroke="#d98226" width="840" x="0" y="294"></rect>
                <text class="svg-sub" x="852" y="310">compressed 40 KB value</text>
                <rect fill="#f3dfdc" height="22" rx="3" stroke="#ad4b43" width="960" x="0" y="326"></rect>
                <text class="svg-sub" x="972" y="342">+ WAL for it</text>

                <rect fill="#dfede5" height="58" rx="8" stroke="#367f59" width="1120" x="0" y="366"></rect>
                <text class="svg-lane" x="16" y="388">THE ALTERNATIVE · PROMOTE THE HOT FIELD</text>
                <text class="svg-sub" x="16" y="410">UPDATE sessions SET input_tokens = input_tokens + 1: one narrow tuple, TOAST untouched, HOT if the column is not indexed</text>
              </svg>
