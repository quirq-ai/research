<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 566" role="img" aria-label="Two panels. A: the entropy of a coin in bits per toss as a function of p, the probability of heads, rising from 0 at p = 0 to 1 bit at p = 0.5 and falling back to 0 at p = 1; marked points: p = 0.5 gives 1 bit, p = 0.9 gives 0.469 bits, p = 0.99 gives 0.081 bits, so 1,000 tosses at p = 0.9 hold about 469 bits. B: bits per byte for seven measured files, given as order-0 entropy, then gzip -9, zstd -19 and xz -9. JSON, 518,267 bytes: 4.76, 0.70, 0.56, 0.55; JSON Lines log, 4,194,211 bytes: 4.78, 0.80, 0.57, 0.54; Python source, 4,767,935 bytes: 4.57, 1.95, 1.55, 1.53; Dickens prose, 10,192,446 bytes: 4.53, 3.03, 2.24, 2.22; ELF binary, 7,477,160 bytes: 6.05, 3.23, 2.73, 2.55; random bytes, 1,048,576 bytes: 8.00, 8.00, 8.00, 8.00; silesia.zip head, 4,194,304 bytes: 8.00, 8.00, 8.00, 8.00. Every structured file compresses well below its order-0 entropy; random and already-compressed bytes stay at 8 bits per byte under every compressor."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
