<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-label="A loop. Inputs from the command line, stdin, the inbox socket, channels, background task notifications and scheduled tasks enter a queue. A message leaves the queue, passes UserPromptSubmit, and becomes a model request. The streamed response is appended one content block per record. If it asks for tools, each call passes PreToolUse and the permission pipeline, runs, and passes PostToolUse; after the batch, PostToolBatch fires and the results go back into the next model request. When the response asks for no tools, the Stop hook runs and a result message ends the turn. Side exits: interrupt, API failure with StopFailure, and compaction."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1080.0" height="420.0" fill="#ffffff"/>
                <defs>
                  <marker id="ftl-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#252525"/></marker>
                  <marker id="ftl-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6f97"/></marker>
                  <marker id="ftl-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#765b98"/></marker>
                </defs>

                <text x="16" y="24" class="svg-lane">INPUTS</text>
                <text x="16" y="46" class="svg-sub">argv prompt</text>
                <text x="16" y="64" class="svg-sub">stdin user line</text>
                <text x="16" y="82" class="svg-sub">inbox socket post</text>
                <text x="16" y="100" class="svg-sub">channel event</text>
                <text x="16" y="118" class="svg-sub">task notification</text>
                <text x="16" y="136" class="svg-sub">scheduled task fire</text>
                <line x1="146" y1="90" x2="176" y2="90" stroke="#3c6f97" stroke-width="1.5" marker-end="url(#ftl-b)"/>

                <rect x="180" y="58" width="150" height="66" rx="8" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="192" y="80" class="svg-step">Input queue</text>
                <text x="192" y="98" class="svg-sub">priority now, next,</text>
                <text x="192" y="114" class="svg-sub">later</text>

                <rect x="360" y="58" width="160" height="66" rx="8" fill="#ece6f3" stroke="#765b98"/>
                <text x="372" y="80" class="svg-step">UserPromptSubmit</text>
                <text x="372" y="98" class="svg-sub">may block the prompt</text>
                <text x="372" y="114" class="svg-sub">or add context</text>

                <rect x="550" y="58" width="190" height="66" rx="8" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="562" y="80" class="svg-step">Model request</text>
                <text x="562" y="98" class="svg-sub">recorded prompt, tools,</text>
                <text x="562" y="114" class="svg-sub">history; effort</text>

                <rect x="770" y="58" width="190" height="66" rx="8" fill="#e0ebf2" stroke="#3c6f97"/>
                <text x="782" y="80" class="svg-step">Streamed response</text>
                <text x="782" y="98" class="svg-sub">one record per content</text>
                <text x="782" y="114" class="svg-sub">block; stream_event</text>

                <line x1="330" y1="91" x2="356" y2="91" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <line x1="520" y1="91" x2="546" y2="91" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <line x1="740" y1="91" x2="766" y2="91" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>

                <path d="M 865 126 L 865 170" fill="none" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <text x="874" y="154" class="svg-sub">tool_use?</text>

                <rect x="770" y="174" width="190" height="66" rx="8" fill="#ece6f3" stroke="#765b98"/>
                <text x="782" y="196" class="svg-step">PreToolUse</text>
                <text x="782" y="214" class="svg-sub">then the permission</text>
                <text x="782" y="230" class="svg-sub">pipeline, per call</text>

                <rect x="550" y="174" width="190" height="66" rx="8" fill="#f7f7f5" stroke="#b8b8b1"/>
                <text x="562" y="196" class="svg-step">Run the tools</text>
                <text x="562" y="214" class="svg-sub">parallel when possible;</text>
                <text x="562" y="230" class="svg-sub">subagents nest a loop</text>

                <rect x="330" y="174" width="190" height="66" rx="8" fill="#ece6f3" stroke="#765b98"/>
                <text x="342" y="196" class="svg-step">PostToolUse, Batch</text>
                <text x="342" y="214" class="svg-sub">per call, then once</text>
                <text x="342" y="230" class="svg-sub">for the whole batch</text>

                <line x1="768" y1="207" x2="744" y2="207" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <line x1="548" y1="207" x2="524" y2="207" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <path d="M 425 172 C 425 146, 600 150, 620 128" fill="none" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <text x="236" y="160" class="svg-sub">results as user records</text>

                <path d="M 962 91 L 1000 91 L 1000 300 L 964 300" fill="none" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>
                <text x="1006" y="200" class="svg-sub">no tools</text>

                <rect x="770" y="268" width="190" height="66" rx="8" fill="#ece6f3" stroke="#765b98"/>
                <text x="782" y="290" class="svg-step">Stop hook</text>
                <text x="782" y="308" class="svg-sub">may send Claude back</text>
                <text x="782" y="324" class="svg-sub">to work</text>

                <rect x="550" y="268" width="190" height="66" rx="8" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>
                <text x="562" y="290" class="svg-step">result message</text>
                <text x="562" y="308" class="svg-sub">usage, cost, num_turns,</text>
                <text x="562" y="324" class="svg-sub">permission_denials</text>
                <line x1="768" y1="301" x2="744" y2="301" stroke="#252525" stroke-width="2.2" marker-end="url(#ftl-k)"/>

                <text x="16" y="286" class="svg-lane">SIDE EXITS</text>
                <text x="16" y="308" class="svg-sub">interrupt: control request, SIGINT</text>
                <text x="16" y="326" class="svg-sub">SIGTERM: turn left unfinished</text>
                <text x="16" y="344" class="svg-sub">API error: retries, then StopFailure</text>
                <text x="16" y="362" class="svg-sub">budget or max-turns: error result</text>
                <text x="16" y="380" class="svg-sub">defer (-p): exit at one tool call</text>

                <rect x="330" y="360" width="410" height="48" rx="8" fill="#ffffff" stroke="#765b98" stroke-dasharray="5 4"/>
                <text x="342" y="380" class="svg-step">Compaction, when the window fills</text>
                <text x="342" y="398" class="svg-sub">PreCompact, summary, compact_boundary, PostCompact</text>
                <path d="M 535 358 L 535 118 L 546 118" fill="none" stroke="#765b98" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ftl-p)"/>
              </svg>
