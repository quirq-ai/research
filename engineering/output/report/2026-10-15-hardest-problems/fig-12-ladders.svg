<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" role="img" aria-label="Two vertical ladders side by side: ordinals on the left, cardinals on the right, with two to the power aleph-null floating between them and dashed arrows to several possible rungs"><style>.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }
.svg-hd { font: 700 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.09em; }
.svg-big { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }</style><rect x="0.0" y="0.0" width="1000.0" height="476.0" fill="#ffffff"/>
                <text class="svg-hd" x="40" y="34">ORDINALS — WHAT ORDER</text>
                <text class="svg-hd" x="700" y="34">CARDINALS — HOW MANY</text>

                <line stroke="#252525" stroke-width="1.4" x1="150" x2="150" y1="384" y2="56"></line>
                <polyline fill="none" points="146,66 150,52 154,66" stroke="#252525" stroke-width="1.4"></polyline>

                <line stroke="#252525" stroke-width="1.6" x1="140" x2="160" y1="376" y2="376"></line>
                <text class="svg-step" x="176" y="381">0, 1, 2, 3, …</text>
                <line stroke="#252525" stroke-width="1.6" x1="140" x2="160" y1="340" y2="340"></line>
                <text class="svg-step" x="176" y="345">ω</text>
                <text class="svg-sub" x="206" y="345">first thing after all of them</text>
                <line stroke="#252525" stroke-width="1.6" x1="140" x2="160" y1="304" y2="304"></line>
                <text class="svg-step" x="176" y="309">ω + 1, ω + 2, …</text>
                <line stroke="#252525" stroke-width="1.6" x1="140" x2="160" y1="268" y2="268"></line>
                <text class="svg-step" x="176" y="273">ω · 2,  ω²,  ω^ω</text>
                <line stroke="#252525" stroke-width="1.6" x1="140" x2="160" y1="232" y2="232"></line>
                <text class="svg-step" x="176" y="237">ε₀</text>
                <text class="svg-sub" x="206" y="237">where Peano arithmetic stops</text>
                <line stroke="#252525" stroke-width="1.6" x1="140" x2="160" y1="196" y2="196"></line>
                <text class="svg-sub" x="176" y="201">⋮   every countable ordinal</text>
                <line stroke="#d98226" stroke-width="2.4" x1="140" x2="160" y1="140" y2="140"></line>
                <text class="svg-step" x="176" y="145">ω₁</text>
                <text class="svg-sub" x="206" y="145">the first uncountable one</text>

                <path d="M120 380 L108 380 L108 200 L120 200" fill="none" stroke="#367f59" stroke-width="1.2"></path>
                <text class="svg-note" text-anchor="middle" transform="rotate(-90 96 290)" x="96" y="290">all countable</text>

                <line stroke="#252525" stroke-width="1.4" x1="810" x2="810" y1="384" y2="56"></line>
                <polyline fill="none" points="806,66 810,52 814,66" stroke="#252525" stroke-width="1.4"></polyline>

                <line stroke="#252525" stroke-width="1.6" x1="800" x2="820" y1="376" y2="376"></line>
                <text class="svg-step" x="836" y="381">ℵ₀</text>
                <text class="svg-sub" x="874" y="381">= |ℕ| = |ℚ|</text>
                <line stroke="#252525" stroke-width="1.6" x1="800" x2="820" y1="308" y2="308"></line>
                <text class="svg-step" x="836" y="313">ℵ₁</text>
                <text class="svg-sub" x="874" y="313">= |ω₁|</text>
                <line stroke="#252525" stroke-width="1.6" x1="800" x2="820" y1="240" y2="240"></line>
                <text class="svg-step" x="836" y="245">ℵ₂</text>
                <line stroke="#252525" stroke-width="1.6" x1="800" x2="820" y1="172" y2="172"></line>
                <text class="svg-step" x="836" y="177">ℵ₃, ℵ₄, …</text>
                <line stroke="#ad4b43" stroke-width="1.6" x1="800" x2="820" y1="112" y2="112"></line>
                <text class="svg-step" x="836" y="117">ℵ</text>
                <text class="svg-sub" x="850" y="121">ω</text>

                <rect fill="#f7e3c8" height="88" rx="10" stroke="#d98226" stroke-width="2" width="236" x="512" y="196"></rect>
                <text class="svg-hd" text-anchor="middle" x="630" y="224">THE CONTINUUM</text>
                <text class="svg-big" text-anchor="middle" x="630" y="252">2^ℵ₀ = |ℝ|</text>
                <text class="svg-sub" text-anchor="middle" x="630" y="272">WHICH RUNG IS THIS?</text>

                <path d="M748 264 L795 308" fill="none" stroke="#d98226" stroke-dasharray="5 4" stroke-width="1.3"></path>
                <path d="M748 240 L795 240" fill="none" stroke="#d98226" stroke-dasharray="5 4" stroke-width="1.3"></path>
                <path d="M748 220 L795 174" fill="none" stroke="#d98226" stroke-dasharray="5 4" stroke-width="1.3"></path>
                <path d="M748 206 L795 114" fill="none" stroke="#ad4b43" stroke-dasharray="5 4" stroke-width="1.3"></path>
                <line stroke="#ad4b43" stroke-width="2.2" x1="762" x2="780" y1="150" y2="168"></line>
                <line stroke="#ad4b43" stroke-width="2.2" x1="780" x2="762" y1="150" y2="168"></line>

                <line stroke="#deded9" x1="40" x2="960" y1="404" y2="404"></line>
                <text class="svg-note" x="40" y="428">Consistent with ZFC: 2^ℵ₀ = ℵ₁ — that is CH — or ℵ₂, or ℵ₃, or ℵ₁₇. Ruled out: ℵ_ω, by König's theorem. That single exclusion is the whole of what is known.</text>
                <text class="svg-note" x="40" y="448">Gödel, 1938: ZFC cannot refute CH. Cohen, 1963: ZFC cannot prove it. Levy–Solovay, 1967: no large cardinal axiom decides it either — the axioms that settle</text>
                <text class="svg-note" x="40" y="468">vast tracts of descriptive set theory are provably useless here. Sixty-three years on, the dashed arrow has not been narrowed by a single rung.</text>
              </svg>
