                <text class="svg-sub" x="820" y="365">and search set to Fallback (§09)</text>

                <text class="svg-note" x="10" y="396">A lookup tries the exact key at each element, then Fallback (cache-map.ts:4-66). Unread params become Fallback only with experimental.varyParams on,</text>
                <text class="svg-note" x="10" y="412">a params report present, and a payload that is not a Full prefetch (cache.ts:3476-3573). A layout's vary path has no search slot, so ?q= never splits it.</text>

