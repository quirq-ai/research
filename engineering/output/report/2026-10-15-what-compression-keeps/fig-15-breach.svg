<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="A synthetic 2,008-byte HTML inbox page holds a secret CSRF token, 32 hex characters, in its sign-out link after csrf_token=, and its search results line reflects the attacker's input, csrf_token= followed by a 32-character guess. When the leading characters of the guess are right, one LZ77 back-reference from the reflected text to the link covers csrf_token= plus those characters. Three guesses with their compressed sizes (raw DEFLATE level 6, brotli quality 5, zstd level 3): 0 right characters, 737, 629 and 780 bytes; 16 right, 725, 618 and 771; all 32 right, 711, 603 and 757. A line chart plots bytes saved against the guess with no right characters, for 0, 1, 2, 4, 8, 12, 16, 20, 24, 28 and 32 right characters: DEFLATE 0, 1, 2, 3, 6, 9, 12, 16, 20, 23, 26; brotli 0, 0, 1, 2, 6, 9, 11, 16, 21, 22, 26; zstd 0, 0, 1, 2, 4, 7, 9, 13, 18, 21, 23. With the token masked afresh in every response, DEFLATE sizes are 762, 760, 761, 759, 761 bytes for 0, 8, 16, 24 and 32 right characters, with no trend. Guessing one character at a time with 16 candidates per position, the right character was uniquely shortest, tied for shortest or beaten at 13, 19, 0 of 32 positions under DEFLATE, 10, 18, 4 under brotli and 10, 17, 5 under zstd."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="400.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-breach-blu" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="16">ONE RESPONSE · 2,008 BYTES · SYNTHETIC</text>
                <rect fill="#f7f7f5" height="104" rx="6" stroke="#deded9" width="1120" x="0" y="28"></rect>
                <text class="svg-sub" x="16" y="58">&lt;a class="signout" href="/logout?csrf_token=<tspan style="fill: #ad4b43; font-weight: 700">d1caced813ca27e49ef98529634aceab</tspan>"&gt;Sign out&lt;/a&gt;</text>
                <text class="svg-sub" x="16" y="116">&lt;p class="empty"&gt;No messages match &lt;b&gt;csrf_token=<tspan style="fill: #367f59; font-weight: 700">d1caced813ca27e4</tspan><tspan style="fill: #252525">wwpkhhyzslsjospo</tspan>&lt;/b&gt;. Try a different search.&lt;/p&gt;</text>
                <text class="svg-note" x="760" y="58">the secret: a CSRF token, 32 hex characters</text>
                <text class="svg-note" x="900" y="116">the attacker’s guess, reflected</text>
                <path d="M286.9 103 C286.9 82 255.4 84 255.4 64" fill="none" marker-end="url(#fig-breach-blu)" stroke="#3c6f97" stroke-width="1.4"></path>
                <text class="svg-sub" style="fill: #3c6f97" x="300.9" y="90">one back-reference: csrf_token= plus the right characters</text>
                <text class="svg-lane" x="0" y="166">THREE GUESSES</text>
                <text class="svg-lane" text-anchor="end" x="476" y="166">DEFLATE-6</text>
                <text class="svg-lane" text-anchor="end" x="552" y="166">BROTLI-5</text>
