<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 731" role="img" aria-label="Horizontal bar chart on one linear axis from 0 to 130 MB, where 1 MB is 10 to the 6 bytes: one synthetic table of 1,000,000 rows and 14 columns stored 26 ways. CSV: no codec 124.5 MB; gzip -6 36.3; zstd 3 37.8; zstd 19 30.5; a full read takes about 1 second. Parquet from pyarrow 26.0.0, with dictionary encoding on and then off: no codec 38.6 and 115.2; snappy, pyarrow's default, 32.6 and 47.0; LZ4_RAW 33.3 and 49.1; gzip 24.7 and 27.5; zstd 1 23.8 and 30.1; zstd 3 23.5 and 29.8; zstd 9 23.1 and 26.4; zstd 3 with DELTA_BINARY_PACKED on ts and user_id 22.8, the smallest file; zstd 3 with BYTE_STREAM_SPLIT on price and latency_ms 28.2; a tuned layout with an encoding per column 26.9 at zstd 3 and 26.7 at zstd 9; full reads take 0.2 to 0.5 seconds. Arrow IPC: uncompressed 127.7 and LZ4, Feather's default, 67.9, both read in under 0.1 seconds; zstd at Arrow's default level 1 44.6 and at level 3 43.7, read in 0.2 to 0.5 seconds. A dashed line marks CSV with gzip -6. Grey is CSV without a codec, blue CSV with a codec, green Parquet with dictionary encoding, a dashed green outline Parquet without it, purple Arrow IPC."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }</style><rect x="0.0" y="0.0" width="1120.0" height="731.0" fill="#ffffff"/>
