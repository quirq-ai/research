<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-label="On the left, the agent-environment loop: the agent observes a state and reward, chooses an action, and the environment applies the transition kernel. A note says that fixing a policy turns the MDP back into an ordinary Markov chain. On the right, the Bellman backup tree: a state node branches over two actions, each action branches over outcome states with probabilities, and the value is the maximum over actions of the expectation over outcomes."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="380.0" fill="#ffffff"/>
                <defs>
                  <marker id="mdp-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="mdp-arr-b" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>
                <text class="svg-lane" x="0" y="18">THE LOOP</text>
                <rect fill="#e0ebf2" height="60" rx="10" stroke="#3c6f97" stroke-width="1.8" width="180" x="70" y="50"></rect>
                <text class="svg-step" text-anchor="middle" x="160" y="86">Agent · policy π</text>
                <rect fill="#dfede5" height="60" rx="10" stroke="#367f59" stroke-width="1.8" width="180" x="70" y="230"></rect>
                <text class="svg-step" text-anchor="middle" x="160" y="258">Environment</text>
                <text class="svg-sub" text-anchor="middle" x="160" y="278">P(s′ | s, a)</text>
                <path d="M250 76 C 330 76 330 244 256 254" fill="none" marker-end="url(#mdp-arr)" stroke="#252525" stroke-width="2.2"></path>
                <text class="svg-sub" x="286" y="150">action a</text>
                <path d="M70 262 C 12 258 12 92 66 86" fill="none" marker-end="url(#mdp-arr-b)" stroke="#3c6f97" stroke-width="2.2"></path>
                <text class="svg-sub" style="fill:#3c6f97" x="16" y="150">s′, r</text>
                <rect fill="#f7e3c8" height="58" rx="8" stroke="#d98226" width="330" x="0" y="312"></rect>
                <text class="svg-note" x="14" y="336">Fix π and P(s′ | s, π(s)) is an ordinary transition</text>
                <text class="svg-note" x="14" y="356">matrix. Every policy is a Markov chain.</text>

                <line stroke="#deded9" x1="380" x2="380" y1="10" y2="380"></line>

                <text class="svg-lane" x="410" y="18">ONE BELLMAN BACKUP</text>
                <circle cx="470" cy="120" fill="#ffffff" r="26" stroke="#252525" stroke-width="2"></circle>
                <text class="svg-step" text-anchor="middle" x="470" y="126">s</text>
                <text class="svg-sub" x="410" y="70">V(s) =</text>

                <line marker-end="url(#mdp-arr)" stroke="#252525" stroke-width="2" x1="496" x2="586" y1="106" y2="70"></line>
                <line marker-end="url(#mdp-arr)" stroke="#252525" stroke-width="2" x1="496" x2="586" y1="134" y2="190"></line>
                <text class="svg-sub" x="516" y="80">a₁</text>
                <text class="svg-sub" x="516" y="180">a₂</text>

                <rect fill="#f7e3c8" height="42" rx="6" stroke="#d98226" width="52" x="592" y="46"></rect>
                <text class="svg-sub" text-anchor="middle" x="618" y="72">Q(s,a₁)</text>
                <rect fill="#f7e3c8" height="42" rx="6" stroke="#d98226" width="52" x="592" y="170"></rect>
                <text class="svg-sub" text-anchor="middle" x="618" y="196">Q(s,a₂)</text>

                <line marker-end="url(#mdp-arr-b)" stroke="#3c6f97" stroke-width="1.6" x1="644" x2="742" y1="56" y2="40"></line>
                <line marker-end="url(#mdp-arr-b)" stroke="#3c6f97" stroke-width="1.6" x1="644" x2="742" y1="78" y2="104"></line>
                <line marker-end="url(#mdp-arr-b)" stroke="#3c6f97" stroke-width="1.6" x1="644" x2="742" y1="180" y2="160"></line>
                <line marker-end="url(#mdp-arr-b)" stroke="#3c6f97" stroke-width="1.6" x1="644" x2="742" y1="202" y2="226"></line>
                <text class="svg-sub" style="fill:#3c6f97" x="668" y="36">0.8</text>
                <text class="svg-sub" style="fill:#3c6f97" x="668" y="110">0.2</text>
                <text class="svg-sub" style="fill:#3c6f97" x="668" y="156">0.5</text>
                <text class="svg-sub" style="fill:#3c6f97" x="668" y="232">0.5</text>

                <circle cx="768" cy="36" fill="#e0ebf2" r="20" stroke="#3c6f97"></circle><text class="svg-sub" text-anchor="middle" x="768" y="42">s′</text>
                <circle cx="768" cy="108" fill="#e0ebf2" r="20" stroke="#3c6f97"></circle><text class="svg-sub" text-anchor="middle" x="768" y="114">s′</text>
                <circle cx="768" cy="156" fill="#e0ebf2" r="20" stroke="#3c6f97"></circle><text class="svg-sub" text-anchor="middle" x="768" y="162">s′</text>
                <circle cx="768" cy="230" fill="#e0ebf2" r="20" stroke="#3c6f97"></circle><text class="svg-sub" text-anchor="middle" x="768" y="236">s′</text>

                <text class="svg-sub" style="fill:#3c6f97" x="812" y="72">expectation — the world's move</text>
                <text class="svg-note" x="812" y="96">Σ P(s′|s,a) [ R + γV(s′) ]</text>
                <text class="svg-sub" x="812" y="176">maximum — your move</text>
                <text class="svg-note" x="812" y="200">V(s) = max over a of Q(s,a)</text>

                <rect fill="#f7f7f5" height="84" rx="8" stroke="#deded9" width="700" x="406" y="286"></rect>
                <text class="svg-sub" x="422" y="312">The backup operator is a γ-contraction in sup-norm: ‖TV − TU‖ ≤ γ‖V − U‖.</text>
                <text class="svg-sub" x="422" y="336">So it has exactly one fixed point, and iterating from anywhere converges to it</text>
                <text class="svg-sub" x="422" y="360">geometrically at rate γ — the same argument as the spectral gap in §3.</text>
              </svg>
