<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" role="img" aria-label="Grouped horizontal bars on one byte axis from 0 to 500,000, for route / of the E2 boundary app built with Turbopack, three variants per group. First-load JS from route-bundle-stats: leaf 464,114, layout-top 502,603 (plus 38,489), page-top 505,869 (plus 41,755); the framework floor on /bare is 463,816. HTML document: leaf 200,807 (gzip 23,707), layout-top 87,754 (gzip 11,299, minus 56 percent), page-top 180,671 (gzip 22,169). Inline self.__next_f flight data in that HTML, in characters: 136,601, 23,892 and 116,521. RSC payload: leaf 119,482 (gzip 14,831), layout-top 21,174 (gzip 2,742, minus 82 percent), page-top 101,548 (gzip 13,430)."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="516.0" fill="#ffffff"/>
