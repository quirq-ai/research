<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="A loop represented as a graph with REGION, PHI, ADD, test, IF and projections"><style>.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="400.0" fill="#ffffff"/>
              
              <g fill="none" stroke="#252525" stroke-width="2.4">
                <polyline points="520,336 40,336 40,150 100,150"></polyline>
                <line x1="150" x2="150" y1="88" y2="122"></line>
                <polyline points="150,166 150,250 620,250 620,278"></polyline>
                <line x1="650" x2="590" y1="310" y2="336"></line>
                <line x1="700" x2="770" y1="310" y2="336"></line>
              </g>
              
              <g fill="none" stroke="#3c6f97" stroke-width="1.3">
                <line x1="330" x2="330" y1="88" y2="122"></line>
                <line x1="260" x2="300" y1="144" y2="144"></line>
                <line x1="420" x2="460" y1="144" y2="144"></line>
                <line x1="560" x2="530" y1="88" y2="122"></line>
                <line x1="620" x2="660" y1="144" y2="144"></line>
                <line x1="700" x2="700" y1="166" y2="278"></line>
                <polyline points="530,166 530,206 350,206 350,166"></polyline>
              </g>

              <rect fill="#ffffff" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="100" x="100" y="56"></rect>
              <text class="svg-step" text-anchor="middle" x="150" y="77">START</text>
              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="120" x="270" y="56"></rect>
              <text class="svg-sub" text-anchor="middle" x="330" y="77">initial data  i0</text>
              <rect fill="#e0ebf2" height="32" rx="6" stroke="#3c6f97" width="100" x="510" y="56"></rect>
              <text class="svg-step" text-anchor="middle" x="560" y="77">1</text>

              <rect fill="#ffffff" height="44" rx="7" stroke="#252525" stroke-width="1.8" width="160" x="100" y="122"></rect>
              <text class="svg-step" text-anchor="middle" x="180" y="150">REGION</text>

              <rect fill="#e0ebf2" height="44" rx="7" stroke="#3c6f97" stroke-width="1.8" width="120" x="300" y="122"></rect>
              <text class="svg-step" text-anchor="middle" x="360" y="150">PHI  i1</text>

              <rect fill="#f7e3c8" height="44" rx="7" stroke="#d98226" stroke-width="1.8" width="120" x="460" y="122"></rect>
              <text class="svg-step" text-anchor="middle" x="520" y="150">ADD  i2</text>

              <rect fill="#e0ebf2" height="44" rx="7" stroke="#3c6f97" width="120" x="620" y="122"></rect>
              <text class="svg-step" text-anchor="middle" x="680" y="150">test  cc</text>

              <rect fill="#ffffff" height="32" rx="6" stroke="#252525" stroke-width="1.8" width="120" x="620" y="278"></rect>
              <text class="svg-step" text-anchor="middle" x="680" y="299">IF</text>

              <rect fill="#dfede5" height="32" rx="6" stroke="#367f59" stroke-width="1.4" width="140" x="520" y="336"></rect>
              <text class="svg-sub" text-anchor="middle" x="590" y="357">PROJ true</text>
              <rect fill="#f3dfdc" height="32" rx="6" stroke="#ad4b43" stroke-width="1.4" width="140" x="700" y="336"></rect>
              <text class="svg-sub" text-anchor="middle" x="770" y="357">PROJ false</text>

              <text class="svg-num" x="52" y="240">loop-back control</text>
              <text class="svg-num" x="360" y="222">i2, back into the PHI</text>
              <text class="svg-sub" x="860" y="357">→ loop exit control</text>
              <text class="svg-sub" x="770" y="150">→ loop exit data (i2)</text>

              <line stroke="#deded9" x1="40" x2="1080" y1="382" y2="382"></line>
              <text class="svg-note" x="40" y="400">No block heads the loop. A REGION merges entry control with the back edge; a PHI merges the entry value with the value coming around.</text>
            </svg>
