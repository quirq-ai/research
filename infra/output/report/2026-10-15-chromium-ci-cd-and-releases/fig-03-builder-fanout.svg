      <line marker-end="url(#fig-builder-fanout-arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="300" x2="350" y1="250" y2="224"></line>
      <line marker-end="url(#fig-builder-fanout-arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="300" x2="350" y1="388" y2="260"></line>
      <line marker-end="url(#fig-builder-fanout-arr-ink)" stroke="#252525" stroke-width="2.5" x1="530" x2="600" y1="200" y2="140"></line>
      <line marker-end="url(#fig-builder-fanout-arr-ink)" stroke="#252525" stroke-width="2.5" x1="530" x2="600" y1="248" y2="270"></line>

      <text class="svg-lane" x="600" y="376">AT RUN TIME · ON ONE SWARMING BOT</text>
      <rect fill="#ffffff" height="44" rx="8" stroke="#252525" width="400" x="600" y="392"></rect>
      <text class="svg-step" x="616" y="410">bbagent</text>
      <text class="svg-sub" x="616" y="428">LogDog butler · merges build.proto</text>
