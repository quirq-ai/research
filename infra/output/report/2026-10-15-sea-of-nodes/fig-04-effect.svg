<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-label="An effect chain linking two stores and a load"><style>.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="190.0" fill="#ffffff"/>
              <g fill="none" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.8">
                <line x1="180" x2="290" y1="76" y2="76"></line>
                <line x1="430" x2="540" y1="76" y2="76"></line>
                <line x1="680" x2="790" y1="76" y2="76"></line>
              </g>
              <rect fill="#f7f7f5" height="32" rx="6" stroke="#252525" stroke-width="1.6" width="140" x="40" y="60"></rect>
              <text class="svg-step" text-anchor="middle" x="110" y="81">Start (effect)</text>

              <rect fill="#ece6f3" height="32" rx="6" stroke="#765b98" stroke-width="1.6" width="140" x="290" y="60"></rect>
              <text class="svg-step" text-anchor="middle" x="360" y="81">Store o.x = 1</text>

              <rect fill="#ece6f3" height="32" rx="6" stroke="#765b98" stroke-width="1.6" width="140" x="540" y="60"></rect>
              <text class="svg-step" text-anchor="middle" x="610" y="81">Store o.y = 2</text>

              <rect fill="#ece6f3" height="32" rx="6" stroke="#765b98" stroke-width="1.6" width="140" x="790" y="60"></rect>
              <text class="svg-step" text-anchor="middle" x="860" y="81">Load o.x</text>

              <line stroke="#deded9" x1="40" x2="960" y1="120" y2="120"></line>
              <text class="svg-note" x="40" y="146">The dashed chain is the only thing keeping these three in order — and it is also the thing an optimizer</text>
              <text class="svg-note" x="40" y="166">attacks. Prove that the load reads a slot the stores did not touch, and you may unhook it from the chain.</text>
            </svg>
