<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 1100 470" role="img" aria-label="A Gantt chart of Chrome milestones 152 through 160. Each milestone has a blue stabilisation bar from its branch point to its stable date, then a green stable bar. M152 runs four weeks from branch to stable; M153 and everything after run three weeks, starting two weeks apart, except M159 and M160, which are stretched around the holidays. A dashed orange seam marks 8 September 2026. Purple bars extend M152, M156 and M160 as extended stable. Beneath, a ruler of trunk BUILD numbers from 7977 to 8067 with the branch numbers called out, and a magnified week showing two bumps per weekday."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-8.0" width="1100.0" height="470.0" fill="#ffffff"/>
