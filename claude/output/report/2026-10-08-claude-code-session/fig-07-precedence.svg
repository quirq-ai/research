<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Five stacked layers from highest to lowest precedence: managed policy, the command line including the settings flag, the project's local settings file, the project's shared settings file, and the user's settings file, with built-in defaults below. Arrows mark the two layers a host can write for a single session: managed policy through the SDK's managedSettings, and the command line through a generated settings file. A side column notes that environment variables are not a layer and are decided pair by pair."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub  { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num  { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="960.0" height="400.0" fill="#ffffff"/>
                <defs>
                  <marker id="fpc-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d98226"/></marker>
                </defs>
                <text x="20" y="24" class="svg-lane">HIGHEST</text>
                <rect x="20" y="36" width="600" height="50" rx="8" fill="#f3dfdc" stroke="#ad4b43"/>
                <text x="36" y="58" class="svg-step">Managed policy</text>
                <text x="36" y="76" class="svg-sub">managed-settings.json, MDM, server-managed; SDK managedSettings</text>
                <rect x="20" y="94" width="600" height="50" rx="8" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>
                <text x="36" y="116" class="svg-step">Command line</text>
                <text x="36" y="134" class="svg-sub">flags for this launch; --settings &lt;file-or-json&gt; (max 2 MiB)</text>
                <rect x="20" y="152" width="600" height="50" rx="8" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="36" y="174" class="svg-step">Project, local</text>
                <text x="36" y="192" class="svg-sub">&lt;repo&gt;/.claude/settings.local.json: personal, saved approvals land here</text>
                <rect x="20" y="210" width="600" height="50" rx="8" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="36" y="232" class="svg-step">Project, shared</text>
                <text x="36" y="250" class="svg-sub">&lt;repo&gt;/.claude/settings.json: committed, runs its hooks under -p</text>
                <rect x="20" y="268" width="600" height="50" rx="8" fill="#ffffff" stroke="#b8b8b1"/>
                <text x="36" y="290" class="svg-step">User</text>
                <text x="36" y="308" class="svg-sub">~/.claude/settings.json, or $CLAUDE_CONFIG_DIR/settings.json</text>
                <rect x="20" y="326" width="600" height="36" rx="8" fill="#f7f7f5" stroke="#deded9" stroke-dasharray="4 3"/>
                <text x="36" y="349" class="svg-sub">built-in defaults</text>
                <text x="20" y="388" class="svg-lane">LOWEST</text>

                <line x1="760" y1="61" x2="626" y2="61" stroke="#d98226" stroke-width="2" marker-end="url(#fpc-o)"/>
                <text x="668" y="54" class="svg-sub">SDK host</text>
                <line x1="760" y1="119" x2="626" y2="119" stroke="#d98226" stroke-width="2" marker-end="url(#fpc-o)"/>
                <text x="668" y="112" class="svg-sub">any host</text>
                <text x="770" y="66" class="svg-note">ignored under admin</text>
                <text x="770" y="82" class="svg-note">policy by default</text>
                <text x="770" y="124" class="svg-note">the OS's rung</text>

                <rect x="680" y="170" width="260" height="188" rx="8" fill="#ffffff" stroke="#765b98" stroke-dasharray="5 4"/>
                <text x="694" y="194" class="svg-lane">NOT A RUNG</text>
                <text x="694" y="218" class="svg-sub">environment variables</text>
                <text x="694" y="238" class="svg-sub">decide pair by pair:</text>
                <text x="694" y="262" class="svg-sub">ANTHROPIC_MODEL beats every</text>
                <text x="694" y="280" class="svg-sub">file's "model";</text>
                <text x="694" y="304" class="svg-sub">ANTHROPIC_DEFAULT_MODEL</text>
                <text x="694" y="322" class="svg-sub">applies only if no file</text>
                <text x="694" y="340" class="svg-sub">sets one</text>
              </svg>
