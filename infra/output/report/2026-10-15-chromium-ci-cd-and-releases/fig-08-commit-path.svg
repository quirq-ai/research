      <path d="M726 316 L726 300 L766 300" fill="none" marker-end="url(#fig-commit-path-arr-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5"></path>
      <text class="svg-note" x="628" y="392">reuse_common.go:192–220 · equi.go:24–76</text>
      <path d="M624 55 L1042 55 L1042 340 L1065 340" fill="none" marker-end="url(#fig-commit-path-arr-ink)" stroke="#252525" stroke-width="2.5"></path>
      <text class="svg-note" text-anchor="end" x="1032" y="40">git cl try -b bypasses CV — git_cl.py:437–490</text>
      <line marker-end="url(#fig-commit-path-arr-ink)" stroke="#252525" stroke-width="2.5" x1="962" x2="962" y1="378" y2="406"></line>

      <text class="svg-note" x="175" y="466">thick black = control · thin blue = data · dashed purple = reuse, an effect on a previous run's builds</text>
