<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 684" role="img" aria-label="Timeline from 2001 to 2026 in three lanes, filled dots for spec releases and drafts, hollow dots for events outside the spec. JSON, built for data interchange: json.org 2001; RFC 4627 July 2006; Douglas Crockford's Google+ post explaining why JSON has no comments, 30 April 2012; RFC 7159 March 2014; RFC 8259 and ECMA-404 second edition December 2017, after which the grammar is unchanged while readers keep changing; Go 1.27 ships encoding/json/v2 on 19 August 2026. YAML, built for data serialisation: draft titled Yet Another Markup Language, May 2001; 1.0 January 2004; 1.1 January 2005; PyYAML and LibYAML 2006; 1.2.0 July 2009; 1.2.1 October 2009; 1.2.2 October 2021 with no normative changes; no YAML 1.3 as of October 2026. TOML, built for configuration: first draft 23 February 2013, whose claim that the YAML spec is 600 pages was corrected to 80 one hour and forty minutes later; 0.5.0 July 2018; 1.0.0 11 January 2021; Python 3.11 adds tomllib 24 October 2022; 1.1.0 18 December 2025. Inset bar chart of spec size in words, by whitespace split: ECMA-404 second edition 2,318; RFC 8259 3,998; YAML 1.1 25,216; YAML 1.2.2 21,953; TOML 1.0.0 3,980; TOML 1.1.0 4,221. YAML 1.2.2 is about 5.5 times TOML 1.0.0 or RFC 8259."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="684.0" fill="#ffffff"/>
