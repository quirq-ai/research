<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" role="img" aria-label="Left: the ten entries of resolveRoutes in order, five blue sentinels and five grey config lists: middleware_next_data, headers, redirects, middleware (Proxy), beforeFiles rewrites, before_files_end, check_fs, afterFiles rewrites, after files check: true, and fallback rewrites. A thick arrow shows /sec0/a/1 walking rows one to nine: the Proxy matcher does not match, check_fs misses, and check: true matches the 3rd of 119 patterns. Right, top: check_fs expanded as an 8 MiB LRU over six Sets probed in order: dev virtual files, _next/static, legacy static, public, appFiles, pageFiles; public beats app pages, and appFiles holds patterns, so the example misses. Right, middle: checkTrue as a left-to-right scan of 238 regexes, each of the 119 patterns listed twice: /gallery/(.)photo/[id] twice, no match; /gallery/photo/[id] twice, no match; /sec0/a/[id] matches on the 5th regex with id 1; 233 more not tried. Bottom: a bar chart of microseconds per lookup: Set.has under 0.1; 100 routes hit 5.8 and miss 8.0; 1,000 routes hit 85 and miss 168."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="604.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-resolve-routes-arr-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>

                <text class="svg-lane" x="20" y="20">RESOLVEROUTES · TEN ENTRIES, BUILT ONCE IN PRODUCTION</text>

                <line marker-end="url(#fig-resolve-routes-arr-ink)" stroke="#252525" stroke-width="2.5" x1="27" x2="27" y1="40" y2="300"></line>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="250" x="40" y="34"></rect>
                <text class="svg-num" x="50" y="51">1</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="51">middleware_next_data</text>

                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="250" x="40" y="66"></rect>
                <text class="svg-num" x="50" y="83">2</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="83">headers</text>

                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="250" x="40" y="98"></rect>
                <text class="svg-num" x="50" y="115">3</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="115">redirects</text>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="250" x="40" y="130"></rect>
                <text class="svg-num" x="50" y="147">4</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="147">middleware · Proxy</text>
                <text class="svg-sub" text-anchor="end" x="282" y="147">no match</text>

                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="250" x="40" y="162"></rect>
                <text class="svg-num" x="50" y="179">5</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="179">beforeFiles rewrites</text>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" width="250" x="40" y="194"></rect>
                <text class="svg-num" x="50" y="211">6</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="211">before_files_end</text>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" stroke-width="2" width="250" x="40" y="226"></rect>
                <text class="svg-num" x="50" y="243">7</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="243">check_fs</text>
                <text class="svg-sub" text-anchor="end" x="282" y="243">miss</text>

                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="250" x="40" y="258"></rect>
                <text class="svg-num" x="50" y="275">8</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="275">afterFiles rewrites</text>

                <rect fill="#e0ebf2" height="26" rx="4" stroke="#3c6f97" stroke-width="2" width="250" x="40" y="290"></rect>
                <text class="svg-num" x="50" y="307">9</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="307">after files check: true</text>
                <text class="svg-sub" style="fill:#367f59" text-anchor="end" x="282" y="307">3rd of 119</text>

                <rect fill="#f7f7f5" height="26" rx="4" stroke="#b8b8b1" width="250" x="40" y="322"></rect>
                <text class="svg-num" x="50" y="339">10</text>
                <text class="svg-sub" style="fill:#252525" x="66" y="339">fallback rewrites</text>

                <path d="M290 239 H340 V110 H360" fill="none" stroke="#b8b8b1" stroke-width="1.2"></path>
                <path d="M290 303 H346 V274 H360" fill="none" stroke="#b8b8b1" stroke-width="1.2"></path>

                <rect fill="#ffffff" height="152" rx="8" stroke="#b8b8b1" width="620" x="360" y="34"></rect>
                <text class="svg-step" x="374" y="54">check_fs → getItem(): exact match, six Sets in order</text>
                <rect fill="#ece6f3" height="24" rx="4" stroke="#765b98" width="592" x="374" y="64"></rect>
                <text class="svg-sub" style="fill:#252525" x="384" y="80">8 MiB LRU, production only · misses cached as notFound</text>

                <rect fill="#f7f7f5" height="46" rx="4" stroke="#b8b8b1" width="90" x="374" y="98"></rect>
                <text class="svg-num" x="382" y="111">1</text>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="419" y="125">devVirtual</text>
                <text class="svg-sub" text-anchor="middle" x="419" y="138">dev only</text>

                <rect fill="#f7f7f5" height="46" rx="4" stroke="#b8b8b1" width="90" x="474" y="98"></rect>
                <text class="svg-num" x="482" y="111">2</text>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="519" y="125">_next/static</text>
                <text class="svg-sub" text-anchor="middle" x="519" y="138">Set.has</text>

                <rect fill="#f7f7f5" height="46" rx="4" stroke="#b8b8b1" width="90" x="575" y="98"></rect>
                <text class="svg-num" x="583" y="111">3</text>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="620" y="125">static/</text>
                <text class="svg-sub" text-anchor="middle" x="620" y="138">legacy</text>

                <rect fill="#f7f7f5" height="46" rx="4" stroke="#b8b8b1" width="90" x="675" y="98"></rect>
                <text class="svg-num" x="683" y="111">4</text>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="720" y="125">public/</text>
                <text class="svg-sub" text-anchor="middle" x="720" y="138">beats app</text>

                <rect fill="#f7f7f5" height="46" rx="4" stroke="#b8b8b1" width="90" x="776" y="98"></rect>
                <text class="svg-num" x="784" y="111">5</text>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="821" y="125">appFiles</text>
                <text class="svg-sub" text-anchor="middle" x="821" y="138">patterns</text>

                <rect fill="#f7f7f5" height="46" rx="4" stroke="#b8b8b1" width="90" x="876" y="98"></rect>
                <text class="svg-num" x="884" y="111">6</text>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="921" y="125">pageFiles</text>
                <text class="svg-sub" text-anchor="middle" x="921" y="138">Set.has</text>

                <text class="svg-note" x="374" y="163">First hit wins: a public/ file shadows an app page with the same path.</text>
                <text class="svg-note" x="374" y="178">appFiles holds /sec0/a/[id], not /sec0/a/1, so the example misses all six.</text>

                <rect fill="#ffffff" height="148" rx="8" stroke="#b8b8b1" width="620" x="360" y="200"></rect>
                <text class="svg-step" x="374" y="220">check: true → checkTrue(): linear first-match scan</text>
                <text class="svg-sub" x="374" y="237">getItem() once more, then for…of over 238 regexes: 119 patterns, each twice</text>

                <rect fill="#f7f7f5" height="42" rx="4" stroke="#b8b8b1" width="170" x="374" y="248"></rect>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="459" y="265">/gallery/(.)photo/[id]</text>
                <text class="svg-sub" text-anchor="middle" x="459" y="281">×2, no match</text>

                <rect fill="#f7f7f5" height="42" rx="4" stroke="#b8b8b1" width="150" x="554" y="248"></rect>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="629" y="265">/gallery/photo/[id]</text>
                <text class="svg-sub" text-anchor="middle" x="629" y="281">×2, no match</text>

                <rect fill="#dfede5" height="42" rx="4" stroke="#367f59" stroke-width="2" width="120" x="714" y="248"></rect>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="774" y="265">/sec0/a/[id]</text>
                <text class="svg-sub" style="fill:#367f59" text-anchor="middle" x="774" y="281">{ id: '1' }</text>

                <rect fill="#ffffff" height="42" rx="4" stroke="#b8b8b1" stroke-dasharray="4 3" width="122" x="844" y="248"></rect>
                <text class="svg-sub" style="fill:#252525" text-anchor="middle" x="905" y="265">233 more</text>
                <text class="svg-sub" text-anchor="middle" x="905" y="281">not tried</text>

                <text class="svg-note" x="374" y="313">Tried left to right; the first regex that matches returns, so /sec0/a/[id] wins on the 5th.</text>
                <text class="svg-note" x="374" y="329">A URL that matches nothing tries all 238, which is why a miss costs more below.</text>

                <line stroke="#deded9" x1="20" x2="980" y1="364" y2="364"></line>
                <text class="svg-lane" x="20" y="386">INSET · MICROSECONDS PER LOOKUP, MEDIAN OF 7 × 10,000 (E6-MATCH.MJS)</text>

                <text class="svg-sub" style="fill:#252525" text-anchor="end" x="230" y="410">Set.has · static path</text>
                <line stroke="#252525" stroke-width="2" x1="240" x2="240" y1="398" y2="414"></line>
                <text class="svg-sub" style="fill:#252525" x="248" y="410">&lt; 0.1</text>

                <text class="svg-sub" style="fill:#252525" text-anchor="end" x="230" y="436">100 routes · hit</text>
                <rect fill="#dfede5" height="16" stroke="#367f59" width="20.7" x="240" y="424"></rect>
                <text class="svg-sub" style="fill:#252525" x="267" y="436">5.8</text>

                <text class="svg-sub" style="fill:#252525" text-anchor="end" x="230" y="462">100 routes · miss</text>
                <rect fill="#f3dfdc" height="16" stroke="#ad4b43" width="28.6" x="240" y="450"></rect>
                <text class="svg-sub" style="fill:#252525" x="275" y="462">8.0</text>

                <text class="svg-sub" style="fill:#252525" text-anchor="end" x="230" y="488">1,000 routes · hit</text>
                <rect fill="#dfede5" height="16" stroke="#367f59" width="303.6" x="240" y="476"></rect>
                <text class="svg-sub" style="fill:#252525" x="550" y="488">85</text>

                <text class="svg-sub" style="fill:#252525" text-anchor="end" x="230" y="514">1,000 routes · miss</text>
                <rect fill="#f3dfdc" height="16" stroke="#ad4b43" width="600" x="240" y="502"></rect>
                <text class="svg-sub" style="fill:#252525" x="847" y="514">168</text>

                <line stroke="#b8b8b1" x1="240" x2="840" y1="528" y2="528"></line>
                <line stroke="#b8b8b1" x1="240" x2="240" y1="528" y2="533"></line>
                <line stroke="#b8b8b1" x1="418.6" x2="418.6" y1="528" y2="533"></line>
                <line stroke="#b8b8b1" x1="597.1" x2="597.1" y1="528" y2="533"></line>
                <line stroke="#b8b8b1" x1="775.7" x2="775.7" y1="528" y2="533"></line>
                <text class="svg-sub" text-anchor="middle" x="240" y="545">0</text>
                <text class="svg-sub" text-anchor="middle" x="418.6" y="545">50</text>
                <text class="svg-sub" text-anchor="middle" x="597.1" y="545">100</text>
                <text class="svg-sub" text-anchor="middle" x="775.7" y="545">150 µs</text>

                <text class="svg-note" x="560" y="412">Matchers tried per hit, mean: 51.8 at 100 routes, 504.4 at 1,000.</text>
                <text class="svg-note" x="560" y="428">9.7× the matchers took 14.6× the time.</text>
                <text class="svg-note" x="560" y="444">A miss tries them all: 168 ÷ 8.0 ≈ 21×.</text>

                <text class="svg-note" x="20" y="572">Rows: blue = sentinel, grey = compiled config; thick black = the order /sec0/a/1 walks. Bars: green = hit, red = miss, black = Set.has.</text>
                <text class="svg-note" x="20" y="590">For scale, a whole static request took 2,370 µs to first byte at p50 (e4-latency.mjs).</text>
              </svg>
