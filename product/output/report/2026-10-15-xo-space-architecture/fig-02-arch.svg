              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" x="24" y="30">OPERATOR SPACE</text>
              <rect fill="#f7f7f5" height="88" rx="10" stroke="#b8b8b1" width="360" x="20" y="42"></rect>
              <text fill="#252525" font-size="13" text-anchor="middle" x="200" y="76">the operator (a browser)</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="middle" x="200" y="98">monitor tabs · control panel · manual</text>
              <rect fill="#f7f7f5" height="88" rx="10" stroke="#b8b8b1" width="660" x="480" y="42"></rect>
              <text fill="#252525" font-size="13" text-anchor="middle" x="810" y="76">agent processes, launched by cwd inside a unit</text>
              <text fill="#777772" font-family="SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="middle" x="810" y="98">claude code · codex · pi · openclaw · hermes</text>

              
              <line stroke="#b8b8b1" stroke-dasharray="8 5" x1="20" x2="1140" y1="160" y2="160"></line>
              <text fill="#d98226" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" x="30" y="152">system calls · HTTP :5002 · scopes resolve every path</text>
              <text fill="#d98226" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" text-anchor="end" x="1130" y="152">device I/O · agents write their own native logs</text>
