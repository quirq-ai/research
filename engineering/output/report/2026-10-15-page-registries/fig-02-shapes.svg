                <text class="svg-sub" x="36" y="184">ProductPage</text>
                <text class="svg-note" x="26" y="242">One lookup per request.</text>
                <text class="svg-note" x="26" y="264">Registry ≈ 10 entries.</text>
                <text class="svg-note" x="26" y="286">New layout = code change.</text>
                <text class="svg-sub" x="26" y="320">use when layouts are few and stable</text>

