<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="A control flow graph with three basic blocks"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1000.0" height="330.0" fill="#ffffff"/>
              <rect fill="#f7f7f5" height="112" rx="8" stroke="#deded9" width="300" x="350" y="24"></rect>
              <text class="svg-lane" x="366" y="46">BLOCK 0</text>
              <text class="svg-step" x="366" y="70">t = x * y</text>
              <text class="svg-step" x="366" y="92">c = x &gt; 0</text>
              <text class="svg-step" x="366" y="114">branch c</text>

              <line stroke="#252525" stroke-width="2" x1="430" x2="270" y1="136" y2="188"></line>
              <text class="svg-sub" x="300" y="168">true</text>
              <line stroke="#252525" stroke-width="2" x1="570" x2="730" y1="136" y2="188"></line>
              <text class="svg-sub" x="672" y="168">false</text>

              <rect fill="#dfede5" height="82" rx="8" stroke="#367f59" width="300" x="120" y="188"></rect>
              <text class="svg-lane" x="136" y="210">BLOCK 1</text>
              <text class="svg-step" x="136" y="236">r = t + 1</text>
              <text class="svg-step" x="136" y="258">return r</text>

              <rect fill="#f3dfdc" height="82" rx="8" stroke="#ad4b43" width="300" x="580" y="188"></rect>
              <text class="svg-lane" x="596" y="210">BLOCK 2</text>
              <text class="svg-step" x="596" y="236">return 0</text>

              <line stroke="#deded9" x1="60" x2="60" y1="30" y2="300"></line>
              <text class="svg-note" x="80" y="300">Everything in block 0 runs. Always. Including the multiply that block 2 never uses.</text>
            </svg>
