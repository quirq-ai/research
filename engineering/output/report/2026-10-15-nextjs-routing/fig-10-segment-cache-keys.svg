<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-label="Three bands. Top, the route cache key: pathname /sec0/a/2, search, and nextUrl /sec0/a/1; when the response lands, nextUrl is re-keyed to Fallback unless the response varied on Next-Url, in which case the referrer stays in the key. Middle, four segment-cache vary paths, each a request key, then a search slot for pages only, then path params nearest first: row 1, /sec0/a/$d$id/__PAGE__ with search Fallback and id 2, a concrete page entry; row 2, /sec0/a/$d$id with no search slot and id re-keyed from 2 to Fallback because the segment reported reading no params; row 3, the route-group key /!KG1hcmtldGluZyk/about/__PAGE__ with no params; row 4, the App Shell path with search and id both Fallback. Bottom, the render tree before and after the soft navigation /sec0/a/1 to /sec0/a/2: the root layout, sec0 and a CacheNodes are reused and greyed, while [id] and __PAGE__ are new nodes; with every segment cached, no request is sent."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="670.0" fill="#ffffff"/>
