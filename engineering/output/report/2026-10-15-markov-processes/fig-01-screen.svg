<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" role="img" aria-label="A row of six states X0 to X5 joined by arrows. A vertical band marks the present state X3. Two dashed arrows that would jump from X0 and X1 directly to X4 are struck through, showing that the past may influence the future only through the present. Below, a caption band distinguishes the process from the state space."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }</style><rect x="0.0" y="0.0" width="1120.0" height="290.0" fill="#ffffff"/>
                <defs>
                  <marker id="mem-arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="mem-arr-red" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#ad4b43"></path></marker>
                </defs>

                <rect fill="#f7e3c8" height="132" rx="8" stroke="#d98226" stroke-dasharray="4 3" width="112" x="536" y="36"></rect>
                <text class="svg-lane" style="fill:#d98226" text-anchor="middle" x="592" y="28">THE PRESENT</text>

                <text class="svg-lane" x="40" y="28">THE PAST · CONDITIONED AWAY</text>
                <text class="svg-lane" x="700" y="28">THE FUTURE</text>

                <g>
                  <circle cx="80" cy="102" fill="#f7f7f5" r="30" stroke="#b8b8b1"></circle><text class="svg-step" style="fill:#7a7a74" text-anchor="middle" x="80" y="108">X₀</text>
                  <circle cx="250" cy="102" fill="#f7f7f5" r="30" stroke="#b8b8b1"></circle><text class="svg-step" style="fill:#7a7a74" text-anchor="middle" x="250" y="108">X₁</text>
                  <circle cx="420" cy="102" fill="#f7f7f5" r="30" stroke="#b8b8b1"></circle><text class="svg-step" style="fill:#7a7a74" text-anchor="middle" x="420" y="108">X₂</text>
                  <circle cx="592" cy="102" fill="#ffffff" r="34" stroke="#d98226" stroke-width="2.5"></circle><text class="svg-step" style="fill:#252525" text-anchor="middle" x="592" y="109">Xₜ</text>
                  <circle cx="762" cy="102" fill="#e0ebf2" r="30" stroke="#3c6f97"></circle><text class="svg-step" style="fill:#25455c" text-anchor="middle" x="762" y="108">X₍ₜ₊₁₎</text>
                  <circle cx="932" cy="102" fill="#e0ebf2" r="30" stroke="#3c6f97"></circle><text class="svg-step" style="fill:#25455c" text-anchor="middle" x="932" y="108">X₍ₜ₊₂₎</text>
                </g>

                <line marker-end="url(#mem-arr)" stroke="#252525" stroke-width="2" x1="112" x2="212" y1="102" y2="102"></line>
                <line marker-end="url(#mem-arr)" stroke="#252525" stroke-width="2" x1="282" x2="382" y1="102" y2="102"></line>
                <line marker-end="url(#mem-arr)" stroke="#252525" stroke-width="2" x1="452" x2="550" y1="102" y2="102"></line>
                <line marker-end="url(#mem-arr)" stroke="#252525" stroke-width="2.5" x1="628" x2="726" y1="102" y2="102"></line>
                <line marker-end="url(#mem-arr)" stroke="#252525" stroke-width="2.5" x1="794" x2="894" y1="102" y2="102"></line>

                <path d="M80 72 C 300 -8 640 -8 756 70" fill="none" marker-end="url(#mem-arr-red)" stroke="#ad4b43" stroke-dasharray="5 4" stroke-width="1.6"></path>
                <path d="M250 72 C 420 6 660 6 752 72" fill="none" marker-end="url(#mem-arr-red)" stroke="#ad4b43" stroke-dasharray="5 4" stroke-width="1.6"></path>
                <g stroke="#ad4b43" stroke-width="2.5">
                  <line x1="404" x2="424" y1="6" y2="26"></line><line x1="424" x2="404" y1="6" y2="26"></line>
                </g>
                <text class="svg-sub" style="fill:#ad4b43" x="40" y="168">forbidden: no edge may skip the present</text>

                <line stroke="#deded9" x1="40" x2="1080" y1="186" y2="186"></line>
                <text class="svg-lane" x="40" y="214">WHAT IS ASSUMED</text>
                <text class="svg-sub" x="40" y="238">1 · Markov — the arrow into X₍ₜ₊₁₎ depends on Xₜ alone</text>
                <text class="svg-sub" x="40" y="260">2 · Time-homogeneous — that dependence is the same function at every t</text>
                <text class="svg-lane" x="600" y="214">WHAT IS NOT ASSUMED</text>
                <text class="svg-sub" x="600" y="238">Independence. Consecutive states may be strongly correlated.</text>
                <text class="svg-sub" x="600" y="260">A small state space. S may be infinite, continuous, or both.</text>
              </svg>
