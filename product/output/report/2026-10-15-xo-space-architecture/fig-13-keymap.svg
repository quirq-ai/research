              <text class="svg-sub" text-anchor="middle" x="800" y="420">bare uuid</text>
              <text class="svg-sub" text-anchor="middle" x="800" y="436">task id "7" inside</text>
              <line stroke="#3c6f97" stroke-width="1.6" x1="800" x2="800" y1="302" y2="372"></line>

              <rect fill="#e0ebf2" height="76" rx="9" stroke="#3c6f97" width="180" x="930" y="374"></rect>
              <text class="svg-step" text-anchor="middle" x="1020" y="400">timeline.jsonl</text>
              <text class="svg-sub" text-anchor="middle" x="1020" y="420">bare uuid per line</text>
              <text class="svg-sub" text-anchor="middle" x="1020" y="436">no event id</text>
              <line stroke="#3c6f97" stroke-width="1.6" x1="1020" x2="1020" y1="302" y2="372"></line>

              
              <text class="svg-lane" x="24" y="60">PROJECT IDENTITY</text>
              <rect fill="#dfede5" height="46" rx="9" stroke="#367f59" width="200" x="20" y="72"></rect>
              <text class="svg-step" text-anchor="middle" x="120" y="94">the directory name</text>
              <text class="svg-sub" text-anchor="middle" x="120" y="110">every path, every route</text>

              <rect fill="#f3dfdc" height="46" rx="9" stroke="#ad4b43" stroke-dasharray="6 4" width="200" x="250" y="72"></rect>
              <text class="svg-step" text-anchor="middle" x="350" y="94">project.json · pid uuid</text>
              <text class="svg-sub" text-anchor="middle" x="350" y="110">written once, read by nothing</text>
              <line stroke="#ad4b43" stroke-dasharray="5 4" stroke-width="1.4" x1="450" x2="500" y1="95" y2="95"></line>
              <text class="svg-sub" fill="#ad4b43" x="508" y="99">dead end</text>

              
              <text class="svg-lane" x="24" y="500">NO IDENTITY AT ALL — COUNTED, NEVER JOINED</text>
              <rect fill="#f7f7f5" height="34" rx="8" stroke="#b8b8b1" width="1120" x="20" y="512"></rect>
              <text class="svg-sub" x="36" y="534">message · tool call · timeline event · file leaf   —   no stable id, so no de-duplication, no correction, and no cross-store reconciliation</text>
            </svg>
