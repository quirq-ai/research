<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 1020 650" role="img" aria-label="A tree map of Swarming pools drawn to scale by bot count. The chromium.tests pool fills the top block, split into a GCE band subdivided by cloud zone and a physical band subdivided by lab. A dashed outline around it shows the larger reading taken the previous afternoon. Below, a row holds the avd, gpu and try pools at the same scale. A third row holds the small builder pools and the long tail, not to scale. A footer strip shows twenty-four-hour task counts as horizontal bars."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
