<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="A PHI node whose data inputs align positionally with its REGION node's control inputs"><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-num { font: 700 10px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d98226; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="400.0" fill="#ffffff"/>
              <rect fill="#dfede5" height="44" rx="7" stroke="#367f59" stroke-width="1.4" width="180" x="60" y="34"></rect>
              <text class="svg-step" text-anchor="middle" x="150" y="53">B1:</text>
              <text class="svg-sub" text-anchor="middle" x="150" y="70">x1 := …</text>

              <rect fill="#f3dfdc" height="44" rx="7" stroke="#ad4b43" stroke-width="1.4" width="180" x="440" y="34"></rect>
              <text class="svg-step" text-anchor="middle" x="530" y="53">B2:</text>
              <text class="svg-sub" text-anchor="middle" x="530" y="70">x2 := …</text>

              
              <g fill="none" stroke="#252525" stroke-width="2.4">
                <line x1="150" x2="248" y1="78" y2="168"></line>
                <line x1="530" x2="432" y1="78" y2="168"></line>
                <line x1="248" x2="248" y1="212" y2="288"></line>
              </g>
              
              <g fill="none" stroke="#3c6f97" stroke-width="1.3">
                <polyline points="80,78 80,258 340,258 340,288"></polyline>
                <polyline points="600,78 600,258 432,258 432,288"></polyline>
              </g>

              <rect fill="#ffffff" height="44" rx="7" stroke="#252525" stroke-width="1.8" width="280" x="200" y="168"></rect>
              <text class="svg-step" text-anchor="middle" x="340" y="196">REGION</text>
              <circle cx="248" cy="168" fill="#ffffff" r="8" stroke="#252525" stroke-width="1.4"></circle>
              <text class="svg-num" text-anchor="middle" x="248" y="172">0</text>
              <circle cx="432" cy="168" fill="#ffffff" r="8" stroke="#252525" stroke-width="1.4"></circle>
              <text class="svg-num" text-anchor="middle" x="432" y="172">1</text>

              <rect fill="#e0ebf2" height="44" rx="7" stroke="#3c6f97" stroke-width="1.8" width="280" x="200" y="288"></rect>
              <text class="svg-step" text-anchor="middle" x="340" y="316">PHI  x3</text>
              <circle cx="248" cy="288" fill="#ffffff" r="8" stroke="#252525" stroke-width="1.4"></circle>
              <text class="svg-num" text-anchor="middle" x="248" y="292">0</text>
              <circle cx="340" cy="288" fill="#ffffff" r="8" stroke="#3c6f97" stroke-width="1.4"></circle>
              <text class="svg-num" text-anchor="middle" x="340" y="292">1</text>
              <circle cx="432" cy="288" fill="#ffffff" r="8" stroke="#3c6f97" stroke-width="1.4"></circle>
              <text class="svg-num" text-anchor="middle" x="432" y="292">2</text>

              <text class="svg-note" x="60" y="368">The PHI has no run-time operation. It marks where values merge, and it is folded</text>
              <text class="svg-note" x="60" y="386">back into ordinary blocks and copies when machine code is finally emitted.</text>

              
              <line stroke="#deded9" x1="680" x2="680" y1="30" y2="340"></line>
              <text class="svg-lane" x="716" y="46">THE ALIGNMENT</text>

              <text class="svg-step" x="716" y="82">REGION[0]</text>
              <text class="svg-sub" x="830" y="82">control arriving from B1</text>
              <text class="svg-step" x="716" y="112">PHI[1]</text>
              <text class="svg-sub" x="830" y="112">the value x1, defined in B1</text>
              <g fill="none" stroke="#d98226" stroke-dasharray="4 3" stroke-width="1.4">
                <path d="M706 76 q-14 22 0 32"></path>
              </g>

              <line stroke="#deded9" x1="716" x2="1080" y1="134" y2="134"></line>

              <text class="svg-step" x="716" y="168">REGION[1]</text>
              <text class="svg-sub" x="830" y="168">control arriving from B2</text>
              <text class="svg-step" x="716" y="198">PHI[2]</text>
              <text class="svg-sub" x="830" y="198">the value x2, defined in B2</text>
              <g fill="none" stroke="#d98226" stroke-dasharray="4 3" stroke-width="1.4">
                <path d="M706 162 q-14 22 0 32"></path>
              </g>

              <line stroke="#deded9" x1="716" x2="1080" y1="220" y2="220"></line>
              <text class="svg-note" x="716" y="250">PHI[0] is the REGION itself — the only</text>
              <text class="svg-note" x="716" y="268">control input the PHI needs, because the</text>
              <text class="svg-note" x="716" y="286">REGION already holds the rest.</text>
              <text class="svg-note" x="716" y="316">Add a third predecessor and you append</text>
              <text class="svg-note" x="716" y="334">one slot to each node. Nothing else changes.</text>
            </svg>
