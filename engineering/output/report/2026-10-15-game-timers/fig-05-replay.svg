<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-label="A defender snapshot of 2,532 bytes plus a command list of 60 placements at 8 bytes each plus a deterministic engine reproduces the battle exactly, for a total replay size of about 3 kibibytes, against 45 megabytes for a 3-minute video at 2 megabits per second — a ratio of 14,629 to one. At ten million daily players and five attacks each, that is 154 gigabytes of replay traffic per day against 2,250 terabytes of video."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="380.0" fill="#ffffff"/>
                <defs>
                  <marker id="rp-arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                </defs>
                <rect fill="#e0ebf2" height="90" rx="8" stroke="#3c6f97" width="250" x="0" y="40"></rect>
                <text class="svg-step" x="16" y="68">Defender snapshot</text>
                <text class="svg-sub" x="16" y="94">the village, frozen</text>
                <text class="svg-sub" x="16" y="118">2,532 B</text>

                <text class="svg-step" x="266" y="92">+</text>

                <rect fill="#dfede5" height="90" rx="8" stroke="#367f59" width="290" x="300" y="40"></rect>
                <text class="svg-step" x="316" y="68">Command list</text>
                <text class="svg-sub" x="316" y="94">(tick u32, unit u16, x u8, y u8)</text>
                <text class="svg-sub" x="316" y="118">60 × 8 B = 480 B</text>

                <text class="svg-step" x="606" y="92">+</text>

                <rect fill="#ece6f3" height="90" rx="8" stroke="#765b98" width="250" x="640" y="40"></rect>
                <text class="svg-step" x="656" y="68">Deterministic engine</text>
                <text class="svg-sub" x="656" y="94">already on every device</text>
                <text class="svg-sub" x="656" y="118">0 B of payload</text>

                <line marker-end="url(#rp-arr)" stroke="#252525" stroke-width="2" x1="906" x2="960" y1="85" y2="85"></line>
                <rect fill="#f7e3c8" height="90" rx="8" stroke="#d98226" stroke-width="2" width="150" x="970" y="40"></rect>
                <text class="svg-step" x="986" y="68">The battle</text>
                <text class="svg-sub" x="986" y="94">exactly, every</text>
                <text class="svg-sub" x="986" y="118">time</text>

                <line stroke="#deded9" x1="0" x2="1120" y1="164" y2="164"></line>
                <text class="svg-lane" x="0" y="190">WHAT THAT SAVES</text>
                <text class="svg-sub" x="0" y="220">replay                  3.0 KiB</text>
                <rect fill="#367f59" height="18" width="6" x="300" y="206"></rect>
                <text class="svg-sub" x="0" y="248">the same 3 minutes as video, at 2 Mbps       45.0 MB</text>
                <rect fill="#ad4b43" height="18" width="780" x="300" y="234"></rect>
                <text class="svg-sub" x="0" y="278">ratio 14,629 : 1</text>

                <rect fill="#f7f7f5" height="78" rx="8" stroke="#deded9" width="540" x="0" y="296"></rect>
                <text class="svg-lane" x="16" y="322">AT 10M DAILY PLAYERS × 5 ATTACKS</text>
                <text class="svg-sub" x="16" y="348">replays   154 GB/day   ·   video   2,250 TB/day</text>
                <text class="svg-note" x="16" y="370">One is a line item. The other is the company.</text>

                <rect fill="#f7e3c8" height="78" rx="8" stroke="#d98226" width="550" x="570" y="296"></rect>
                <text class="svg-lane" x="586" y="322">AND IT IS NOT JUST BANDWIDTH</text>
                <text class="svg-sub" x="586" y="348">The server can re-run the list and check the claimed result.</text>
                <text class="svg-sub" x="586" y="370">A video proves nothing; a command list is evidence.</text>
              </svg>
