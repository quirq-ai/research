<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 1080 476" role="img" aria-label="Five horizontal lanes. Workstation: git cl upload and git cl try. Gerrit: the magic ref push and the review gates. LUCI CV: a run, then a gate narrowing 604 builder entries to 32 required. Buildbucket and Swarming: a previous run's reusable builds feeding back into the gate, and 32 fresh tryjobs. ResultDB and Gerrit checks: a stub pointing at later sections."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="-6.0" width="1080.0" height="476.0" fill="#ffffff"/>
      <defs>
        <marker id="fig-commit-path-arr-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
        <marker id="fig-commit-path-arr-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
        <marker id="fig-commit-path-arr-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
      </defs>

      <line stroke="#deded9" x1="0" x2="1080" y1="104" y2="104"></line>
      <line stroke="#deded9" x1="0" x2="1080" y1="196" y2="196"></line>
      <line stroke="#deded9" x1="0" x2="1080" y1="304" y2="304"></line>
