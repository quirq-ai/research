<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 512" role="img" aria-label="Left two-thirds: ninja invokes gomacc, which passes an ExecReq over the unix socket goma.ipc to the compiler_proxy daemon holding the IncludeProcessor, DepsCache, FileHashCache and LocalOutputCache; compiler_proxy calls the goma backend at goma.chromium.org port 443 under /cxx-compiler-service over HTTP/1.1 with protobuf bodies, which routes to internal exec workers or to remoteexec_proxy in front of RBE. Right third: the CompileTask state chain INIT, SETUP, FILE_REQ, CALL_EXEC, FILE_RESP, FINISHED, with a parallel branch to LOCAL_RUN and LOCAL_FINISHED and a LOCAL_OUTPUT cache-hit shortcut, all rejoining FINISHED."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1100.0" height="512.0" fill="#ffffff"/>
                <defs>
                  <marker id="fig-goma-task-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="fig-goma-task-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                  <marker id="fig-goma-task-purple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#765b98"></path></marker>
                </defs>

                <text class="svg-lane" x="16" y="22">ONE COMPILE, END TO END</text>
                <text class="svg-lane" x="660" y="22">CompileTask STATE</text>

                <rect fill="#ffffff" height="44" rx="8" stroke="#252525" width="150" x="16" y="40"></rect>
                <text class="svg-step" x="30" y="62">ninja</text>
                <text class="svg-sub" x="30" y="78">-j500</text>
                <rect fill="#ffffff" height="44" rx="8" stroke="#252525" width="200" x="186" y="40"></rect>
                <text class="svg-step" x="200" y="62">gomacc</text>
                <text class="svg-sub" x="200" y="78">argv → ExecReq · masquerade</text>
                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="166" x2="186" y1="62" y2="62"></line>
                <line marker-end="url(#fig-goma-task-blue)" stroke="#3c6f97" stroke-width="1.5" x1="286" x2="286" y1="84" y2="120"></line>
                <text class="svg-sub" x="294" y="106">goma.ipc</text>

                <rect fill="#f7f7f5" height="250" rx="10" stroke="#b8b8b1" width="290" x="16" y="120"></rect>
                <text class="svg-step" x="30" y="144">compiler_proxy</text>
                <text class="svg-sub" x="30" y="161">1 worker per CPU · 2,048 active tasks</text>
                <rect fill="#dfede5" height="42" rx="6" stroke="#367f59" width="266" x="28" y="172"></rect>
                <text class="svg-sub" x="42" y="190">IncludeProcessor</text>
                <text class="svg-note" x="42" y="206">directives only · ~4,000 macros on Linux</text>
                <rect fill="#ffffff" height="42" rx="6" stroke="#deded9" width="266" x="28" y="222"></rect>
                <text class="svg-sub" x="42" y="240">DepsCache</text>
                <text class="svg-note" x="42" y="256">sha256(command) → input list</text>
                <rect fill="#ffffff" height="42" rx="6" stroke="#deded9" width="266" x="28" y="272"></rect>
                <text class="svg-sub" x="42" y="290">FileHashCache</text>
                <text class="svg-note" x="42" y="306">path → upload hash key</text>
                <rect fill="#ffffff" height="42" rx="6" stroke="#deded9" width="266" x="28" y="322"></rect>
                <text class="svg-sub" x="42" y="340">LocalOutputCache</text>
                <text class="svg-note" x="42" y="356">30 GB · 100,000 outputs</text>

                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="306" x2="350" y1="190" y2="190"></line>

                <rect fill="#f7f7f5" height="250" rx="10" stroke="#b8b8b1" width="290" x="350" y="120"></rect>
                <text class="svg-step" x="364" y="144">goma backend</text>
                <rect fill="#e0ebf2" height="70" rx="6" stroke="#3c6f97" width="266" x="362" y="156"></rect>
                <text class="svg-sub" x="376" y="176">goma.chromium.org:443</text>
                <text class="svg-note" x="376" y="194">/cxx-compiler-service · HTTP/1.1 protobuf</text>
                <text class="svg-note" x="376" y="212">/ping /e /blobs/ /s /l /sl</text>
                <rect fill="#ffffff" height="56" rx="6" stroke="#deded9" width="128" x="362" y="240"></rect>
                <text class="svg-sub" x="374" y="262">exec workers</text>
                <text class="svg-note" x="374" y="280">internal</text>
                <rect fill="#ece6f3" height="56" rx="6" stroke="#765b98" width="128" x="500" y="240"></rect>
                <text class="svg-sub" x="512" y="262">remoteexec</text>
                <text class="svg-note" x="512" y="280">proxy → RBE</text>
                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="426" x2="426" y1="226" y2="240"></line>
                <line marker-end="url(#fig-goma-task-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="564" x2="564" y1="226" y2="240"></line>
                <text class="svg-note" x="364" y="322">From November 2020 the backend was RBE —</text>
                <text class="svg-note" x="364" y="340">one protocol wrapping another.</text>

                <rect fill="#ffffff" height="44" rx="8" stroke="#252525" width="160" x="660" y="40"></rect>
                <text class="svg-sub" x="674" y="62">INIT</text>
                <text class="svg-note" x="674" y="78">fast-fallback subproc</text>
                <rect fill="#dfede5" height="44" rx="8" stroke="#367f59" width="160" x="660" y="100"></rect>
                <text class="svg-sub" x="674" y="122">SETUP</text>
                <text class="svg-note" x="674" y="138">include processor</text>
                <rect fill="#e0ebf2" height="44" rx="8" stroke="#3c6f97" width="160" x="660" y="160"></rect>
                <text class="svg-sub" x="674" y="182">FILE_REQ</text>
                <text class="svg-note" x="674" y="198">upload inputs</text>
                <rect fill="#e0ebf2" height="44" rx="8" stroke="#3c6f97" width="160" x="660" y="220"></rect>
                <text class="svg-sub" x="674" y="242">CALL_EXEC</text>
                <text class="svg-note" x="674" y="258">Exec RPC</text>
                <rect fill="#e0ebf2" height="44" rx="8" stroke="#3c6f97" width="160" x="660" y="280"></rect>
                <text class="svg-sub" x="674" y="302">FILE_RESP</text>
                <text class="svg-note" x="674" y="318">download outputs</text>
                <rect fill="#ffffff" height="44" rx="8" stroke="#252525" width="160" x="660" y="372"></rect>
                <text class="svg-sub" x="674" y="394">FINISHED</text>
                <text class="svg-note" x="674" y="410">response sent</text>

                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="740" x2="740" y1="84" y2="100"></line>
                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="740" x2="740" y1="144" y2="160"></line>
                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="740" x2="740" y1="204" y2="220"></line>
                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="740" x2="740" y1="264" y2="280"></line>
                <line marker-end="url(#fig-goma-task-ink)" stroke="#252525" stroke-width="2.5" x1="740" x2="740" y1="324" y2="372"></line>

                <rect fill="#ece6f3" height="44" rx="8" stroke="#765b98" width="170" x="880" y="100"></rect>
                <text class="svg-sub" x="894" y="122">LOCAL_RUN</text>
                <text class="svg-note" x="894" y="138">no goma call issued</text>
                <rect fill="#ece6f3" height="44" rx="8" stroke="#765b98" width="170" x="880" y="160"></rect>
                <text class="svg-sub" x="894" y="182">LOCAL_FINISHED</text>
                <text class="svg-note" x="894" y="198">fast fallback won</text>
                <rect fill="#f7e3c8" height="44" rx="8" stroke="#d98226" width="170" x="880" y="280"></rect>
                <text class="svg-sub" x="894" y="302">LOCAL_OUTPUT</text>
                <text class="svg-note" x="894" y="318">LocalOutputCache hit</text>

                <path d="M820 62 L860 62 L860 122 L880 122" fill="none" marker-end="url(#fig-goma-task-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5"></path>
                <line marker-end="url(#fig-goma-task-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5" x1="965" x2="965" y1="144" y2="160"></line>
                <path d="M1050 182 L1076 182 L1076 394 L820 394" fill="none" marker-end="url(#fig-goma-task-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5"></path>
                <path d="M820 122 L838 122 L838 302 L880 302" fill="none" marker-end="url(#fig-goma-task-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5"></path>
                <path d="M965 324 L965 352 L780 352 L780 372" fill="none" marker-end="url(#fig-goma-task-purple)" stroke="#765b98" stroke-dasharray="5 4" stroke-width="1.5"></path>

                <text class="svg-note" x="16" y="440">FILE_REQ ships each input as a FileBlob keyed by sha256 of the serialized blob — under 2 MB it is embedded in the request, larger files split into FILE_META plus FILE_CHUNKs.</text>
                <text class="svg-note" x="16" y="458">CALL_EXEC carries hermetic_mode = "error": the backend must hold a compiler with the same version string and binary hash, or the task fails and is never retried for that compiler.</text>
                <text class="svg-note" x="16" y="476">GOMA_USE_LOCAL compiles locally when the machine is idle; LOCAL_RUN_PREFERENCE = 3 stops the race if that local process started before the task reached this state.</text>
                <text class="svg-note" x="16" y="500">thick black = control · thin blue = data · dashed purple = the local race and the RE-API detour</text>
              </svg>
