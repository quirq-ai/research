<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="A trellis with two hidden states, Human and Bot, over four observations: page, api, api, asset. Each cell shows the best path probability reaching it. Bold arrows mark surviving backpointers, thin grey arrows mark losing candidates. The best path is Human, Bot, Bot, Human with probability 0.0013328 out of a total observation probability of 0.005389625, so the single best path carries 24.7 percent of the posterior mass."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-step { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; fill: #252525; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="470.0" fill="#ffffff"/>
                <defs>
