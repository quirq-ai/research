<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-label="Three horizontal lanes. Server lane: fetch document, parse with schema, collect data requirements from registry entries, one batched fetch, then walk the tree looking up each tag. Boundary lane: the serialised tree crosses to the client, with only interactive blocks marked. Client lane: hydrate only the marked blocks, each wrapped in its own error boundary. A callout marks the batched fetch as the cure for block-level N+1."><style>.svg-lane { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; letter-spacing: 0.06em; }
.svg-sub { font: 400 10.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #777772; }
.svg-note { font: italic 11px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; fill: #4f4f4b; }</style><rect x="0.0" y="0.0" width="1120.0" height="380.0" fill="#ffffff"/>
                <defs>
                  <marker id="ren-arr" markerHeight="5.5" markerWidth="5.5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#252525"></path></marker>
                  <marker id="ren-arr-b" markerHeight="5.5" markerWidth="5.5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#3c6f97"></path></marker>
                </defs>

                <text class="svg-lane" x="24" y="60">SERVER</text>
                <line stroke="#deded9" stroke-width="1.2" x1="20" x2="1100" y1="76" y2="76"></line>

                <rect fill="#f7f7f5" height="64" rx="8" stroke="#b8b8b1" stroke-width="1.6" width="150" x="20" y="92"></rect>
                <text class="svg-sub" x="34" y="118">fetch document</text>
                <text class="svg-sub" x="34" y="140">CMS · DB · agent</text>
                <line marker-end="url(#ren-arr-b)" stroke="#3c6f97" stroke-width="1.5" x1="174" x2="204" y1="124" y2="124"></line>

                <rect fill="#e0ebf2" height="64" rx="8" stroke="#3c6f97" stroke-width="1.8" width="150" x="208" y="92"></rect>
                <text class="svg-sub" x="222" y="118">safeParse</text>
                <text class="svg-sub" x="222" y="140">typed from here on</text>
                <line marker-end="url(#ren-arr-b)" stroke="#3c6f97" stroke-width="1.5" x1="362" x2="392" y1="124" y2="124"></line>

                <rect fill="#f7e3c8" height="64" rx="8" stroke="#d98226" stroke-width="1.8" width="170" x="396" y="92"></rect>
                <text class="svg-sub" x="410" y="118">collect entry.resolve</text>
                <text class="svg-sub" x="410" y="140">one pass, no render</text>
                <line marker-end="url(#ren-arr-b)" stroke="#3c6f97" stroke-width="1.5" x1="570" x2="600" y1="124" y2="124"></line>

                <rect fill="#dfede5" height="64" rx="8" stroke="#367f59" stroke-width="2" width="150" x="604" y="92"></rect>
                <text class="svg-sub" x="618" y="118">one batched fetch</text>
                <text class="svg-sub" x="618" y="140">not twelve</text>
                <line marker-end="url(#ren-arr-b)" stroke="#3c6f97" stroke-width="1.5" x1="758" x2="788" y1="124" y2="124"></line>

                <rect fill="#f7e3c8" height="64" rx="8" stroke="#d98226" stroke-width="2.2" width="170" x="792" y="92"></rect>
                <text class="svg-sub" x="806" y="118">walk + lookup(tag)</text>
                <text class="svg-sub" x="806" y="140">key = block.id</text>

                <path d="M877 160 L877 202" marker-end="url(#ren-arr)" stroke="#252525" stroke-width="2.6"></path>

                <text class="svg-lane" x="24" y="196">BOUNDARY</text>
                <line stroke="#deded9" stroke-width="1.2" x1="20" x2="1100" y1="212" y2="212"></line>
                <rect fill="#f7f7f5" height="52" rx="8" stroke="#b8b8b1" stroke-width="1.6" width="440" x="620" y="216"></rect>
                <text class="svg-sub" x="636" y="248">serialised tree — interactive blocks marked, the rest already HTML</text>

                <path d="M877 272 L877 306" marker-end="url(#ren-arr)" stroke="#252525" stroke-width="2.6"></path>

                <text class="svg-lane" x="24" y="300">CLIENT</text>
                <line stroke="#deded9" stroke-width="1.2" x1="20" x2="1100" y1="316" y2="316"></line>
                <rect fill="#ece6f3" height="48" rx="8" stroke="#765b98" stroke-width="1.8" width="210" x="620" y="320"></rect>
                <text class="svg-sub" x="634" y="350">hydrate marked blocks</text>
                <rect fill="#f3dfdc" height="48" rx="8" stroke="#ad4b43" stroke-width="1.8" width="214" x="846" y="320"></rect>
                <text class="svg-sub" x="860" y="350">error boundary per block</text>

                <text class="svg-note" x="20" y="230">The collect-then-fetch pass is the whole difference</text>
                <text class="svg-note" x="20" y="254">between a page that makes one query and a page that</text>
                <text class="svg-note" x="20" y="278">makes twelve in an order nobody chose.</text>
              </svg>
